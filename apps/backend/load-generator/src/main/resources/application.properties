quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.application.name=load-generator
# Identifies which instance answered (parity with the other backends).
app.instance-name=${APP_INSTANCE_NAME:load-generator}

# ---------------------------------------------------------------------------
# Load generator
# ---------------------------------------------------------------------------
# Base URL of the target gateway, e.g. https://banking-api-connectivity.<domain>.
# Left empty by default; set LOADGEN_TARGET_BASE_URL in the Deployment. When it
# is empty the generator stays idle (it will not fire) even if autostart is on.
loadgen.target-base-url=${LOADGEN_TARGET_BASE_URL:}
# API key for the authenticated endpoints (/api/v1/*, /api/test/*). Comes from
# the banking-api api-key Secret via LOADGEN_API_KEY in the Deployment.
loadgen.api-key=${LOADGEN_API_KEY:}
# Requests per second (tunable at runtime via POST /loadgen/config?rps=N).
loadgen.rps=${LOADGEN_RPS:5}
# Fraction of requests aimed at 5xx errors (0.0-1.0). The rest is healthy 2xx
# traffic. Tunable at runtime via POST /loadgen/config?errorRate=X.
loadgen.error-rate=${LOADGEN_ERROR_RATE:0.8}
# Start firing on boot (once a target URL is set).
loadgen.autostart=${LOADGEN_AUTOSTART:true}
# Skip TLS verification — the lab gateway uses self-signed / Let's Encrypt certs.
loadgen.insecure-tls=${LOADGEN_INSECURE_TLS:true}
# Per-request timeout (ms) and a ceiling on concurrent in-flight requests.
loadgen.timeout-ms=${LOADGEN_TIMEOUT_MS:5000}
loadgen.max-in-flight=${LOADGEN_MAX_IN_FLIGHT:500}

# Health probes at /q/health via smallrye-health; Prometheus metrics at /q/metrics.
quarkus.http.access-log.enabled=${QUARKUS_HTTP_ACCESS_LOG_ENABLED:false}
quarkus.http.access-log.log-to-file=false
