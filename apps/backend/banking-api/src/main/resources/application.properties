quarkus.http.port=8080
quarkus.http.host=0.0.0.0
# OpenAPI / Swagger UI — ship the interactive docs in every build (not just dev)
# so the spec is validatable via the Developer Portal and the RHCL console plugin.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-openapi.path=/q/openapi
# Instance name helps identify which backend answered.
app.instance-name=${APP_INSTANCE_NAME:backend-a}
# Toggle for PoC validation endpoints under /api/test/* and /api/whoami.
app.test-endpoints.enabled=${APP_TEST_ENDPOINTS_ENABLED:true}
# CORS desabilitado no backend POR DESIGN. A injeção de headers
# Access-Control-* é responsabilidade do Gateway (filtro
# ResponseHeaderModifier no HTTPRoute — req014 do PoC). Manter desligado
# aqui garante que o backend é a única fonte de verdade pra "negócio"
# e o gateway é a única fonte pra "exposição", sem ambiguidade na demo.
#
# Pra rodar `mvn quarkus:dev` localmente com Flutter web chamando direto
# o backend (sem gateway), sobrescreve em runtime:
#   QUARKUS_HTTP_CORS_ENABLED=true mvn quarkus:dev
#
# Os campos abaixo ficam configurados pra ativação por env mas ficam
# inertes enquanto cors.enabled=false.
quarkus.http.cors.enabled=false
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-flow-trace-id,x-flow-mode,x-client-app,x-consumer-id,x-test-mode,x-jwt-sub,x-jwt-scope,x-forwarded-for,x-forwarded-host,x-forwarded-proto,x-forwarded-prefix,x-grpc-web,x-user-agent,grpc-timeout
quarkus.http.cors.exposed-headers=grpc-status,grpc-message,grpc-encoding,grpc-accept-encoding,x-instance,x-consumer-id,x-context-tokens,x-context-items
# OpenTelemetry (Phase F). Disabled by default so `mvn quarkus:dev` works without a collector.
quarkus.application.name=banking-api
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.exporter.otlp.protocol=grpc
# REQ 038 - propagação de traces backend→backend. /api/test/propagate chama o
# microserviço ledger-api downstream. A propagação do contexto W3C `traceparent`
# é feita pelo AGENTE Java injetado (não por código). Aqui só configuramos PARA
# ONDE chamar; o Deployment sobrescreve via LEDGER_DIRECT_URL / LEDGER_GATEWAY_URL.
app.propagation.ledger.direct-url=${LEDGER_DIRECT_URL:http://localhost:8081}
app.propagation.ledger.gateway-url=${LEDGER_GATEWAY_URL:}
# Micrometer / Prometheus (Phase F).
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.http-server.enabled=true
# Phase B - file streaming. Bumps the request body limit so upload tests can drive
# requests larger than the Quarkus default of 10240K. Override with HTTP_MAX_BODY_SIZE.
quarkus.http.limits.max-body-size=${HTTP_MAX_BODY_SIZE:1G}
# Phase D - gRPC server. Lives on a separate port (default 9000) using HTTP/2 cleartext.
# Reflection enabled so `grpcurl -plaintext localhost:9000 list` works out of the box.
quarkus.grpc.server.port=${GRPC_PORT:9000}
quarkus.grpc.server.host=0.0.0.0
quarkus.grpc.server.enable-reflection-service=true
# Phase D - gRPC-Web. Expose gRPC over the main HTTP port so browsers (Flutter Web)
# can call it without a separate proxy. The PoC console issues raw POST requests to
# /io.gatewaysmashes.rhcl.grpc.BankingService/<Method> with content-type application/grpc-web.
quarkus.grpc.server.use-separate-server=false
quarkus.grpc.server.grpc-web=true
# Phase F - HTTP access log. Goes through the standard Quarkus logger
# (log-to-file=false) so every request shows up on stdout and is captured by
# `oc logs deploy/banking-api-v*` without any volume mount or sidecar.
# The category level is pinned to INFO so a global log-config tweak cannot
# silence the access log without also disabling the flag below.
# Pattern fields:
#   %h  remote IP                   %t  timestamp
#   %r  request line                %s  status
#   %b  bytes (response body)       %D  duration in microseconds
#   %{i,host}             hostname requested (lets you tell which HTTPRoute
#                          fronted the call: weighted., cors., timeout., …)
#   %{i,x-flow-trace-id}  PoC trace id propagated by the gateway (REQ 66)
#   %{i,x-consumer-id}    consumer (REQ 30/44)
#   %{i,x-route-version}  v1|v2 injected by the weighted HTTPRoute (REQ 05)
#   %{i,user-agent}       UA
# Disable with QUARKUS_HTTP_ACCESS_LOG_ENABLED=false.
quarkus.http.access-log.enabled=${QUARKUS_HTTP_ACCESS_LOG_ENABLED:true}
quarkus.http.access-log.log-to-file=false
quarkus.http.access-log.pattern=%h %l %u %t "%r" %s %b %D "%{i,host}" "%{i,x-flow-trace-id}" "%{i,x-consumer-id}" "%{i,x-route-version}" "%{i,user-agent}"
quarkus.log.category."io.quarkus.http.access-log".level=INFO
quarkus.log.category."io.quarkus.http.access-log".min-level=INFO
# Phase C - OpenAI-compatible mock provider (in-process; no external LLM).
# mock (default) | disabled (503 on /api/v1 AI routes)
app.openai.mode=${OPENAI_MODE:mock}
app.openai.default-model=${OPENAI_DEFAULT_MODEL:banking-mock-gpt}
app.openai.stream-chunk-delay-ms=${OPENAI_STREAM_CHUNK_DELAY_MS:40}
# Phase F/G - structured request audit log written to the "audit" category.
# Includes masked sensitive headers (Authorization, cookies, x-api-key, ...).
app.audit-log.enabled=${APP_AUDIT_LOG_ENABLED:true}
# Phase D - TLS profile. Activate with `-Dquarkus.profile=tls`. Generate certs with:
#   ./tls/generate-certs.sh
# then run with the profile to expose HTTPS on 8443 (HTTP/2 via ALPN).
# In OpenShift, the deployment mounts a service serving-cert secret at /etc/banking-tls.
%tls.quarkus.http.ssl-port=${HTTPS_PORT:8443}
%tls.quarkus.http.insecure-requests=enabled
%tls.quarkus.http.ssl.certificate.files=${TLS_CERTIFICATE_FILE:tls/server.crt}
%tls.quarkus.http.ssl.certificate.key-files=${TLS_CERTIFICATE_KEY_FILE:tls/server.key}
%tls.quarkus.http.ssl.client-auth=${TLS_CLIENT_AUTH:none}
