quarkus.http.port=8080
quarkus.http.host=0.0.0.0
# Nome do serviço reportado nos traces. Com o agente Java injetado pelo
# OpenTelemetry Operator, o service.name vem de OTEL_SERVICE_NAME (definido no
# Deployment); quarkus.application.name é o fallback local (mvn quarkus:dev).
quarkus.application.name=ledger-api
# Identifica qual instância respondeu (paridade com banking-api).
app.instance-name=${APP_INSTANCE_NAME:ledger-api}
# Health probes em /q/health (readiness/liveness) via smallrye-health.
# Access log no stdout para correlacionar com o trace (x-flow-trace-id/traceparent).
quarkus.http.access-log.enabled=${QUARKUS_HTTP_ACCESS_LOG_ENABLED:true}
quarkus.http.access-log.log-to-file=false
quarkus.http.access-log.pattern=%h %l %u %t "%r" %s %b %D "%{i,traceparent}" "%{i,x-flow-trace-id}"
