<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Red Hat Digital Bank mobile banking demo">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Red Hat Digital Bank">
  <link rel="apple-touch-icon" href="assets/assets/images/red-bank-logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/assets/images/red-bank-logo.png"/>

  <title>Red Hat Digital Bank</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Kill any Flutter service worker registered by a previous build of
    this app before Flutter's bootstrap runs. Older releases shipped
    `flutter_service_worker.js` with an aggressive cache-first strategy
    that survived normal reloads — operators visiting a new build in
    Firefox kept seeing the old bundle until they manually cleared site
    data. Current builds pass `--pwa-strategy=none` so no new SW is
    registered, but visitors who saw an older release still have the
    old SW controlling the tab. This snippet unregisters it once, then
    reloads so the bootstrap below runs SW-free. Cost: one extra
    reload per visitor per lifetime, invisible after that.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        if (regs.length === 0) return;
        Promise.all(regs.map((r) => r.unregister()))
          .then(() => window.location.reload());
      }).catch(() => {});
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
