worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$request_time"';

    access_log /dev/stdout main;
    error_log /dev/stderr info;

    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /hostname {
            default_type text/plain;
            return 200 "$hostname\n";
        }

        # Flutter web release output has NO content-hash in filenames for
        # its bootstrap surface (`flutter.js`, `flutter_bootstrap.js`,
        # `main.dart.js`, `manifest.json`). `immutable` + 1y expiry
        # kept Firefox pinned to old builds even after a rollout —
        # operators had to clear site data by hand every time. Use
        # `no-cache` so the browser always revalidates (cheap 304 when
        # nothing changed, fresh bytes when it did) and drop the
        # `immutable` hint. Hashed assets under `assets/` and
        # `canvaskit/` are still cache-friendly since they're
        # content-addressed by name.
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Source maps live next to bundled JS but Firefox tries to fetch
        # them from every JS load in devtools, and Flutter release builds
        # don't emit them → nginx returns the SPA fallback (index.html),
        # which then fails JSON.parse and spams "Error no mapa de código"
        # in the console. Serve an empty 204 for any *.map path so the
        # devtools quietly give up.
        location ~* \.map$ {
            return 204;
        }
    }
}
