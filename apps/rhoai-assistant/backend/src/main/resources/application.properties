quarkus.application.name=rhoai-assistant-backend
quarkus.http.port=8080
quarkus.http.cors=false

# MaaS (OpenAI-compatible via OpenShift External Models)
rhoai.maas.base-url=${MAAS_BASE_URL:https://maas-default-gateway-data-science-gateway-class.openshift-ingress.svc.cluster.local/external-models/qwen3-14b-external/v1}
rhoai.maas.api-key=${MAAS_API_KEY:}
rhoai.maas.default-model=${MAAS_MODEL:qwen3-14b}
rhoai.maas.trust-store-path=${MAAS_TRUST_STORE_PATH:/var/run/secrets/openshift/service-ca/service-ca.crt}
rhoai.maas.prefer-service-account-token=${MAAS_PREFER_SA_TOKEN:true}
rhoai.maas.insecure-skip-verify=${MAAS_INSECURE_SKIP_VERIFY:false}

# Catalog — discover models from ExternalModel + MaaSModelRef CRs
rhoai.catalog.source=${RHOAI_CATALOG_SOURCE:external-models}
rhoai.catalog.seed-path=${RHOAI_CATALOG_SEED_PATH:models-catalog.json}
rhoai.catalog.sync-on-startup=true
rhoai.external-models.namespace=${EXTERNAL_MODELS_NAMESPACE:external-models}
rhoai.external-models.api-group=maas.opendatahub.io
rhoai.external-models.api-version=v1alpha1

# Chat
chat.history.max-messages=${CHAT_HISTORY_MAX_MESSAGES:10}
chat.system-prompt=You are a helpful assistant integrated with Red Hat OpenShift AI via External Models.

# Health
rhoai.health.poll-interval=PT2M
