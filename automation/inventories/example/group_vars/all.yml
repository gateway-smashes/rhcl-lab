apps_openshift_route_enabled: "{{ lookup('ansible.builtin.env', 'APPS_OPENSHIFT_ROUTE_ENABLED') | default('false', true) | bool }}"
apps_openshift_route_namespace: "{{ lookup('ansible.builtin.env', 'APPS_OPENSHIFT_ROUTE_NAMESPACE') | default(apps_connectivity_gateway_namespace, true) }}"
