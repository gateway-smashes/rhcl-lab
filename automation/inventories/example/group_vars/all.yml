# Which CR backs the tiered plans on banking-api:
#   planpolicy   → upstream Kuadrant PlanPolicy. Different rates per tier
#                  (gold=1000, silver=50, bronze=10 — looks great in the
#                  demo), but all subscribers on the same tier share one
#                  Limitador counter (bug kuadrant-operator#2047, still open).
#   manual-rlp   → hand-rolled RateLimitPolicy with
#                  counters: [request.headers['x-consumer-id']]. Per-key
#                  isolation works (each api-key gets its own bucket — what
#                  the dev portal needs), but the WASM `when:` predicate
#                  can't read auth.identity to gate different rates per
#                  tier, so the gold/silver/bronze label is cosmetic and
#                  everyone effectively hits the silver rate.
# Default planpolicy because per-tier rates demo better; flip to manual-rlp
# (APPS_CONNECTIVITY_PLANS_MODE=manual-rlp) when the dev portal needs to
# show per-subscriber quotas instead.
apps_connectivity_plans_mode: "{{ lookup('ansible.builtin.env', 'APPS_CONNECTIVITY_PLANS_MODE') | default('planpolicy', true) }}"
apps_connectivity_plans:
  - tier: gold
    unlimited: true
  - tier: silver
    limit: 50
    window: 1m
  - tier: bronze
    limit: 10
    window: 1m

# req018 — Monitoração de Custo.
#
# Pricing table the Cost Monitoring page (plugin) + dashboard-api-costs
# (Grafana) use to translate consumption into money. Keys here must match
# the plan tiers declared in `apps_connectivity_apikey_plans` and the
# `secret.kuadrant.io/plan-id` annotation each APIKey carries. `anonymous`
# is the bucket for unauthenticated traffic (where Istio reports
# `request_headers_x_consumer_id=<nil>`).
#
# `tokens_per_1k` is the price for 1 000 AI tokens (sum of prompt +
# completion). `calls_per_1k` is the price for 1 000 HTTP calls.
# Empty/missing dict ⇒ plugin and dashboard fall back to raw usage
# (counts only, no monetary column).
#
# Os valores abaixo são uma tabela plausível em BRL para uma API bancária,
# não um placeholder: a chamada é o custo dominante (R$ 2,00 por 1 000
# chamadas ⇒ R$ 0,002/chamada) e o tier melhor paga MENOS por unidade —
# o desconto por volume que um contrato real teria. `anonymous` é o mais
# caro de propósito: tráfego não autenticado é o que se quer empurrar
# para dentro de um plano.
apps_cost_currency: "{{ lookup('ansible.builtin.env', 'APPS_COST_CURRENCY') | default('BRL', true) }}"
apps_cost_pricing:
  gold:      { tokens_per_1k: 0.03, calls_per_1k: 2.00 }
  silver:    { tokens_per_1k: 0.05, calls_per_1k: 3.00 }
  bronze:    { tokens_per_1k: 0.08, calls_per_1k: 4.50 }
  anonymous: { tokens_per_1k: 0.15, calls_per_1k: 8.00 }

# Teto mensal (na moeda de `apps_cost_currency`) que a página de Cost
# Monitoring usa para o KPI "Budget Usage" e a projeção de fim de mês.
# Vazio ⇒ o plugin esconde o card de budget.
apps_cost_budget: "{{ lookup('ansible.builtin.env', 'APPS_COST_BUDGET') | default('10000', true) }}"

# Master toggle for the Let's Encrypt ClusterIssuer provisioning. Default
# true. Set LETSENCRYPT_ENABLED=false in environments that issue certs
# through another path — e.g. a self-signed/corporate ClusterIssuer
# (APPS_CONNECTIVITY_TLS_ISSUER_NAME) when the public ACME endpoint isn't
# reachable from inside the network.
letsencrypt_enabled: "{{ lookup('ansible.builtin.env', 'LETSENCRYPT_ENABLED') | default('true', true) | bool }}"
letsencrypt_email: "{{ lookup('ansible.builtin.env', 'LETSENCRYPT_EMAIL') | default('', true) }}"
letsencrypt_solver: "{{ lookup('ansible.builtin.env', 'LETSENCRYPT_SOLVER') | default('dns01', true) }}"
letsencrypt_dns_provider: "{{ lookup('ansible.builtin.env', 'LETSENCRYPT_DNS_PROVIDER') | default(rhcl_dns_provider, true) }}"
letsencrypt_staging_name: "{{ lookup('ansible.builtin.env', 'LETSENCRYPT_STAGING_NAME') | default('letsencrypt-staging', true) }}"
letsencrypt_prod_name: "{{ lookup('ansible.builtin.env', 'LETSENCRYPT_PROD_NAME') | default('letsencrypt-prod', true) }}"
letsencrypt_prod_enabled: "{{ lookup('ansible.builtin.env', 'LETSENCRYPT_PROD_ENABLED') | default('false', true) | bool }}"
letsencrypt_secret_namespace: "{{ lookup('ansible.builtin.env', 'LETSENCRYPT_SECRET_NAMESPACE') | default('cert-manager', true) }}"
letsencrypt_secret_name: "{{ lookup('ansible.builtin.env', 'LETSENCRYPT_SECRET_NAME') | default('letsencrypt-dns-credentials', true) }}"
letsencrypt_aws_hosted_zone_id: "{{ lookup('ansible.builtin.env', 'LETSENCRYPT_AWS_HOSTED_ZONE_ID') | default('', true) }}"
letsencrypt_azure_hosted_zone_name: "{{ lookup('ansible.builtin.env', 'LETSENCRYPT_AZURE_HOSTED_ZONE_NAME') | default(lookup('ansible.builtin.env', 'AZ_DNS_ZONE'), true) | default('', true) }}"

# ---------------------------------------------------------------------------
# RHBK (Red Hat build of Keycloak) — Item 71 OIDC/JWT issuer.
# Stood up by the rhbk role / rhbk-install.yml (also runs inside install-all,
# before apps). Toggle the whole thing with RHBK_ENABLED=false.
# (NOTE: this block was restored after commit 236cf2b "metalLB docs" dropped it.)
# ---------------------------------------------------------------------------
rhbk_enabled: "{{ lookup('ansible.builtin.env', 'RHBK_ENABLED') | default('true', true) | bool }}"
rhbk_namespace: "{{ lookup('ansible.builtin.env', 'RHBK_NAMESPACE') | default('rhcl-keycloak', true) }}"
rhbk_operator_name: "{{ lookup('ansible.builtin.env', 'RHBK_OPERATOR_NAME') | default('rhbk-operator', true) }}"
rhbk_operator_subscription_name: "{{ lookup('ansible.builtin.env', 'RHBK_OPERATOR_SUBSCRIPTION_NAME') | default('rhbk-operator', true) }}"
rhbk_operator_channel: "{{ lookup('ansible.builtin.env', 'RHBK_OPERATOR_CHANNEL') | default('stable-v26.4', true) }}"
rhbk_operator_source: "{{ lookup('ansible.builtin.env', 'RHBK_OPERATOR_SOURCE') | default('redhat-operators', true) }}"
rhbk_operator_source_namespace: "{{ lookup('ansible.builtin.env', 'RHBK_OPERATOR_SOURCE_NAMESPACE') | default('openshift-marketplace', true) }}"
rhbk_operatorgroup_name: "{{ lookup('ansible.builtin.env', 'RHBK_OPERATORGROUP_NAME') | default('rhbk-operatorgroup', true) }}"
# (rhbk_install_operator was defined further up the file alongside the
# other *_install_operator switches; the duplicate here is removed so
# both definitions don't shadow each other.)

rhbk_keycloak_name: "{{ lookup('ansible.builtin.env', 'RHBK_KEYCLOAK_NAME') | default('rhcl', true) }}"
rhbk_instances: "{{ lookup('ansible.builtin.env', 'RHBK_INSTANCES') | default('1', true) | int }}"
rhbk_hostname: "{{ lookup('ansible.builtin.env', 'RHBK_HOSTNAME') | default('keycloak.' ~ rhcl_zone_root_domain, true) }}"
rhbk_realm: "{{ lookup('ansible.builtin.env', 'RHBK_REALM') | default('rhcl', true) }}"
rhbk_realm_display_name: "{{ lookup('ansible.builtin.env', 'RHBK_REALM_DISPLAY_NAME') | default('RHCL PoC', true) }}"
rhbk_access_token_lifespan: "{{ lookup('ansible.builtin.env', 'RHBK_ACCESS_TOKEN_LIFESPAN') | default('1800', true) | int }}"
# Session lifespans. Keycloak's 5-min default access token + 30-min idle session
# expire mid-demo (SPA calls start returning 401 even on /api/me once the token
# lapses and the SSO session has gone idle). Generous, demo-friendly values for
# this throwaway PoC realm: 30-min tokens, 2-h idle, 12-h max.
rhbk_sso_session_idle_timeout: "{{ lookup('ansible.builtin.env', 'RHBK_SSO_SESSION_IDLE_TIMEOUT') | default('7200', true) | int }}"
rhbk_sso_session_max_lifespan: "{{ lookup('ansible.builtin.env', 'RHBK_SSO_SESSION_MAX_LIFESPAN') | default('43200', true) | int }}"
rhbk_client_session_idle_timeout: "{{ lookup('ansible.builtin.env', 'RHBK_CLIENT_SESSION_IDLE_TIMEOUT') | default('7200', true) | int }}"
rhbk_client_session_max_lifespan: "{{ lookup('ansible.builtin.env', 'RHBK_CLIENT_SESSION_MAX_LIFESPAN') | default('43200', true) | int }}"
rhbk_client_id: "{{ lookup('ansible.builtin.env', 'RHBK_CLIENT_ID') | default('banking-api', true) }}"
rhbk_client_secret: "{{ lookup('ansible.builtin.env', 'RHBK_CLIENT_SECRET') | default('banking-api-secret', true) }}"

# Bootstrap admin (master realm). Provided via Secret so o Keycloak nasce com um
# admin DEFINITIVO (em vez do temp-admin + senha aleatória que o operator gera).
# Só é aplicado na criação inicial da instância (spec.bootstrapAdmin).
rhbk_admin_username: "{{ lookup('ansible.builtin.env', 'RHBK_ADMIN_USERNAME') | default('admin', true) }}"
rhbk_admin_password: "{{ lookup('ansible.builtin.env', 'RHBK_ADMIN_PASSWORD') | default('redhat', true) }}"
rhbk_admin_secret_name: "{{ lookup('ansible.builtin.env', 'RHBK_ADMIN_SECRET_NAME') | default('keycloak-bootstrap-admin', true) }}"

# Database (PostgreSQL — required by the operator-managed Keycloak).
rhbk_db_image: "{{ lookup('ansible.builtin.env', 'RHBK_DB_IMAGE') | default('quay.io/sclorg/postgresql-15-c9s:latest', true) }}"
rhbk_db_name: "{{ lookup('ansible.builtin.env', 'RHBK_DB_NAME') | default('keycloak', true) }}"
rhbk_db_username: "{{ lookup('ansible.builtin.env', 'RHBK_DB_USERNAME') | default('keycloak', true) }}"
rhbk_db_password: "{{ lookup('ansible.builtin.env', 'RHBK_DB_PASSWORD') | default('keycloak-demo-pass', true) }}"
rhbk_db_secret_name: "{{ lookup('ansible.builtin.env', 'RHBK_DB_SECRET_NAME') | default('keycloak-db-secret', true) }}"

# --- Awareness de perfil: deriva dos flags apps_* (o perfil corporativo liga a
# Route própria e o RHBK segue junto sem flags extras). ---
# rhbk_tls_mode — como o TLS do Keycloak é servido/exposto:
#   passthrough (default corporate): cert no POD (tlsSecret, CA interna corporativa) +
#     Route passthrough consumida pelo NGINX; Authorino confia na CA interna. É o
#     modelo do iib-rhbk (provado) e mantém o SAN do issuer sob nosso controle.
#   letsencrypt (default AWS): cert do cert-manager (LE, já confiável) no pod +
#     Route passthrough gerenciada pelo operator.
#   edge: TLS termina no Route/NGINX e o Keycloak roda HTTP atrás de proxy
#     (xforwarded). NÃO usar num ambiente corporativo pra JWT — o cert servido seria o do NGINX, não o
#     nosso, e o SAN do issuer fugiria do nosso controle.
rhbk_tls_mode: "{{ lookup('ansible.builtin.env', 'RHBK_TLS_MODE') | default('passthrough' if (apps_openshift_route_enabled | bool) else 'letsencrypt', true) }}"
# Compat: proxy_edge = (modo edge). As demais derivações abaixo usam rhbk_tls_mode.
rhbk_proxy_edge: "{{ lookup('ansible.builtin.env', 'RHBK_PROXY_EDGE') | default((rhbk_tls_mode == 'edge') | string | lower, true) | bool }}"
# Route OpenShift própria (consumida pelo NGINX interno via label de ingress class).
rhbk_openshift_route_enabled: "{{ lookup('ansible.builtin.env', 'RHBK_OPENSHIFT_ROUTE_ENABLED') | default(apps_openshift_route_enabled, true) | bool }}"
# Route gerenciada pelo operator (passthrough) — AWS sim; corporate não (usamos Route própria).
rhbk_operator_ingress_enabled: "{{ lookup('ansible.builtin.env', 'RHBK_OPERATOR_INGRESS_ENABLED') | default((not (rhbk_openshift_route_enabled | bool)) | string | lower, true) | bool }}"

# Authorino trust da CA do issuer — num ambiente corporativo o cert do Keycloak vem da CA interna do
# banco (internal corporate CA), seja edge ou passthrough; o Authorino precisa confiar nela pra
# buscar o JWKS. Cria um ConfigMap inject-trusted-cabundle (OpenShift preenche com
# system+user-ca-bundle) e monta no pod do Authorino. Ligado em qualquer modo que
# NÃO seja letsencrypt (AWS usa LE, já confiável, e não precisa).
rhbk_authorino_trust_ca: "{{ lookup('ansible.builtin.env', 'RHBK_AUTHORINO_TRUST_CA') | default((rhbk_tls_mode != 'letsencrypt') | string | lower, true) | bool }}"
rhbk_authorino_namespace: "{{ lookup('ansible.builtin.env', 'RHBK_AUTHORINO_NAMESPACE') | default(rhcl_namespace, true) }}"
rhbk_authorino_name: "{{ lookup('ansible.builtin.env', 'RHBK_AUTHORINO_NAME') | default('authorino', true) }}"
rhbk_authorino_trust_ca_configmap: "{{ lookup('ansible.builtin.env', 'RHBK_AUTHORINO_TRUST_CA_CONFIGMAP') | default('kuadrant-trusted-ca', true) }}"

# TLS — Secret kubernetes.io/tls montado no pod do Keycloak (spec.http.tlsSecret).
#   passthrough (corporate): você cria esse Secret À MÃO com o cert corporativo (tls.crt+tls.key,
#     +ca.crt) emitido pro host do Keycloak — a automação NÃO emite (rhbk_tls_create_
#     certificate=false). Nome default keycloak-tls (ajuste com RHBK_TLS_SECRET_NAME).
#   letsencrypt (AWS): o cert-manager emite o Certificate nesse Secret.
rhbk_tls_secret_name: "{{ lookup('ansible.builtin.env', 'RHBK_TLS_SECRET_NAME') | default('keycloak-tls', true) }}"
rhbk_tls_create_certificate: "{{ lookup('ansible.builtin.env', 'RHBK_TLS_CREATE_CERTIFICATE') | default((rhbk_tls_mode == 'letsencrypt') | string | lower, true) | bool }}"
rhbk_tls_issuer_name: "{{ lookup('ansible.builtin.env', 'RHBK_TLS_ISSUER_NAME') | default(apps_connectivity_tls_issuer_name, true) }}"
rhbk_tls_issuer_kind: "{{ lookup('ansible.builtin.env', 'RHBK_TLS_ISSUER_KIND') | default('ClusterIssuer', true) }}"

# DNS override (DNSRecord kuadrant) — cloud quando *.<zone> é wildcard pro gateway.
# Ligado por default; desligue com RHBK_DNS_OVERRIDE_ENABLED=false onde o DNS é
# gerenciado fora do Kuadrant.
rhbk_dns_override_enabled: "{{ lookup('ansible.builtin.env', 'RHBK_DNS_OVERRIDE_ENABLED') | default('true', true) | bool }}"
rhbk_dns_record_name: "{{ lookup('ansible.builtin.env', 'RHBK_DNS_RECORD_NAME') | default('keycloak-' ~ rhbk_realm, true) }}"
rhbk_dns_record_namespace: "{{ lookup('ansible.builtin.env', 'RHBK_DNS_RECORD_NAMESPACE') | default('openshift-ingress', true) }}"
rhbk_dns_provider_secret: "{{ lookup('ansible.builtin.env', 'RHBK_DNS_PROVIDER_SECRET') | default('rhcl-dns-credentials', true) }}"
# Auto-discovered from router-default when empty. AWS ELB → CNAME (hostname);
# Azure/GCP LB → A (IP). Override manual via RHBK_ROUTER_LB_HOSTNAME.
rhbk_router_lb_hostname: "{{ lookup('ansible.builtin.env', 'RHBK_ROUTER_LB_HOSTNAME') | default('', true) }}"

# OpenShift Route própria (corporate) — consumida pelo NGINX via label de ingress class
# (reaproveita apps_openshift_route_ingress_class_label_*). Aponta pro Service do
# Keycloak (operator cria <name>-service). Em passthrough vai pro port https (8443,
# o pod serve o cert corporativo); em edge iria pro http (8080). O NGINX interno PRECISA
# suportar TLS passthrough (SNI) — confirme antes.
rhbk_route_target_service: "{{ lookup('ansible.builtin.env', 'RHBK_ROUTE_TARGET_SERVICE') | default(rhbk_keycloak_name ~ '-service', true) }}"
rhbk_route_target_port: "{{ lookup('ansible.builtin.env', 'RHBK_ROUTE_TARGET_PORT') | default('http' if (rhbk_tls_mode == 'edge') else 'https', true) }}"
rhbk_route_tls_termination: "{{ lookup('ansible.builtin.env', 'RHBK_ROUTE_TLS_TERMINATION') | default('edge' if (rhbk_tls_mode == 'edge') else 'passthrough', true) }}"

rhbk_remove_namespace: "{{ lookup('ansible.builtin.env', 'RHBK_REMOVE_NAMESPACE') | default('true', true) | bool }}"

# Realm roles + demo users.
#
# The `banking-*` roles drive the gateway's JWT AuthPolicy (see
# `apps_connectivity_jwt_required_role` below) — they protect the API.
# The `api-*` roles drive the **Developer Portal** (its own repo,
# hodrigohamalho/rhcl-developer-portal — security/Roles.java) —
# they gate the Settings → Administration screens (manage APIs, plans,
# subscriptions). The portal frontend reads `realm_access.roles` from
# the token and hides admin menus when missing.
#
# Demo assignments:
#   alice → consumer + admin + owner   (drives the full portal demo)
#   bob   → consumer only              (regular subscriber)
rhbk_realm_roles:
  - name: banking-customer
    description: "Cliente do banco — acessa contas próprias"
  - name: banking-admin
    description: "Administrador — operações privilegiadas"
  - name: api-consumer
    description: "Developer Portal — pode descobrir APIs e gerar API keys"
  - name: api-admin
    description: "Developer Portal — administra APIs, plans, subscriptions"
  - name: api-owner
    description: "Developer Portal — owner do produto (mesma UI do api-admin)"
rhbk_users:
  - username: alice
    email: alice@example.com
    firstName: Alice
    lastName: Customer
    password: "{{ lookup('ansible.builtin.env', 'RHBK_USER_ALICE_PASSWORD') | default('alice123', true) }}"
    realmRoles: [banking-customer, api-consumer, api-admin, api-owner]
  - username: bob
    email: bob@example.com
    firstName: Bob
    lastName: Admin
    password: "{{ lookup('ansible.builtin.env', 'RHBK_USER_BOB_PASSWORD') | default('bob123', true) }}"
    realmRoles: [banking-customer, banking-admin, api-consumer]

# ---------------------------------------------------------------------------
# Gateway JWT/OIDC enforcement (apps AuthPolicy) — Item 71.
# Adds a `jwt` authentication method + role authZ + claim-forwarding headers to
# the connectivity AuthPolicy, scoped to the protected path. Points at the RHBK
# realm issuer above.
# ---------------------------------------------------------------------------
apps_connectivity_jwt_enabled: "{{ lookup('ansible.builtin.env', 'APPS_CONNECTIVITY_JWT_ENABLED') | default('true', true) | bool }}"
apps_connectivity_jwt_issuer_url: "{{ lookup('ansible.builtin.env', 'APPS_CONNECTIVITY_JWT_ISSUER_URL') | default('https://' ~ rhbk_hostname ~ '/realms/' ~ rhbk_realm, true) }}"
apps_connectivity_jwt_protected_path: "{{ lookup('ansible.builtin.env', 'APPS_CONNECTIVITY_JWT_PROTECTED_PATH') | default('/api/whoami', true) }}"
apps_connectivity_jwt_required_role: "{{ lookup('ansible.builtin.env', 'APPS_CONNECTIVITY_JWT_REQUIRED_ROLE') | default('banking-customer', true) }}"
# Paths extras liberados SEM autenticação na AuthPolicy do gateway (regra
# anonymous + exclusão das regras de api-key/jwt). Lista separada por vírgula.
# Ex.: APPS_CONNECTIVITY_ANONYMOUS_EXTRA_PATHS=/api/v1/timeout,/api/v1/timeoutmaior
# Vazio (default) = nenhum path extra liberado (comportamento atual inalterado).
apps_connectivity_anonymous_extra_paths: "{{ (lookup('ansible.builtin.env', 'APPS_CONNECTIVITY_ANONYMOUS_EXTRA_PATHS') | default('', true)).split(',') | map('trim') | reject('equalto', '') | list }}"

# ---------------------------------------------------------------------------
# Custom RHCL Console — OpenShift Console dynamic plugin.
# Repo: github.com/gateway-smashes/kuadrant-console (source of truth).
# Instalado pela role custom_console / custom_console-install.yml (também roda
# no fim do install-all). Toggle com CUSTOM_CONSOLE_ENABLED=false.
# ---------------------------------------------------------------------------
custom_console_enabled: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_ENABLED') | default('true', true) | bool }}"
custom_console_namespace: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_NAMESPACE') | default('kuadrant-console', true) }}"
custom_console_name: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_NAME') | default('custom-rhcl-console', true) }}"
custom_console_plugin_name: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_PLUGIN_NAME') | default('kuadrant-console', true) }}"
custom_console_display_name: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_DISPLAY_NAME') | default('Connectivity Link', true) }}"
# Runtime ConfigMap consumed by the plugin's pluginConfig.usePluginConfig
# hook. Hosts the per-environment overrides we don't want baked into the
# image (Grafana / Tempo discovery, Developer Portal URL, the req018
# Cost Monitoring pricing table). The plugin watches it via
# useK8sWatchResource, so a `data:` edit propagates without a rollout.
custom_console_config_configmap_name: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_CONFIG_CONFIGMAP_NAME') | default('kuadrant-console-config', true) }}"
# Links absolutos que o browser abre direto. Deixe VAZIO para o role derivar
# `https://<prefixo>.<apps-domain>` do próprio cluster (é o que o lab usa);
# preencha para apontar a uma instância mantida pelo cliente. Se ficar vazio
# e o domínio não resolver, o item some da sidebar em vez de virar link morto.
custom_console_developer_portal_url: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_DEVELOPER_PORTAL_URL') | default('', true) }}"
custom_console_internal_developer_hub_url: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_INTERNAL_DEVELOPER_HUB_URL') | default('', true) }}"
custom_console_dns_prober_url: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_DNS_PROBER_URL') | default('', true) }}"
# Prefixos usados para montar as URLs acima. `dns-prober-custom-rhcl-console`
# é o host default do OpenShift para a rota `dns-prober` no namespace do
# plugin (padrão <rota>-<namespace>.<apps-domain>).
custom_console_developer_portal_route_prefix: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_DEVELOPER_PORTAL_ROUTE_PREFIX') | default('devportal', true) }}"
custom_console_internal_developer_hub_route_prefix: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_INTERNAL_DEVELOPER_HUB_ROUTE_PREFIX') | default('rhdh', true) }}"
custom_console_dns_prober_route_prefix: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_DNS_PROBER_ROUTE_PREFIX') | default('dns-prober-kuadrant-console', true) }}"
custom_console_grafana_namespace: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_GRAFANA_NAMESPACE') | default('', true) }}"
custom_console_grafana_route_name: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_GRAFANA_ROUTE_NAME') | default('', true) }}"
custom_console_grafana_dashboard_prefix: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_GRAFANA_DASHBOARD_PREFIX') | default('', true) }}"
custom_console_tempo_namespace: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_TEMPO_NAMESPACE') | default('', true) }}"
custom_console_tempo_gateway_route_name: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_TEMPO_GATEWAY_ROUTE_NAME') | default('', true) }}"
custom_console_tempo_stack_name: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_TEMPO_STACK_NAME') | default('', true) }}"
# Plugin do RHCL Console — imagem publicada em quay.io/gateway-smashes/kuadrant-console
# (source of truth do org gateway-smashes). O nginx do plugin serve HTTPS na
# porta 9001. O plugin id embutido é `kuadrant-console` e ele lê o ConfigMap
# `kuadrant-console-config` no namespace `kuadrant-console` (hard-coded em
# console-plugin/src/utils/pluginConfig.ts) — por isso os defaults de namespace,
# plugin_name e configmap_name acima usam exatamente esses valores.
# imagePullPolicy Always: um `oc rollout restart` puxa o digest mais novo da tag.
custom_console_image: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_IMAGE') | default('quay.io/gateway-smashes/kuadrant-console:1.5.1', true) }}"
custom_console_image_pull_policy: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_IMAGE_PULL_POLICY') | default('Always', true) }}"
custom_console_image_pull_secret: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_IMAGE_PULL_SECRET') | default('', true) }}"
custom_console_replicas: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_REPLICAS') | default('1', true) | int }}"
custom_console_container_port: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_CONTAINER_PORT') | default('9001', true) | int }}"
custom_console_service_port: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_SERVICE_PORT') | default('9001', true) | int }}"
# OpenShift serving-cert secret (TLS) mintado pela anotação no Service.
custom_console_cert_secret_name: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_CERT_SECRET_NAME') | default('custom-rhcl-console-cert', true) }}"
custom_console_remove_namespace: "{{ lookup('ansible.builtin.env', 'CUSTOM_CONSOLE_REMOVE_NAMESPACE') | default('true', true) | bool }}"

# ---------------------------------------------------------------------------
# Tests catalog (rhcl-lab-git) — site estático (nginx) que lista os req*/ + req*.md
# e renderiza os READMEs (viewer/reproduzir). Builda da pasta tests/ deste repo.
# Instalado pela role tests_catalog / tests_catalog-install.yml. Toggle com
# TESTS_CATALOG_ENABLED=false.
# ---------------------------------------------------------------------------
tests_catalog_enabled: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_ENABLED') | default('true', true) | bool }}"
tests_catalog_namespace: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_NAMESPACE') | default('tests', true) }}"
tests_catalog_name: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_NAME') | default('rhcl-lab-git', true) }}"
# build = BuildConfig Git in-cluster (default, fiel ao que está rodando).
# image = imagem pronta (sem egress p/ github: builde e publique, e aponte aqui).
tests_catalog_image_source: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_IMAGE_SOURCE') | default('build', true) }}"
tests_catalog_git_uri: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_GIT_URI') | default('https://github.com/redhat-rhcl-poc/rhcl-lab.git', true) }}"
tests_catalog_git_ref: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_GIT_REF') | default('', true) }}"
# Credentials for cloning the catalog repo. When TESTS_CATALOG_GIT_TOKEN is
# set, the role creates a basic-auth Secret named after
# `tests_catalog_git_source_secret_default` and wires it into the
# BuildConfig.sourceSecret. TESTS_CATALOG_GIT_USERNAME defaults to
# "x-access-token" because that's the canonical value GitHub expects when
# the password slot carries a fine-grained or classic PAT.
# Pass an explicit TESTS_CATALOG_GIT_SOURCE_SECRET to point at a Secret you
# created out-of-band instead.
tests_catalog_git_username: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_GIT_USERNAME') | default('x-access-token', true) }}"
tests_catalog_git_token: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_GIT_TOKEN') | default('', true) }}"
tests_catalog_git_source_secret_default: "{{ tests_catalog_name }}-git-credentials"
tests_catalog_git_source_secret: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_GIT_SOURCE_SECRET') | default((tests_catalog_git_source_secret_default if (lookup('ansible.builtin.env', 'TESTS_CATALOG_GIT_TOKEN') | length > 0) else ''), true) }}"
tests_catalog_context_dir: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_CONTEXT_DIR') | default('/tests', true) }}"
tests_catalog_dockerfile_path: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_DOCKERFILE_PATH') | default('Dockerfile', true) }}"
tests_catalog_image: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_IMAGE') | default('', true) }}"
tests_catalog_image_pull_policy: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_IMAGE_PULL_POLICY') | default('Always', true) }}"
tests_catalog_image_pull_secret: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_IMAGE_PULL_SECRET') | default('', true) }}"
tests_catalog_replicas: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_REPLICAS') | default('1', true) | int }}"
tests_catalog_container_port: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_CONTAINER_PORT') | default('8080', true) | int }}"
# Hostname da Route. Default deriva da MESMA zona delegada que o banking-api
# usa: pega apps_connectivity_route_hostname e troca o 1º label por
# "tests" (ex.: banking-api.apps.example.com -> tests.apps.example.com).
# NÃO usar rhcl_zone_root_domain aqui: num ambiente corporativo o cluster-env.sh sobrescreve essa var
# com o domínio de ingress DO CLUSTER (ex.: lab.example.com), que NÃO é a zona
# delegada da PoC — derivar dela gera tests.lab.example.com, fora da zona. Sem
# apps_connectivity_route_hostname o default fica vazio = OpenShift gera o host da Route.
tests_catalog_hostname: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_HOSTNAME') | default(('tests.' ~ (apps_connectivity_route_hostname.split('.')[1:] | join('.'))) if (apps_connectivity_route_hostname | default('') | length > 0 and '.' in (apps_connectivity_route_hostname | default(''))) else '', true) }}"
tests_catalog_route_tls_termination: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_ROUTE_TLS_TERMINATION') | default('edge', true) }}"
# Profile-aware (deriva do flag apps_openshift_route_enabled).
tests_catalog_openshift_route_bb_enabled: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_OPENSHIFT_ROUTE_BB_ENABLED') | default(apps_openshift_route_enabled, true) | bool }}"
tests_catalog_remove_namespace: "{{ lookup('ansible.builtin.env', 'TESTS_CATALOG_REMOVE_NAMESPACE') | default('true', true) | bool }}"

