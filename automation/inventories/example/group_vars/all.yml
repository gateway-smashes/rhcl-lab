apps_image_source: "{{ lookup('ansible.builtin.env', 'APPS_IMAGE_SOURCE') | default('build', true) }}"

# Orçamento das esperas do role apps (deployments disponíveis, HTTPRoutes
# aceitas, gateway programado). Eram 30x10s = 300s cada, e como todas carregam
# `failed_when: false`, um recurso que nunca fica pronto custava 5 minutos de
# silêncio por espera — com 12 delas, até ~65 min por execução, terminando em
# "sucesso". O `until` só dorme quando a condição falha, então num cluster
# saudável isso resolve na primeira chamada: teto curto não penaliza ninguém.
# 24x5s = 120s. Suba em clusters lentos.
apps_wait_retries: "{{ lookup('ansible.builtin.env', 'APPS_WAIT_RETRIES') | default('24', true) | int }}"
apps_wait_delay: "{{ lookup('ansible.builtin.env', 'APPS_WAIT_DELAY') | default('5', true) | int }}"
# Emissão de certificado (cert-manager/ACME) leva legitimamente mais tempo.
apps_wait_retries_long: "{{ lookup('ansible.builtin.env', 'APPS_WAIT_RETRIES_LONG') | default('60', true) | int }}"
