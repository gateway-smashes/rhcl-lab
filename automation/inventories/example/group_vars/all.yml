---
rhcl_action: "{{ lookup('ansible.builtin.env', 'RHCL_ACTION') | default('install', true) }}"
rhcl_ocp_mode: "{{ lookup('ansible.builtin.env', 'RHCL_OCP_MODE') | default('native_gateway_api', true) }}"

# Global switch — when OPERATORS_INSTALL_ENABLED=false, every role that
# installs an operator via OLM (rhcl, observability, cert_manager, rhbk,
# grafana, etc.) skips the OperatorGroup / Subscription / CSV-wait dance and
# just verifies the operator's CRD is already on the cluster. Use this in
# environments where OLM is managed centrally (the customer installs operators
# themselves) or on iterative re-runs where the operator install already
# happened and you only want to reconcile CRs / apps — saves several minutes.
# Each role accepts a per-role override (e.g. RHCL_INSTALL_OPERATOR,
# OBSERVABILITY_INSTALL_OPERATOR) for finer control.
operators_install_enabled: "{{ lookup('ansible.builtin.env', 'OPERATORS_INSTALL_ENABLED') | default('true', true) | bool }}"

rhcl_install_operator: "{{ lookup('ansible.builtin.env', 'RHCL_INSTALL_OPERATOR') | default(operators_install_enabled, true) | bool }}"
observability_install_operator: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_INSTALL_OPERATOR') | default(operators_install_enabled, true) | bool }}"
cert_manager_install_operator: "{{ lookup('ansible.builtin.env', 'CERT_MANAGER_INSTALL_OPERATOR') | default(operators_install_enabled, true) | bool }}"
rhbk_install_operator: "{{ lookup('ansible.builtin.env', 'RHBK_INSTALL_OPERATOR') | default(operators_install_enabled, true) | bool }}"
mcp_gateway_install_operator: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_INSTALL_OPERATOR') | default(operators_install_enabled, true) | bool }}"
ocp_ai_install_operator: "{{ lookup('ansible.builtin.env', 'OCP_AI_INSTALL_OPERATOR') | default(operators_install_enabled, true) | bool }}"

# Opt-in toggles for the AI playbooks. Both default to false because they're
# heavy installs (MCP Gateway brings a preview-channel operator; OCP AI brings
# RHOAI + GPU operator + Kueue + KEDA etc.) and aren't always wanted on every
# cluster. Set MCP_GATEWAY_ENABLED=true to wire MCP into the install-all run.
# Set OCP_AI_ENABLED=true to run the ocp_ai role; OCP_AI_GPU_ENABLED toggles
# whether NVIDIA GPU Operator + ClusterPolicy + HardwareProfile are applied
# (skip on CPU-only clusters).
mcp_gateway_enabled: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_ENABLED') | default('false', true) | bool }}"
ocp_ai_enabled: "{{ lookup('ansible.builtin.env', 'OCP_AI_ENABLED') | default('false', true) | bool }}"
ocp_ai_gpu_enabled: "{{ lookup('ansible.builtin.env', 'OCP_AI_GPU_ENABLED') | default('true', true) | bool }}"

rhcl_namespace: "{{ lookup('ansible.builtin.env', 'RHCL_NAMESPACE') | default('kuadrant-system', true) }}"
rhcl_operator_name: "{{ lookup('ansible.builtin.env', 'RHCL_OPERATOR_NAME') | default('rhcl-operator', true) }}"
rhcl_operator_subscription_name: "{{ lookup('ansible.builtin.env', 'RHCL_OPERATOR_SUBSCRIPTION_NAME') | default('rhcl-operator', true) }}"
# RHCL / Kuadrant version — default is the LATEST from the stable channel
# (1.4.1+).
#
# History: Red Hat deprecated Connectivity Link 1.4.0 (gateway data plane
# down — the wasm-shim relied on an unstable remote wasm fetch that never
# converged, so every request through the gateway returned 000). This lab
# pinned 1.3.4 while that was live. **1.4.1 fixes it** (validated
# 2026-07-08 on a fresh cluster: the wasm module is now served from an
# in-cluster service, sha256-pinned; AuthPolicy + RateLimitPolicy enforce
# end-to-end). See docs/known-issues/rhcl-14-gateway-wasm-incompat.md.
#
# The pin machinery below is kept for 1.3.x parity reproductions (e.g.
# matching a customer cluster still on 1.3). Set RHCL_PIN_V13_ENABLED=true
# to reproduce the old behaviour; the default is now false.
rhcl_pin_v13_enabled: "{{ lookup('ansible.builtin.env', 'RHCL_PIN_V13_ENABLED') | default('false', true) | bool }}"
rhcl_pin_catalog_name: "{{ lookup('ansible.builtin.env', 'RHCL_PIN_CATALOG_NAME') | default('redhat-operators-v418', true) }}"
rhcl_pin_catalog_namespace: "{{ lookup('ansible.builtin.env', 'RHCL_PIN_CATALOG_NAMESPACE') | default('openshift-marketplace', true) }}"
rhcl_pin_catalog_image: "{{ lookup('ansible.builtin.env', 'RHCL_PIN_CATALOG_IMAGE') | default('registry.redhat.io/redhat/redhat-operator-index:v4.18', true) }}"
rhcl_operator_channel: "{{ lookup('ansible.builtin.env', 'RHCL_OPERATOR_CHANNEL') | default('stable', true) }}"
# When pinning, default the source to the v4.18 catalog above so OLM picks
# 1.3.x and resolves authorino/limitador/dns deps from the same index.
rhcl_operator_source: "{{ lookup('ansible.builtin.env', 'RHCL_OPERATOR_SOURCE') | default(rhcl_pin_catalog_name if (rhcl_pin_v13_enabled | bool) else 'redhat-operators', true) }}"
rhcl_operator_source_namespace: "{{ lookup('ansible.builtin.env', 'RHCL_OPERATOR_SOURCE_NAMESPACE') | default('openshift-marketplace', true) }}"
rhcl_operator_starting_csv: "{{ lookup('ansible.builtin.env', 'RHCL_OPERATOR_STARTING_CSV') | default('rhcl-operator.v1.3.4' if (rhcl_pin_v13_enabled | bool) else '', true) }}"
rhcl_operatorgroup_name: "{{ lookup('ansible.builtin.env', 'RHCL_OPERATORGROUP_NAME') | default('kuadrant', true) }}"
rhcl_instance_name: "{{ lookup('ansible.builtin.env', 'RHCL_INSTANCE_NAME') | default('kuadrant', true) }}"
rhcl_console_plugin_enabled: "{{ lookup('ansible.builtin.env', 'RHCL_CONSOLE_PLUGIN_ENABLED') | default('true', true) | bool }}"
rhcl_console_plugin_name: "{{ lookup('ansible.builtin.env', 'RHCL_CONSOLE_PLUGIN_NAME') | default('kuadrant-console-plugin', true) }}"
# Developer portal: sobe o developer-portal-controller e reconcilia APIProducts
# (status com planos/auth/OIDC descobertos) — necessário p/ a console customizada
# enxergar API Products. Sem isso o APIProduct fica sem status.
rhcl_developer_portal_enabled: "{{ lookup('ansible.builtin.env', 'RHCL_DEVELOPER_PORTAL_ENABLED') | default('true', true) | bool }}"

mcp_gateway_namespace: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_NAMESPACE') | default('mcp-gateway', true) }}"
mcp_gateway_operator_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_OPERATOR_NAME') | default('mcp-gateway', true) }}"
mcp_gateway_subscription_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_SUBSCRIPTION_NAME') | default('mcp-gateway', true) }}"
mcp_gateway_operatorgroup_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_OPERATORGROUP_NAME') | default('mcp-gateway', true) }}"
mcp_gateway_operator_channel: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_OPERATOR_CHANNEL') | default('preview', true) }}"
mcp_gateway_operator_source: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_OPERATOR_SOURCE') | default('redhat-operators', true) }}"
mcp_gateway_operator_source_namespace: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_OPERATOR_SOURCE_NAMESPACE') | default('openshift-marketplace', true) }}"
# Req 59 — dedicated Istio Gateway for MCP Gateway operator only (not rhcl-apps-gateway).
mcp_gateway_manage_gateway: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_MANAGE_GATEWAY') | default('true', true) | bool }}"
mcp_gateway_gateway_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_GATEWAY_NAME') | default('rhcl-mcp-gateway', true) }}"
mcp_gateway_gateway_namespace: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_GATEWAY_NAMESPACE') | default('mcp-gateway', true) }}"
mcp_gateway_gateway_podmonitor_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_GATEWAY_PODMONITOR_NAME') | default(mcp_gateway_gateway_name ~ '-istio-metrics', true) }}"
mcp_gateway_gatewayclass_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_GATEWAYCLASS_NAME') | default(lookup('ansible.builtin.env', 'GATEWAY_API_GATEWAYCLASS_NAME') | default('openshift-default', true), true) }}"
mcp_gateway_gateway_service_type: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_GATEWAY_SERVICE_TYPE') | default(lookup('ansible.builtin.env', 'APPS_CONNECTIVITY_GATEWAY_SERVICE_TYPE') | default('LoadBalancer', true), true) }}"
mcp_gateway_listener_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_LISTENER_NAME') | default('mcp', true) }}"
mcp_gateway_listener_hostname: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_LISTENER_HOSTNAME') | default('', true) }}"
mcp_gateway_hostname: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_HOSTNAME') | default('', true) }}"
mcp_gateway_server_listener_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_SERVER_LISTENER_NAME') | default('mcps', true) }}"
mcp_gateway_server_listener_hostname: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_SERVER_LISTENER_HOSTNAME') | default('', true) }}"
mcp_gateway_port: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_PORT') | default('8080', true) | int }}"
mcp_gateway_protocol: "HTTP"
mcp_gateway_server_listener_protocol: "HTTP"
mcp_gateway_extension_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_EXTENSION_NAME') | default('mcp-gateway', true) }}"
mcp_gateway_http_route_management: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_HTTP_ROUTE_MANAGEMENT') | default('Enabled', true) }}"
mcp_gateway_auto_route_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_AUTO_ROUTE_NAME') | default('mcp-gateway-route', true) }}"
mcp_gateway_path: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_PATH') | default('/mcp', true) }}"
mcp_gateway_custom_route_enabled: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_CUSTOM_ROUTE_ENABLED') | default('true', true) | bool }}"
mcp_gateway_custom_route_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_CUSTOM_ROUTE_NAME') | default('mcp-gateway-route-custom', true) }}"
mcp_gateway_custom_route_cors_enabled: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_CUSTOM_ROUTE_CORS_ENABLED') | default('true', true) | bool }}"
mcp_gateway_custom_route_cors_allow_headers: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_CUSTOM_ROUTE_CORS_ALLOW_HEADERS') | default('Content-Type, Authorization, Accept, Origin, X-Requested-With, MCP-Session-Id, x-flow-trace-id, x-client-app, x-consumer-id', true) }}"
mcp_gateway_custom_route_auth_policy_enabled: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_CUSTOM_ROUTE_AUTH_POLICY_ENABLED') | default('true', true) | bool }}"
mcp_gateway_custom_route_auth_policy_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_CUSTOM_ROUTE_AUTH_POLICY_NAME') | default(mcp_gateway_custom_route_name ~ '-allow-public', true) }}"
mcp_gateway_browser_route_enabled: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_BROWSER_ROUTE_ENABLED') | default('true', true) | bool }}"
mcp_gateway_browser_route_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_BROWSER_ROUTE_NAME') | default(mcp_gateway_extension_name ~ '-browser', true) }}"
mcp_gateway_cors_envoyfilter_enabled: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_CORS_ENVOYFILTER_ENABLED') | default('true', true) | bool }}"
mcp_gateway_cors_envoyfilter_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_CORS_ENVOYFILTER_NAME') | default('mcp-gateway-cors', true) }}"
mcp_gateway_cors_allow_origin: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_CORS_ALLOW_ORIGIN') | default('*', true) }}"
mcp_gateway_cors_allow_methods: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_CORS_ALLOW_METHODS') | default('GET, POST, PUT, DELETE, OPTIONS, HEAD', true) }}"
mcp_gateway_cors_allow_headers: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_CORS_ALLOW_HEADERS') | default('content-type, authorization, accept, origin, x-requested-with, mcp-session-id, x-flow-trace-id, x-client-app, x-consumer-id', true) }}"
mcp_gateway_cors_expose_headers: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_CORS_EXPOSE_HEADERS') | default('mcp-session-id', true) }}"
mcp_gateway_cors_max_age: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_CORS_MAX_AGE') | default('300', true) }}"
mcp_gateway_gateway_service_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_GATEWAY_SERVICE_NAME') | default(mcp_gateway_gateway_name ~ '-' ~ mcp_gateway_gatewayclass_name, true) }}"
mcp_gateway_compat_service_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_COMPAT_SERVICE_NAME') | default(mcp_gateway_gateway_name ~ '-istio', true) }}"
mcp_gateway_compat_service_enabled: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_COMPAT_SERVICE_ENABLED') | default('true', true) | bool }}"
mcp_gateway_private_host: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_PRIVATE_HOST') | default(mcp_gateway_compat_service_name ~ '.' ~ mcp_gateway_gateway_namespace ~ '.svc.cluster.local:' ~ (mcp_gateway_port | string), true) }}"
mcp_gateway_server_registration_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_SERVER_REGISTRATION_NAME') | default('banking-api', true) }}"
mcp_gateway_server_registration_tool_prefix: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_SERVER_REGISTRATION_TOOL_PREFIX') | default('banking_', true) }}"
mcp_gateway_server_registration_route_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_SERVER_REGISTRATION_ROUTE_NAME') | default('banking-api-mcp-server', true) }}"
# HTTPRoute and route AuthPolicies must live in mcp-gateway (same namespace as rhcl-mcp-gateway).
mcp_gateway_server_registration_route_namespace: "{{ mcp_gateway_namespace }}"
mcp_gateway_gateway_deny_all_enabled: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_GATEWAY_DENY_ALL_ENABLED') | default('true', true) | bool }}"
mcp_gateway_gateway_deny_all_policy_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_GATEWAY_DENY_ALL_POLICY_NAME') | default(mcp_gateway_gateway_name ~ '-deny-all', true) }}"
mcp_gateway_server_route_hostname: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_SERVER_ROUTE_HOSTNAME') | default('', true) }}"
mcp_gateway_server_route_auth_policy_enabled: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_SERVER_ROUTE_AUTH_POLICY_ENABLED') | default('true', true) | bool }}"
mcp_gateway_server_route_auth_policy_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_SERVER_ROUTE_AUTH_POLICY_NAME') | default(mcp_gateway_server_registration_route_name ~ '-allow-mcp-discovery', true) }}"
mcp_gateway_server_backend_service_name: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_SERVER_BACKEND_SERVICE_NAME') | default(lookup('ansible.builtin.env', 'APPS_BACKEND_PRIMARY_NAME') | default('banking-api-v1', true), true) }}"
mcp_gateway_server_backend_service_namespace: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_SERVER_BACKEND_SERVICE_NAMESPACE') | default(lookup('ansible.builtin.env', 'APPS_NAMESPACE') | default('rhcl-apps', true), true) }}"
mcp_gateway_server_backend_service_port: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_SERVER_BACKEND_SERVICE_PORT') | default('8080', true) | int }}"
mcp_gateway_validate_endpoint: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_VALIDATE_ENDPOINT') | default('false', true) | bool }}"
mcp_gateway_validate_url: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_VALIDATE_URL') | default('', true) }}"
mcp_gateway_remove_listener: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_REMOVE_LISTENER') | default('false', true) | bool }}"
mcp_gateway_listener_update_if_exists: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_LISTENER_UPDATE_IF_EXISTS') | default('false', true) | bool }}"

# Default flipped to the Sail-managed `istio` class on 2026-07-08. RHCL
# 1.4.x's wasm-shim config still breaks the ingress-operator-managed
# `openshift-default` gateway data plane (unknown wasm field + remote
# fetch loop → gateway pod OOMKilled) — the exact known-issue that got
# 1.4.0 deprecated. On the Sail data plane (OSSM 3.3.5 / Istio 1.26.4+)
# RHCL 1.4.1 enforces correctly end-to-end (validated on cluster-mck9f).
# Set GATEWAY_API_GATEWAYCLASS_NAME=openshift-default only for 1.3.x
# parity clusters (pair with RHCL_PIN_V13_ENABLED=true).
# See docs/known-issues/rhcl-14-gateway-wasm-incompat.md.
gateway_api_gatewayclass_name: "{{ lookup('ansible.builtin.env', 'GATEWAY_API_GATEWAYCLASS_NAME') | default('istio', true) }}"
gateway_api_controller_name: "{{ lookup('ansible.builtin.env', 'GATEWAY_API_CONTROLLER_NAME') | default('istio.io/gateway-controller', true) }}"
gateway_api_controller_namespace: "{{ lookup('ansible.builtin.env', 'GATEWAY_API_CONTROLLER_NAMESPACE') | default('openshift-ingress', true) }}"
gateway_api_controller_deployment: "{{ lookup('ansible.builtin.env', 'GATEWAY_API_CONTROLLER_DEPLOYMENT') | default('istiod-openshift-gateway', true) }}"
# Espera pelo controller do gateway. O teto era 300s (30x10s) e, como a task
# não podia falhar, um nome/namespace errado custava 5 min silenciosos por
# execução. 18x5s = 90s: um controller saudável responde na primeira chamada
# (o `until` só dorme quando a condição falha), e um ausente aparece rápido.
# Suba o teto em clusters lentos; STRICT=false volta ao comportamento antigo
# de apenas avisar e seguir.
gateway_api_controller_wait_retries: "{{ lookup('ansible.builtin.env', 'GATEWAY_API_CONTROLLER_WAIT_RETRIES') | default('18', true) | int }}"
gateway_api_controller_wait_delay: "{{ lookup('ansible.builtin.env', 'GATEWAY_API_CONTROLLER_WAIT_DELAY') | default('5', true) | int }}"
gateway_api_controller_wait_strict: "{{ lookup('ansible.builtin.env', 'GATEWAY_API_CONTROLLER_WAIT_STRICT') | default('true', true) | bool }}"

# OpenShift Service Mesh 3 (servicemeshoperator3 / the Sail operator) is the
# controller behind the gateway. On OCP 4.19+ Gateway API is GA, but the
# `openshift.io/gateway-controller/v1` controller — istiod-openshift-gateway in
# openshift-ingress, provisioned by the cluster ingress operator — only comes
# up once OSSM 3 is installed. Without it the GatewayClass is created but never
# Accepted and the controller-wait fails with "istiod Deployments found: none".
# The gateway_api role subscribes it (openshift-operators uses the cluster's
# global OperatorGroup, so no OperatorGroup is created here).
#
# Gated by gateway_api_install_operator, which — like rhcl_install_operator and
# the other per-role toggles — defaults to OPERATORS_INSTALL_ENABLED. Set it to
# false (Banco do Brasil manual-operator profile) to verify-only: the role then
# asserts the OSSM 3 CRD is already present and fails with an actionable message
# instead of subscribing it.
gateway_api_install_operator: "{{ lookup('ansible.builtin.env', 'GATEWAY_API_INSTALL_OPERATOR') | default(operators_install_enabled, true) | bool }}"
gateway_api_ossm_namespace: "{{ lookup('ansible.builtin.env', 'GATEWAY_API_OSSM_NAMESPACE') | default('openshift-operators', true) }}"
gateway_api_ossm_operator_name: "{{ lookup('ansible.builtin.env', 'GATEWAY_API_OSSM_OPERATOR_NAME') | default('servicemeshoperator3', true) }}"
gateway_api_ossm_subscription_name: "{{ lookup('ansible.builtin.env', 'GATEWAY_API_OSSM_SUBSCRIPTION_NAME') | default('servicemeshoperator3', true) }}"
gateway_api_ossm_channel: "{{ lookup('ansible.builtin.env', 'GATEWAY_API_OSSM_CHANNEL') | default('stable', true) }}"
gateway_api_ossm_source: "{{ lookup('ansible.builtin.env', 'GATEWAY_API_OSSM_SOURCE') | default('redhat-operators', true) }}"
gateway_api_ossm_source_namespace: "{{ lookup('ansible.builtin.env', 'GATEWAY_API_OSSM_SOURCE_NAMESPACE') | default('openshift-marketplace', true) }}"
# Optional pin. Leave empty to let OLM resolve the channel head (validated on
# servicemeshoperator3.v3.4.2); set to pin a specific CSV for reproductions.
gateway_api_ossm_starting_csv: "{{ lookup('ansible.builtin.env', 'GATEWAY_API_OSSM_STARTING_CSV') | default('', true) }}"
# CRD used to verify OSSM 3 is present on the verify-only path (Sail operator's
# primary CRD).
gateway_api_ossm_crd: "{{ lookup('ansible.builtin.env', 'GATEWAY_API_OSSM_CRD') | default('istios.sailoperator.io', true) }}"
gateway_api_ossm_wait_retries: "{{ lookup('ansible.builtin.env', 'GATEWAY_API_OSSM_WAIT_RETRIES') | default('30', true) | int }}"
gateway_api_ossm_wait_delay: "{{ lookup('ansible.builtin.env', 'GATEWAY_API_OSSM_WAIT_DELAY') | default('10', true) | int }}"

cert_manager_namespace: "{{ lookup('ansible.builtin.env', 'CERT_MANAGER_NAMESPACE') | default('cert-manager-operator', true) }}"
cert_manager_operator_name: "{{ lookup('ansible.builtin.env', 'CERT_MANAGER_OPERATOR_NAME') | default('openshift-cert-manager-operator', true) }}"
cert_manager_subscription_name: "{{ lookup('ansible.builtin.env', 'CERT_MANAGER_SUBSCRIPTION_NAME') | default('openshift-cert-manager-operator', true) }}"
cert_manager_operatorgroup_name: "{{ lookup('ansible.builtin.env', 'CERT_MANAGER_OPERATORGROUP_NAME') | default('openshift-cert-manager-operator', true) }}"
cert_manager_channel: "{{ lookup('ansible.builtin.env', 'CERT_MANAGER_CHANNEL') | default('stable-v1', true) }}"
cert_manager_source: "{{ lookup('ansible.builtin.env', 'CERT_MANAGER_SOURCE') | default('redhat-operators', true) }}"
cert_manager_source_namespace: "{{ lookup('ansible.builtin.env', 'CERT_MANAGER_SOURCE_NAMESPACE') | default('openshift-marketplace', true) }}"
cert_manager_dns01_recursive_nameservers: "{{ lookup('ansible.builtin.env', 'CERT_MANAGER_DNS01_RECURSIVE_NAMESERVERS') | default('1.1.1.1:53,8.8.8.8:53', true) }}"
cert_manager_dns01_recursive_nameservers_only: "{{ lookup('ansible.builtin.env', 'CERT_MANAGER_DNS01_RECURSIVE_NAMESERVERS_ONLY') | default('true', true) | bool }}"

rhcl_zone_root_domain: "{{ lookup('ansible.builtin.env', 'RHCL_ZONE_ROOT_DOMAIN') | default(lookup('ansible.builtin.env', 'KUADRANT_ZONE_ROOT_DOMAIN') | default('', true), true) }}"

# Master toggle for the Kuadrant DNS stack (provider secret + DNSPolicy).
# Default true. Set RHCL_DNS_ENABLED=false in environments that handle DNS
# externally through their own automation and the cloud Route53/Azure/GCP
# plumbing is irrelevant.
