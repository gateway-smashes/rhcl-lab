observability_kuadrant_namespace: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_KUADRANT_NAMESPACE') | default(rhcl_namespace, true) }}"
observability_kuadrant_instance: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_KUADRANT_INSTANCE') | default(rhcl_instance_name, true) }}"

