apps_openshift_route_ingress_class_label_key: "{{ lookup('ansible.builtin.env', 'APPS_OPENSHIFT_ROUTE_INGRESS_CLASS_LABEL_KEY') | default('kubernetes.io/ingress.class', true) }}"
