# By design frontends (mobile-bank, developer-portal, …) are exposed via
# native OpenShift Routes (`frontend-route.yml.j2`), NOT through the RHCL
# Gateway. RHCL/Kuadrant is for APIs — putting an SPA behind the gateway
# adds an AuthPolicy + DNSPolicy + TLSPolicy axis you don't get anything
# for on a static site. Keep this `false` unless you have a specific PoC
# reason to also publish the frontend through the gateway (e.g. to demo
# rate-limit on a public asset). Flipping to `true` will also need
# APPS_CONNECTIVITY_FRONTEND_HTTPS_ENABLED=true so the listener gets a
# Certificate from the TLSPolicy.
apps_connectivity_frontend_route_enabled: "{{ lookup('ansible.builtin.env', 'APPS_CONNECTIVITY_FRONTEND_ROUTE_ENABLED') | default('false', true) | bool }}"
