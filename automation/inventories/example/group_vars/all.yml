# MetalLB — on-prem LoadBalancer provider. Disabled by default so cloud
# clusters keep using their native cloud LB. Enable on bare-metal clusters
# that need to expose Services of type=LoadBalancer (e.g. kuadrant-coredns-ext
# in the on-prem CoreDNS flow).
metallb_enabled: "{{ lookup('ansible.builtin.env', 'METALLB_ENABLED') | default('false', true) | bool }}"
metallb_namespace: "{{ lookup('ansible.builtin.env', 'METALLB_NAMESPACE') | default('metallb-system', true) }}"
metallb_operator_name: "{{ lookup('ansible.builtin.env', 'METALLB_OPERATOR_NAME') | default('metallb-operator', true) }}"
metallb_subscription_name: "{{ lookup('ansible.builtin.env', 'METALLB_SUBSCRIPTION_NAME') | default('metallb-operator', true) }}"
metallb_operatorgroup_name: "{{ lookup('ansible.builtin.env', 'METALLB_OPERATORGROUP_NAME') | default('metallb-operator', true) }}"
metallb_channel: "{{ lookup('ansible.builtin.env', 'METALLB_CHANNEL') | default('stable', true) }}"
metallb_source: "{{ lookup('ansible.builtin.env', 'METALLB_SOURCE') | default('redhat-operators', true) }}"
metallb_source_namespace: "{{ lookup('ansible.builtin.env', 'METALLB_SOURCE_NAMESPACE') | default('openshift-marketplace', true) }}"
metallb_operator_webhook_deployment: "{{ lookup('ansible.builtin.env', 'METALLB_OPERATOR_WEBHOOK_DEPLOYMENT') | default('metallb-operator-webhook-server', true) }}"
metallb_cr_name: "{{ lookup('ansible.builtin.env', 'METALLB_CR_NAME') | default('metallb', true) }}"

# IPAddressPool / L2Advertisement
metallb_ipaddresspool_name: "{{ lookup('ansible.builtin.env', 'METALLB_IPADDRESSPOOL_NAME') | default('rhcl-pool', true) }}"
metallb_l2advertisement_name: "{{ lookup('ansible.builtin.env', 'METALLB_L2ADVERTISEMENT_NAME') | default('rhcl-l2', true) }}"
metallb_auto_assign: "{{ lookup('ansible.builtin.env', 'METALLB_AUTO_ASSIGN') | default('true', true) | bool }}"
metallb_avoid_buggy_ips: "{{ lookup('ansible.builtin.env', 'METALLB_AVOID_BUGGY_IPS') | default('false', true) | bool }}"

# Optional L2Advertisement scoping. Leave empty to advertise on every node
# and every interface; set to a comma-separated list of node interface names
# (eth0,bond0) or a single node label (label=value) to restrict.
metallb_l2advertisement_interfaces_raw: "{{ lookup('ansible.builtin.env', 'METALLB_L2ADVERTISEMENT_INTERFACES') | default('', true) }}"
metallb_l2advertisement_interfaces: >-
  {{
    (metallb_l2advertisement_interfaces_raw | regex_replace('\s+', '')).split(',')
    | reject('equalto', '')
    | list
  }}
metallb_l2advertisement_node_selector_label: "{{ lookup('ansible.builtin.env', 'METALLB_L2ADVERTISEMENT_NODE_SELECTOR_LABEL') | default('', true) }}"
metallb_l2advertisement_node_selector_value: "{{ lookup('ansible.builtin.env', 'METALLB_L2ADVERTISEMENT_NODE_SELECTOR_VALUE') | default('', true) }}"

# METALLB_ADDRESSES accepts a comma-separated mix of:
#  - hyphenated ranges:  192.168.68.31-192.168.68.35
#  - single IPv4 hosts:  192.168.68.31  (normalised to 192.168.68.31-192.168.68.31)
#  - CIDR blocks:        192.168.68.0/24
# Example: "192.168.68.31-192.168.68.35,192.168.68.40,192.168.68.0/28"
metallb_addresses_raw: "{{ lookup('ansible.builtin.env', 'METALLB_ADDRESSES') | default('', true) }}"
metallb_addresses: >-
  {{
    (metallb_addresses_raw | regex_replace('\s+', '')).split(',')
    | reject('equalto', '')
    | map('regex_replace', '^([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)$', '\1-\1')
    | list
  }}

# ---------------------------------------------------------------------------
# Observability — Tempo Operator + Red Hat build of OpenTelemetry Operator +
# Cluster Observability Operator (COO) + MinIO (S3 backend for lab) +
# TempoStack + OTel Collector + EnvoyFilter + UIPlugin (Distributed Tracing) +
# Kuadrant observability patch. Implements REQ038.
# Toggle with OBSERVABILITY_ENABLED=false to skip entirely.
# ---------------------------------------------------------------------------
observability_enabled: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_ENABLED') | default('true', true) | bool }}"

# Tempo Operator (OLM)
observability_tempo_namespace: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TEMPO_OPERATOR_NAMESPACE') | default('openshift-tempo-operator', true) }}"
observability_tempo_operator_name: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TEMPO_OPERATOR_NAME') | default('tempo-product', true) }}"
observability_tempo_subscription_name: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TEMPO_SUBSCRIPTION_NAME') | default('tempo-product', true) }}"
observability_tempo_operatorgroup_name: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TEMPO_OPERATORGROUP_NAME') | default('openshift-tempo-operator', true) }}"
observability_tempo_channel: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TEMPO_CHANNEL') | default('stable', true) }}"
observability_tempo_source: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TEMPO_SOURCE') | default('redhat-operators', true) }}"
observability_tempo_source_namespace: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TEMPO_SOURCE_NAMESPACE') | default('openshift-marketplace', true) }}"

# OpenTelemetry Operator (OLM)
observability_otel_namespace: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_OTEL_OPERATOR_NAMESPACE') | default('openshift-opentelemetry-operator', true) }}"
# Service que serve o webhook de admissão do operator OTel. O role espera esse
# Service ter endpoints prontos antes de aplicar o OpenTelemetryCollector —
# sem isso a API rejeita o objeto com 500 ("no endpoints available for
# service"). Sobrescreva se o build do operator no ambiente usar outro nome.
observability_otel_webhook_service: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_OTEL_WEBHOOK_SERVICE') | default('opentelemetry-operator-controller-manager-service', true) }}"
# Espera pelos endpoints do webhook. Num cluster onde o operator já roda, a
# primeira chamada resolve — o `until` só dorme quando a condição falha. Por
# isso o teto é curto: se não respondeu em 60s, esperar mais não conserta,
# tem algo errado e o operador precisa saber.
observability_otel_webhook_wait_retries: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_OTEL_WEBHOOK_WAIT_RETRIES') | default('12', true) | int }}"
observability_otel_webhook_wait_delay: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_OTEL_WEBHOOK_WAIT_DELAY') | default('5', true) | int }}"
observability_otel_operator_name: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_OTEL_OPERATOR_NAME') | default('opentelemetry-product', true) }}"
observability_otel_subscription_name: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_OTEL_SUBSCRIPTION_NAME') | default('opentelemetry-product', true) }}"
observability_otel_operatorgroup_name: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_OTEL_OPERATORGROUP_NAME') | default('openshift-opentelemetry-operator', true) }}"
observability_otel_channel: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_OTEL_CHANNEL') | default('stable', true) }}"
observability_otel_source: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_OTEL_SOURCE') | default('redhat-operators', true) }}"
observability_otel_source_namespace: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_OTEL_SOURCE_NAMESPACE') | default('openshift-marketplace', true) }}"

# Cluster Observability Operator (OLM)
observability_coo_namespace: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_COO_NAMESPACE') | default('openshift-cluster-observability-operator', true) }}"
observability_coo_operator_name: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_COO_OPERATOR_NAME') | default('cluster-observability-operator', true) }}"
observability_coo_subscription_name: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_COO_SUBSCRIPTION_NAME') | default('cluster-observability-operator', true) }}"
observability_coo_operatorgroup_name: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_COO_OPERATORGROUP_NAME') | default('openshift-cluster-observability-operator', true) }}"
observability_coo_channel: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_COO_CHANNEL') | default('stable', true) }}"
observability_coo_source: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_COO_SOURCE') | default('redhat-operators', true) }}"
observability_coo_source_namespace: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_COO_SOURCE_NAMESPACE') | default('openshift-marketplace', true) }}"

# UIPlugin (Distributed Tracing — COO)
observability_uiplugin_name: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_UIPLUGIN_NAME') | default('distributed-tracing', true) }}"
observability_uiplugin_timeout: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_UIPLUGIN_TIMEOUT') | default('30s', true) }}"

# MinIO (S3 backend — lab/POC only)
observability_minio_namespace: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_MINIO_NAMESPACE') | default('minio', true) }}"
observability_minio_root_user: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_MINIO_ROOT_USER') | default('tempo', true) }}"
observability_minio_root_password: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_MINIO_ROOT_PASSWORD') | default('supersecret', true) }}"
observability_minio_bucket: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_MINIO_BUCKET') | default('tempo', true) }}"
observability_minio_storage_size: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_MINIO_STORAGE_SIZE') | default('5Gi', true) }}"
# StorageClassName for the minio-data PVC. Same rationale as
# OBSERVABILITY_TEMPOSTACK_STORAGE_CLASS — leave empty to use the
# cluster default; set when the default isn't immediate-bind or doesn't
# exist (vSphere CSI defaults to WaitForFirstConsumer, which manifests
# as `pod has unbound immediate PersistentVolumeClaims` on the ingester
# pod after Tempo points at the missing bucket).
observability_minio_storage_class: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_MINIO_STORAGE_CLASS') | default('', true) }}"

# TempoStack
observability_tempostack_namespace: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TEMPOSTACK_NAMESPACE') | default('tempo', true) }}"
observability_tempostack_name: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TEMPOSTACK_NAME') | default('tempo-rhcl', true) }}"
observability_tempostack_storage_size: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TEMPOSTACK_STORAGE_SIZE') | default('1Gi', true) }}"
# StorageClassName for the per-component PVCs the Tempo operator
# provisions (ingester WAL, compactor). Leave empty to use the cluster's
# default StorageClass. On clusters where the default isn't immediate-bind
# (e.g. vSphere CSI without a default class) the ingester PVC stays
# Pending with "pod has unbound immediate PersistentVolumeClaims" — set
# OBSERVABILITY_TEMPOSTACK_STORAGE_CLASS=<your class> (e.g. thin-csi,
# vsphere-csi, ocs-storagecluster-ceph-rbd) so the operator stamps it on
# the PVC spec.
observability_tempostack_storage_class: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TEMPOSTACK_STORAGE_CLASS') | default('', true) }}"
# Total CPU/memory budget the operator divides across compactor,
# distributor, gateway, ingester, querier, and query-frontend. The
# original 2 CPU / 2 GiB default left the gateway with ~80m / 64 MiB —
# not enough to respond to the readiness probe in time, so it crash-
# looped on the customer cluster. 4/4 fixed the readiness probe, but
# on r46jf the querier still OOM-killed every couple of hours: its
# slice landed at ~574 MiB, and a single open-window query against
# ~30 blocks pushed it to 98 % memory and crashloop — query-frontend
# then sat with 0 queriers connected and the UI returned 502 on every
# `/api/traces` call. 8 GiB total gives the querier ~1.1 GiB which is
# comfortably above the steady-state working set; bump again on busy
# clusters.
observability_tempostack_total_cpu: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TEMPOSTACK_TOTAL_CPU') | default('4', true) }}"
observability_tempostack_total_memory: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TEMPOSTACK_TOTAL_MEMORY') | default('10Gi', true) }}"
observability_tempostack_tenant_name: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TEMPOSTACK_TENANT_NAME') | default('dev', true) }}"
observability_tempostack_tenant_id: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TEMPOSTACK_TENANT_ID') | default('1610b0c3-c509-4592-a256-a1871353dbfa', true) }}"

# OpenTelemetry Collector
observability_collector_namespace: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_COLLECTOR_NAMESPACE') | default('observability', true) }}"
observability_collector_name: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_COLLECTOR_NAME') | default('otel-rhcl', true) }}"
observability_collector_service_account: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_COLLECTOR_SERVICE_ACCOUNT') | default('otel-collector', true) }}"

# Auto-instrumentation of the banking-api Quarkus pods via the OpenTelemetry
# Operator. When enabled, an Instrumentation CR is applied in the apps
# namespace and the backend Deployments get the
# `instrumentation.opentelemetry.io/inject-java: "true"` annotation — the
# operator injects an init container that copies the Java agent into the
# pod, so Quarkus exports spans as a child of whatever traceparent the
# gateway propagates. This turns a 1-span "gateway → upstream" trace into
# a real end-to-end "gateway → banking-api → JDBC" chain in Tempo, without
# touching application code. Defaults to true so the demo trace works out
# of the box; flip to false on clusters where the OTel operator is not
# installed (or where you want to ship with manual instrumentation).
apps_otel_instrumentation_enabled: "{{ lookup('ansible.builtin.env', 'APPS_OTEL_INSTRUMENTATION_ENABLED') | default('true', true) | bool }}"
apps_otel_instrumentation_endpoint: "{{ lookup('ansible.builtin.env', 'APPS_OTEL_INSTRUMENTATION_ENDPOINT') | default('http://' ~ observability_collector_name ~ '-collector.' ~ observability_collector_namespace ~ '.svc.cluster.local:4318', true) }}"
apps_otel_instrumentation_sampling_ratio: "{{ lookup('ansible.builtin.env', 'APPS_OTEL_INSTRUMENTATION_SAMPLING_RATIO') | default('1.0', true) }}"

# EnvoyFilter (tracing on gateway)
observability_envoyfilter_namespace: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_ENVOYFILTER_NAMESPACE') | default(apps_connectivity_gateway_namespace, true) }}"
observability_envoyfilter_gateway_name: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_ENVOYFILTER_GATEWAY_NAME') | default(apps_connectivity_gateway_name, true) }}"
observability_envoyfilter_service_name: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_ENVOYFILTER_SERVICE_NAME') | default('rhcl-gateway', true) }}"
observability_envoyfilter_sampling: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_ENVOYFILTER_SAMPLING') | default('100', true) | int }}"

# Istio Telemetry CR — tracing on the gateway. Required IN ADDITION to the
# EnvoyFilter above: the filter wires the raw HCM, but Istio only emits
# spans when a Telemetry CR explicitly selects the `opentelemetry` provider.
# Defaults to the gateway namespace and reuses the EnvoyFilter sampling so
# both layers stay aligned out of the box.
observability_tracing_telemetry_name: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TRACING_TELEMETRY_NAME') | default('rhcl-api-tracing', true) }}"
observability_tracing_telemetry_namespace: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TRACING_TELEMETRY_NAMESPACE') | default(observability_envoyfilter_namespace, true) }}"
observability_tracing_telemetry_provider: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TRACING_TELEMETRY_PROVIDER') | default('opentelemetry', true) }}"
observability_tracing_sampling: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TRACING_SAMPLING') | default(observability_envoyfilter_sampling, true) | int }}"

# req035 — Gateway error access logging (Envoy OTel ALS → OTel logs pipeline).
# Disable by setting OBSERVABILITY_ACCESS_LOGS_ENABLED=false; the role will
# skip the EnvoyFilter and emit an OTel Collector without the logs pipeline.
observability_access_logs_enabled: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_ACCESS_LOGS_ENABLED') | default('true', true) | bool }}"
# Threshold (>=) for which response codes Envoy ships to the Collector.
# Override at runtime without re-applying via the Envoy runtime key
# `rhcl.access_log.min_status`.
observability_access_logs_min_status: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_ACCESS_LOGS_MIN_STATUS') | default('400', true) | int }}"
# Path inside the Collector pod where file/audit appends JSON Lines.
observability_access_logs_path: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_ACCESS_LOGS_PATH') | default('/var/log/rhcl-errors.json', true) }}"
observability_access_logs_rotation_max_megabytes: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_ACCESS_LOGS_ROTATION_MAX_MB') | default('100', true) | int }}"
observability_access_logs_rotation_max_days: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_ACCESS_LOGS_ROTATION_MAX_DAYS') | default('14', true) | int }}"
observability_access_logs_rotation_max_backups: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_ACCESS_LOGS_ROTATION_MAX_BACKUPS') | default('5', true) | int }}"
# Optional second/third exporter — disabled by default. Enable when the
# corresponding backend (LokiStack / Splunk HEC) is reachable.
observability_access_logs_loki_enabled: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_ACCESS_LOGS_LOKI_ENABLED') | default('false', true) | bool }}"
observability_access_logs_loki_endpoint: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_ACCESS_LOGS_LOKI_ENDPOINT') | default('https://lokistack-gateway-http.openshift-logging.svc:8080/api/logs/v1/application/otlp', true) }}"
observability_access_logs_splunk_enabled: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_ACCESS_LOGS_SPLUNK_ENABLED') | default('false', true) | bool }}"
observability_access_logs_splunk_endpoint: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_ACCESS_LOGS_SPLUNK_ENDPOINT') | default('https://splunk-hec.internal.example.com:8088/services/collector', true) }}"
# Tag carregada no `resource/rhcl-tag` processor — facilita agregar em
# ambientes multi-cluster ou SIEM corporativo do banco.
observability_cluster_name: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_CLUSTER_NAME') | default('rhcl-poc', true) }}"

# req066 — Audit access log (stdout JSON, 100% traffic).
# Complementar ao req035 (OTLP errors only). Desabilite com
# OBSERVABILITY_AUDIT_LOG_ENABLED=false.
observability_audit_log_enabled: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_AUDIT_LOG_ENABLED') | default('true', true) | bool }}"
# Adds three response headers (x-trace-id, x-parent-span-id, x-trace-parent)
# whenever the client sent a W3C `traceparent` on the request — lets the
# caller correlate its own request log line with the trace recorded in
# Tempo without having to instrument trace propagation end-to-end.
# Implemented via a small Lua EnvoyFilter on the gateway. No-op for
# clients that don't send `traceparent`.
observability_trace_response_headers_enabled: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_TRACE_RESPONSE_HEADERS_ENABLED') | default('true', true) | bool }}"

