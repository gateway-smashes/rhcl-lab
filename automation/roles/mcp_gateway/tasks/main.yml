---
- name: Validate mcp_gateway role action
  ansible.builtin.assert:
    that:
      - (component_action | default(rhcl_action)) in ["install", "remove", "validate"]
    fail_msg: "Requested mcp_gateway action must be install, remove, or validate."

- name: Run mcp_gateway action
  ansible.builtin.include_tasks: "{{ component_action | default(rhcl_action) }}.yml"
