---
- name: Validate cluster access
  ansible.builtin.include_role:
    name: common
    tasks_from: assert_cluster_access.yml

# All OLM-related work below is gated by observability_install_operator.
# Set OBSERVABILITY_INSTALL_OPERATOR=false (or OPERATORS_INSTALL_ENABLED=false
# globally) when Tempo/OTel/COO operators are managed out-of-band. When
# skipping we still need the namespaces (downstream tasks create CRs in them)
# but we don't touch OG/Sub/CSV — and we sanity-check presence at the end.

# ---------------------------------------------------------------
# 1. Tempo Operator (OLM)
# ---------------------------------------------------------------
- name: Ensure the Tempo Operator namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ observability_tempo_namespace }}"
    state: present

- name: Query existing OperatorGroups in the Tempo namespace
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1
    kind: OperatorGroup
    namespace: "{{ observability_tempo_namespace }}"
  register: observability_tempo_existing_ogs
  changed_when: false
  when: observability_install_operator | bool

- name: Remove pre-existing OperatorGroups with a different name (Tempo)
  kubernetes.core.k8s:
    api_version: operators.coreos.com/v1
    kind: OperatorGroup
    namespace: "{{ observability_tempo_namespace }}"
    name: "{{ item.metadata.name }}"
    state: absent
  loop: "{{ observability_tempo_existing_ogs.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when:
    - observability_install_operator | bool
    - item.metadata.name != observability_tempo_operatorgroup_name

- name: Ensure the Tempo OperatorGroup exists
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'tempo-operatorgroup.yml.j2') | from_yaml }}"
  when: observability_install_operator | bool

- name: Ensure the Tempo Subscription exists
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'tempo-subscription.yml.j2') | from_yaml }}"
  when: observability_install_operator | bool

- name: Wait for the Tempo subscription to report a current CSV
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    namespace: "{{ observability_tempo_namespace }}"
    name: "{{ observability_tempo_subscription_name }}"
  register: observability_tempo_subscription
  changed_when: false
  failed_when: false
  until:
    - observability_tempo_subscription.resources | length == 1
    - observability_tempo_subscription.resources[0].status.currentCSV is defined
  retries: 60
  delay: 10
  when: observability_install_operator | bool

- name: Wait for the Tempo CSV to succeed
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ observability_tempo_namespace }}"
    name: "{{ observability_tempo_subscription.resources[0].status.currentCSV }}"
  register: observability_tempo_csv
  changed_when: false
  failed_when: false
  until:
    - observability_tempo_csv.resources | length == 1
    - observability_tempo_csv.resources[0].status.phase == "Succeeded"
  retries: 60
  delay: 10
  when: observability_install_operator | bool

# ---------------------------------------------------------------
# 2. Red Hat build of OpenTelemetry Operator (OLM)
# ---------------------------------------------------------------
- name: Ensure the OpenTelemetry Operator namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ observability_otel_namespace }}"
    state: present

- name: Query existing OperatorGroups in the OTel namespace
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1
    kind: OperatorGroup
    namespace: "{{ observability_otel_namespace }}"
  register: observability_otel_existing_ogs
  changed_when: false
  when: observability_install_operator | bool

- name: Remove pre-existing OperatorGroups with a different name (OTel)
  kubernetes.core.k8s:
    api_version: operators.coreos.com/v1
    kind: OperatorGroup
    namespace: "{{ observability_otel_namespace }}"
    name: "{{ item.metadata.name }}"
    state: absent
  loop: "{{ observability_otel_existing_ogs.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when:
    - observability_install_operator | bool
    - item.metadata.name != observability_otel_operatorgroup_name

- name: Ensure the OpenTelemetry OperatorGroup exists
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'otel-operatorgroup.yml.j2') | from_yaml }}"
  when: observability_install_operator | bool

- name: Ensure the OpenTelemetry Subscription exists
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'otel-subscription.yml.j2') | from_yaml }}"
  when: observability_install_operator | bool

- name: Wait for the OTel subscription to report a current CSV
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    namespace: "{{ observability_otel_namespace }}"
    name: "{{ observability_otel_subscription_name }}"
  register: observability_otel_subscription
  changed_when: false
  failed_when: false
  until:
    - observability_otel_subscription.resources | length == 1
    - observability_otel_subscription.resources[0].status.currentCSV is defined
  retries: 60
  delay: 10
  when: observability_install_operator | bool

- name: Wait for the OTel CSV to succeed
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ observability_otel_namespace }}"
    name: "{{ observability_otel_subscription.resources[0].status.currentCSV }}"
  register: observability_otel_csv
  changed_when: false
  failed_when: false
  until:
    - observability_otel_csv.resources | length == 1
    - observability_otel_csv.resources[0].status.phase == "Succeeded"
  retries: 60
  delay: 10
  when: observability_install_operator | bool

