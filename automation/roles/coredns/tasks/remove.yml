---
- name: Validate cluster access
  ansible.builtin.include_role:
    name: common
    tasks_from: assert_cluster_access.yml

- name: Remove the CoreDNS namespace and all contained resources
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ coredns_namespace }}"
    state: absent
    wait: true
    wait_timeout: 600
