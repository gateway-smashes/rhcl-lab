---
- name: Validate monitoring role action
  ansible.builtin.assert:
    that:
      - (component_action | default(rhcl_action)) in ["install", "remove", "validate"]
    fail_msg: "Requested monitoring action must be install, remove, or validate."

- name: Run monitoring action
  ansible.builtin.include_tasks: "{{ component_action | default(rhcl_action) }}.yml"
