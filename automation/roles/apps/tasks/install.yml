  register: apps_rhoai_frontend_deployment
  changed_when: false
  failed_when: false
  until:
    - apps_rhoai_frontend_deployment.resources | length == 1
    - (apps_rhoai_frontend_deployment.resources[0].status.availableReplicas | default(0)) | int >= 1
  retries: "{{ apps_wait_retries | int }}"
  delay: "{{ apps_wait_delay | int }}"
  when: apps_rhoai_enabled

- name: Wait for connectivity gateway programming
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: Gateway
    namespace: "{{ apps_connectivity_gateway_namespace }}"
    name: "{{ apps_connectivity_gateway_name }}"
  register: apps_connectivity_gateway
  changed_when: false
  failed_when: false
  until:
    - apps_connectivity_gateway.resources | length == 1
    - >-
      apps_connectivity_gateway.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Programmed')
      | selectattr('status', 'equalto', 'True')
      | list | length == 1
  retries: "{{ apps_wait_retries | int }}"
  delay: "{{ apps_wait_delay | int }}"
  when: apps_connectivity_link_enabled

- name: Wait for frontend connectivity HTTPRoute acceptance
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    namespace: "{{ apps_namespace }}"
    name: "{{ apps_connectivity_frontend_route_name }}"
  register: apps_connectivity_frontend_httproute
  changed_when: false
  failed_when: false
  until:
    - apps_connectivity_frontend_httproute.resources | length == 1
    - >-
      apps_connectivity_frontend_httproute.resources[0].status.parents | default([])
      | selectattr('conditions', 'defined')
      | map(attribute='conditions') | flatten
      | selectattr('type', 'equalto', 'Accepted')
