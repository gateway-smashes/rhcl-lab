    - apps_connectivity_tls_enabled

- name: Annotate gateway service for AWS ELB TCP passthrough
  block:
    - name: Query gateway service
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        namespace: "{{ apps_connectivity_gateway_namespace }}"
        label_selectors:
          - "gateway.networking.k8s.io/gateway-name={{ apps_connectivity_gateway_name }}"
      register: apps_connectivity_gateway_svc
      changed_when: false
      until: apps_connectivity_gateway_svc.resources | length >= 1
      retries: 30
      delay: 5

    - name: Extract status-port NodePort
      ansible.builtin.set_fact:
        apps_connectivity_gateway_status_nodeport: >-
          {{
            apps_connectivity_gateway_svc.resources[0].spec.ports
            | selectattr('name', 'equalto', 'status-port')
            | map(attribute='nodePort')
            | first
          }}

    - name: Apply ELB TCP passthrough annotations
      kubernetes.core.k8s:
        state: patched
        api_version: v1
        kind: Service
        namespace: "{{ apps_connectivity_gateway_namespace }}"
        name: "{{ apps_connectivity_gateway_svc.resources[0].metadata.name }}"
        definition:
          metadata:
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
              service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: HTTP
              service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /healthz/ready
              service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "{{ apps_connectivity_gateway_status_nodeport | string }}"
  when:
    - apps_connectivity_link_enabled
    - apps_connectivity_tls_enabled
    - apps_connectivity_gateway_elb_annotations_enabled

- name: Wait for connectivity TLS secret to be issued
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ apps_connectivity_gateway_namespace }}"
    name: "{{ apps_connectivity_tls_secret_name }}"
  register: apps_connectivity_tls_secret
  changed_when: false
  failed_when: false
  until:
    - apps_connectivity_tls_secret.resources | length == 1
    - (apps_connectivity_tls_secret.resources[0].data['tls.crt'] | default('')) | length > 0
    - (apps_connectivity_tls_secret.resources[0].data['tls.key'] | default('')) | length > 0
  retries: "{{ apps_wait_retries_long | int }}"
  delay: "{{ apps_wait_delay | int }}"
  when:
    - apps_connectivity_link_enabled
    - apps_connectivity_tls_enabled

- name: Start the backend image build
  ansible.builtin.command:
    argv:
