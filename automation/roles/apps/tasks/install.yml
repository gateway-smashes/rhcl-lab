      - --wait=true
      - --follow=true
  register: apps_rhoai_frontend_build
  changed_when: true
  when:
    - apps_rhoai_enabled
    - not apps_skip_build
    - apps_image_source != 'quay'

- name: Trigger manual rollouts when image builds are skipped or coming from Quay
  ansible.builtin.command:
    argv:
      - oc
      - rollout
      - restart
      - "deployment/{{ item }}"
      - -n
      - "{{ apps_namespace }}"
  loop:
    - "{{ apps_backend_primary_name }}"
    - "{{ apps_backend_secondary_name }}"
    - "{{ apps_frontend_name }}"
    - "{{ apps_ipfilter_name }}"
    - "{{ apps_rhoai_backend_name }}"
    - "{{ apps_rhoai_frontend_name }}"
    - "{{ apps_ledger_name }}"
  changed_when: true
  when:
    - apps_skip_build or apps_image_source == 'quay'
    - item != apps_ipfilter_name or apps_ipfilter_enabled
    - item not in [apps_rhoai_backend_name, apps_rhoai_frontend_name] or apps_rhoai_enabled
    - item != apps_ledger_name or apps_ledger_enabled

- name: Wait for backend v1 deployment availability
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ apps_namespace }}"
    name: "{{ apps_backend_primary_name }}"
  register: apps_backend_v1_deployment
  changed_when: false
  failed_when: false
  until:
    - apps_backend_v1_deployment.resources | length == 1
    - (apps_backend_v1_deployment.resources[0].status.availableReplicas | default(0)) | int >= 1
  retries: "{{ apps_wait_retries | int }}"
  delay: "{{ apps_wait_delay | int }}"

- name: Wait for ledger-api deployment availability (REQ 038 trace propagation)
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ apps_namespace }}"
    name: "{{ apps_ledger_name }}"
  register: apps_ledger_deployment
  changed_when: false
  failed_when: false
  until:
