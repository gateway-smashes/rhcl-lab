# Tiered plans on banking-api — backed by either PlanPolicy (different rates
# per tier, shared bucket) or a hand-rolled RateLimitPolicy (per-key bucket,
# uniform rate). Controlled by apps_connectivity_plans_mode; see all.yml.
# Whichever mode is active gets applied AND the other one gets cleaned up,
# so flipping the var between runs leaves no stale resource behind.
- name: Apply tiered PlanPolicy on banking-api (apps_connectivity_plans_mode=planpolicy)
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'connectivity-planpolicy.yml.j2') | from_yaml }}"
  when:
    - apps_connectivity_link_enabled
    - apps_connectivity_planpolicy_enabled
    - apps_connectivity_plans_mode == 'planpolicy'

- name: Remove the manual per-consumer RateLimitPolicy when switching to PlanPolicy
  kubernetes.core.k8s:
    state: absent
    api_version: kuadrant.io/v1
    kind: RateLimitPolicy
    namespace: "{{ apps_namespace }}"
    name: "{{ apps_connectivity_planpolicy_name }}"
  when:
    - apps_connectivity_link_enabled
    - apps_connectivity_planpolicy_enabled
    - apps_connectivity_plans_mode == 'planpolicy'

- name: Apply manual per-consumer RateLimitPolicy (apps_connectivity_plans_mode=manual-rlp)
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'connectivity-ratelimitpolicy-plans.yml.j2') | from_yaml }}"
  when:
    - apps_connectivity_link_enabled
    - apps_connectivity_planpolicy_enabled
    - apps_connectivity_plans_mode == 'manual-rlp'

- name: Remove the PlanPolicy when switching to manual per-consumer RateLimitPolicy
  kubernetes.core.k8s:
    state: absent
    api_version: extensions.kuadrant.io/v1alpha1
    kind: PlanPolicy
    namespace: "{{ apps_namespace }}"
    name: "{{ apps_connectivity_planpolicy_name }}"
  when:
