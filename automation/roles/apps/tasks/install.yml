---
- name: Validate cluster access
  ansible.builtin.include_role:
    name: common
    tasks_from: assert_cluster_access.yml

- name: Validate oc CLI availability
  ansible.builtin.include_role:
    name: common
    tasks_from: assert_oc_cli.yml

- name: Validate connectivity TLS inputs
  ansible.builtin.include_role:
    name: common
    tasks_from: assert_apps_tls_inputs.yml
  when:
    - apps_connectivity_link_enabled
    - apps_connectivity_tls_enabled

- name: Assert root domain is provided when wildcard listener mode is enabled
  ansible.builtin.assert:
    that:
      - rhcl_zone_root_domain | length > 0
    fail_msg: >-
      APPS_CONNECTIVITY_LISTENER_WILDCARD_ENABLED=true requires RHCL_ZONE_ROOT_DOMAIN
      (or KUADRANT_ZONE_ROOT_DOMAIN) to be set so the listener hostname can render
      as '*.<root-domain>'. Set the root domain or disable wildcard mode.
  when:
    - apps_connectivity_link_enabled
    - apps_connectivity_listener_wildcard_enabled

- name: Resolve application source directories
  ansible.builtin.set_fact:
    apps_backend_source_dir_resolved: >-
      {{
        (apps_backend_source_dir | trim)
        if (apps_backend_source_dir | trim | length) > 0
        else (playbook_dir ~ '/../../apps/backend/banking-api')
      }}
    apps_frontend_source_dir_resolved: >-
      {{
        (apps_frontend_source_dir | trim)
        if (apps_frontend_source_dir | trim | length) > 0
        else (playbook_dir ~ '/../../apps/frontend/mobile-bank')
      }}
    apps_ipfilter_source_dir_resolved: >-
      {{
        (apps_ipfilter_source_dir | trim)
        if (apps_ipfilter_source_dir | trim | length) > 0
        else (playbook_dir ~ '/../../apps/backend/ipfilter-php')
      }}
    apps_rhoai_backend_source_dir_resolved: >-
      {{
        (apps_rhoai_backend_source_dir | trim)
        if (apps_rhoai_backend_source_dir | trim | length) > 0
        else (playbook_dir ~ '/../../apps/rhoai-assistant/backend')
      }}
    apps_rhoai_frontend_source_dir_resolved: >-
      {{
        (apps_rhoai_frontend_source_dir | trim)
        if (apps_rhoai_frontend_source_dir | trim | length) > 0
        else (playbook_dir ~ '/../../apps/rhoai-assistant/frontend')
      }}
    apps_ledger_source_dir_resolved: >-
      {{
        (apps_ledger_source_dir | trim)
        if (apps_ledger_source_dir | trim | length) > 0
        else (playbook_dir ~ '/../../apps/backend/ledger-api')
      }}

- name: Assert RHOAI MaaS API key is set when RHOAI app is enabled
  ansible.builtin.assert:
    that:
      - apps_rhoai_maas_api_key | length > 0
    fail_msg: >-
      APPS_RHOAI_ENABLED=true requires APPS_RHOAI_MAAS_API_KEY (Bearer token for the
      MaaS LiteLLM gateway).
  when: apps_rhoai_enabled

- name: Stat resolved application source directories
  ansible.builtin.stat:
    path: "{{ item.path }}"
  register: apps_source_dir_stats
  loop:
    - name: backend
      env: APPS_BACKEND_SOURCE_DIR
      path: "{{ apps_backend_source_dir_resolved | trim }}"
    - name: frontend
      env: APPS_FRONTEND_SOURCE_DIR
      path: "{{ apps_frontend_source_dir_resolved | trim }}"
    - name: ipfilter
      env: APPS_IPFILTER_SOURCE_DIR
      path: "{{ apps_ipfilter_source_dir_resolved | trim }}"
    - name: rhoai-backend
      env: APPS_RHOAI_BACKEND_SOURCE_DIR
      path: "{{ apps_rhoai_backend_source_dir_resolved | trim }}"
    - name: rhoai-frontend
      env: APPS_RHOAI_FRONTEND_SOURCE_DIR
      path: "{{ apps_rhoai_frontend_source_dir_resolved | trim }}"
    - name: ledger
      env: APPS_LEDGER_SOURCE_DIR
      path: "{{ apps_ledger_source_dir_resolved | trim }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.path }}"
  when:
    - not apps_skip_build
    - apps_image_source != 'quay'
    - item.name != 'ipfilter' or apps_ipfilter_enabled
    - item.name not in ['rhoai-backend', 'rhoai-frontend'] or apps_rhoai_enabled
    - item.name != 'ledger' or apps_ledger_enabled

- name: Stat Dockerfile inside each resolved source directory
  ansible.builtin.stat:
    path: "{{ item.path }}/Dockerfile"
  register: apps_source_dockerfile_stats
  loop:
    - name: backend
      env: APPS_BACKEND_SOURCE_DIR
      path: "{{ apps_backend_source_dir_resolved | trim }}"
    - name: frontend
      env: APPS_FRONTEND_SOURCE_DIR
      path: "{{ apps_frontend_source_dir_resolved | trim }}"
    - name: ipfilter
      env: APPS_IPFILTER_SOURCE_DIR
      path: "{{ apps_ipfilter_source_dir_resolved | trim }}"
    - name: rhoai-backend
      env: APPS_RHOAI_BACKEND_SOURCE_DIR
      path: "{{ apps_rhoai_backend_source_dir_resolved | trim }}"
    - name: rhoai-frontend
      env: APPS_RHOAI_FRONTEND_SOURCE_DIR
      path: "{{ apps_rhoai_frontend_source_dir_resolved | trim }}"
    - name: ledger
      env: APPS_LEDGER_SOURCE_DIR
      path: "{{ apps_ledger_source_dir_resolved | trim }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.path }}/Dockerfile"
  when:
    - not apps_skip_build
    - apps_image_source != 'quay'
    - item.name != 'ipfilter' or apps_ipfilter_enabled
    - item.name not in ['rhoai-backend', 'rhoai-frontend'] or apps_rhoai_enabled
    - item.name != 'ledger' or apps_ledger_enabled

- name: Assert resolved source directories exist
  ansible.builtin.assert:
    that:
      - (item.item.path | length) > 0
      - item.stat.exists
      - item.stat.isdir | default(false)
    fail_msg: >-
      Resolved {{ item.item.name }} source directory '{{ item.item.path }}' is
      missing or not a directory. The OpenShift binary BuildConfig requires a
      valid source tree; otherwise 'oc start-build' will create a Build with an
      empty spec.source and the API rejects it with
      "must provide a value for at least one source input(git, binary, dockerfile, images)".
      Set {{ item.item.env }} to an absolute path containing the Dockerfile, or
      run the playbook so '<playbook_dir>/../../apps/{{ item.item.name }}/<app>'
      resolves to the source tree. Set apps_skip_build=true to bypass builds.
  loop: "{{ apps_source_dir_stats.results }}"
  loop_control:
    label: "{{ item.item.name }} -> {{ item.item.path }}"
  when:
    - not apps_skip_build
    - apps_image_source != 'quay'
    - item.item.name != 'ipfilter' or apps_ipfilter_enabled
    - item.item.name not in ['rhoai-backend', 'rhoai-frontend'] or apps_rhoai_enabled
    - item.item.name != 'ledger' or apps_ledger_enabled

- name: Assert each resolved source directory contains a Dockerfile
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg | default(false)
    fail_msg: >-
      Resolved {{ item.item.name }} source directory '{{ item.item.path }}'
      does not contain a Dockerfile. The BuildConfig uses dockerStrategy with
      dockerfilePath=Dockerfile, so the binary upload must include it at the
      tree root. Point {{ item.item.env }} at the directory that holds the
      Dockerfile, or fix the default lab layout under
      apps/{{ item.item.name }}/<app>/Dockerfile.
  loop: "{{ apps_source_dockerfile_stats.results }}"
  loop_control:
    label: "{{ item.item.name }} -> {{ item.item.path }}/Dockerfile"
  when:
    - not apps_skip_build
    - apps_image_source != 'quay'
    - item.item.name != 'ipfilter' or apps_ipfilter_enabled
    - item.item.name not in ['rhoai-backend', 'rhoai-frontend'] or apps_rhoai_enabled
    - item.item.name != 'ledger' or apps_ledger_enabled

- name: Assert IP filter settings are valid
  ansible.builtin.assert:
    that:
      - apps_ipfilter_acl_mode in ['allow-list', 'deny-list']
      - (apps_image_source != 'quay') or (apps_ipfilter_image_quay | length > 0)
      - (apps_ipfilter_acl_mode != 'allow-list') or (apps_ipfilter_allowed_cidrs | length > 0)
      - (apps_ipfilter_acl_mode != 'deny-list') or (apps_ipfilter_denied_cidrs | length > 0)
    fail_msg: >-
      IP filter app settings are invalid. APPS_IPFILTER_ACL_MODE must be
      allow-list or deny-list; APPS_IPFILTER_IMAGE_QUAY is required when
      APPS_IMAGE_SOURCE=quay; and the selected CIDR list cannot be empty.
  when: apps_ipfilter_enabled

- name: Assert backend TLS demo route requires HTTPS on banking-api
  ansible.builtin.assert:
    that:
      - apps_backend_tls_enabled
    fail_msg: >-
      APPS_BACKEND_TLS_ROUTE_ENABLED=true requires APPS_BACKEND_TLS_ENABLED=true
      so banking-api exposes HTTPS on port {{ apps_backend_https_port }}.
  when: apps_backend_tls_route_enabled

- name: Ensure the applications namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ apps_namespace }}"
    state: present

- name: Query the cluster ingress domain for connectivity link
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
  register: apps_cluster_ingress
  changed_when: false
  when: apps_connectivity_link_enabled

- name: Resolve the effective DNS suffix for hostname fallbacks
  ansible.builtin.set_fact:
    apps_effective_dns_suffix: >-
      {{
        rhcl_zone_root_domain
        if rhcl_zone_root_domain | length > 0
        else apps_cluster_ingress.resources[0].spec.domain
      }}
  when: apps_connectivity_link_enabled

- name: Resolve the connectivity link hostname
  ansible.builtin.set_fact:
    apps_connectivity_route_hostname_resolved: >-
      {{
        apps_connectivity_route_hostname
        if apps_connectivity_route_hostname | length > 0
        else apps_connectivity_route_name ~ '.' ~ apps_effective_dns_suffix
      }}
    apps_connectivity_frontend_route_hostname_resolved: >-
      {{
        apps_connectivity_frontend_route_hostname
        if apps_connectivity_frontend_route_hostname | length > 0
        else apps_frontend_name ~ '-' ~ apps_namespace ~ '.' ~ apps_effective_dns_suffix
      }}
    apps_ipfilter_route_hostname_resolved: >-
      {{
        apps_ipfilter_route_hostname
        if apps_ipfilter_route_hostname | length > 0
        else apps_ipfilter_route_name ~ '.' ~ apps_effective_dns_suffix
      }}
    apps_backend_tls_route_hostname_resolved: >-
      {{
        apps_backend_tls_route_hostname
        if apps_backend_tls_route_hostname | length > 0
        else 'tls.' ~ apps_effective_dns_suffix
      }}
    apps_req054_route_hostname_resolved: >-
      {{
        apps_req054_route_hostname
        if apps_req054_route_hostname | length > 0
        else apps_req054_route_name ~ '.' ~ apps_effective_dns_suffix
      }}
    apps_req048_route_hostname_resolved: >-
      {{
        apps_req048_route_hostname
        if apps_req048_route_hostname | length > 0
        else apps_req048_route_name ~ '.' ~ apps_effective_dns_suffix
      }}
    apps_ledger_route_hostname_resolved: >-
      {{
        apps_ledger_route_hostname
        if apps_ledger_route_hostname | length > 0
        else apps_ledger_route_name ~ '.' ~ apps_effective_dns_suffix
      }}
    apps_pix_route_hostname_resolved: >-
      {{
        apps_pix_route_hostname
        if apps_pix_route_hostname | length > 0
        else 'pix-api.' ~ apps_effective_dns_suffix
      }}
    apps_frontend_mcp_gateway_url_resolved: >-
      {{
        apps_frontend_mcp_gateway_url
        if apps_frontend_mcp_gateway_url | length > 0
        else 'http://' ~ mcp_gateway_extension_name ~ '.' ~ apps_effective_dns_suffix ~ ':' ~ (mcp_gateway_port | string) ~ mcp_gateway_path
      }}
  when: apps_connectivity_link_enabled

- name: Resolve frontend build URLs
  ansible.builtin.set_fact:
    apps_frontend_rhcl_gateway_url_resolved: >-
      {{
        apps_frontend_rhcl_gateway_url
        if apps_frontend_rhcl_gateway_url | length > 0
        else 'https://' ~ apps_connectivity_route_hostname_resolved ~ '/api/v1/accounts/summary'
      }}
  when: apps_connectivity_link_enabled

- name: Apply application resources
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', item) | from_yaml }}"
  loop: >-
    {{
      ['backend-imagestream.yml.j2', 'frontend-imagestream.yml.j2']
      + (apps_ipfilter_enabled | ternary(['ipfilter-imagestream.yml.j2'], []))
      + (apps_rhoai_enabled | ternary(['rhoai-backend-imagestream.yml.j2', 'rhoai-frontend-imagestream.yml.j2'], []))
      + (apps_ledger_enabled | ternary(['ledger-imagestream.yml.j2'], []))
      + ((apps_image_source == 'quay')
         | ternary([],
                   ['backend-buildconfig.yml.j2', 'frontend-buildconfig.yml.j2']
                   + (apps_ipfilter_enabled | ternary(['ipfilter-buildconfig.yml.j2'], []))
                   + (apps_rhoai_enabled | ternary(['rhoai-backend-buildconfig.yml.j2', 'rhoai-frontend-buildconfig.yml.j2'], []))
                   + (apps_ledger_enabled | ternary(['ledger-buildconfig.yml.j2'], []))))
      + ['backend-v1-service.yml.j2',
         'backend-v2-service.yml.j2',
         'frontend-service.yml.j2',
         ]
      + (apps_ipfilter_enabled | ternary(['ipfilter-service.yml.j2'], []))
      + (apps_req054_enabled | ternary(['req054-service-http11.yml.j2', 'req054-service-h2c.yml.j2'], []))
      + (apps_req048_enabled | ternary(['req048-service-grpc.yml.j2'], []))
      + (apps_ledger_enabled | ternary(['ledger-service.yml.j2'], []))
      + (apps_pix_enabled | ternary(['pix-service.yml.j2', 'pix-configmap.yml.j2'], []))
      + (apps_rhoai_enabled | ternary(['rhoai-backend-rbac.yml.j2', 'rhoai-backend-secret.yml.j2', 'rhoai-backend-service.yml.j2', 'rhoai-frontend-service.yml.j2'], []))
      + [
         'backend-destinationrule.yml.j2',
         'backend-v2-destinationrule.yml.j2']
    }}

- name: Wait for backend TLS serving cert secrets
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ apps_namespace }}"
    name: "{{ item }}"
  register: apps_backend_tls_secret
  changed_when: false
  until:
    - apps_backend_tls_secret.resources | length == 1
    - (apps_backend_tls_secret.resources[0].data['tls.crt'] | default('')) | length > 0
    - (apps_backend_tls_secret.resources[0].data['tls.key'] | default('')) | length > 0
  retries: 60
  delay: 5
  loop:
    - "{{ apps_backend_primary_tls_secret_name }}"
    - "{{ apps_backend_secondary_tls_secret_name }}"
  when: apps_backend_tls_enabled

- name: Read OpenShift service serving CA
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: service-ca.crt
    namespace: openshift-config-managed
  register: apps_openshift_service_ca_cm
  changed_when: false
  when: apps_backend_tls_route_enabled

- name: Apply backend TLS route service CA configmap for BackendTLSPolicy
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'backend-tls-service-ca-configmap.yml.j2') | from_yaml }}"
  vars:
    apps_backend_tls_route_service_ca_pem: "{{ apps_openshift_service_ca_cm.resources[0].data['service-ca.crt'] }}"
  when:
    - apps_backend_tls_route_enabled
    - apps_openshift_service_ca_cm.resources | length == 1

# OTel Instrumentation CR must exist before the backend Deployments are
# applied — the OpenTelemetry Operator only injects the Java agent into
# pods that get scheduled AFTER the CR is in place. Gated by
# apps_otel_instrumentation_enabled (default true); also gated on the
# Instrumentation CRD being installed on the cluster so the apply doesn't
# fail on environments where the OTel operator is absent.
- name: Probe Instrumentation CRD availability (OTel operator installed?)
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: instrumentations.opentelemetry.io
  register: apps_instrumentation_crd_query
  changed_when: false
  failed_when: false
  when: apps_otel_instrumentation_enabled

- name: Compute Instrumentation CRD availability fact
  ansible.builtin.set_fact:
    apps_instrumentation_crd_present: >-
      {{
        apps_otel_instrumentation_enabled
        and ((apps_instrumentation_crd_query.resources | default([])) | length > 0)
      }}

# The CRD being present does not mean the CR can be written: an Instrumentation
# goes through the OTel operator's mutating webhook, so an operator that is
# down rejects the apply with a 500 even though the CRD is installed. When the
# CR already exists the cluster is in the desired state and already-running
# pods keep their injected agent, so a failed re-apply must not stop the play.
- name: Check whether the Instrumentation CR already exists
  kubernetes.core.k8s_info:
    api_version: opentelemetry.io/v1alpha1
    kind: Instrumentation
    namespace: "{{ apps_namespace }}"
    name: "{{ apps_namespace }}-java"
  register: apps_instrumentation_existing
  changed_when: false
  failed_when: false
  when: apps_instrumentation_crd_present

- name: Apply the OTel Instrumentation CR (banking-api auto-tracing)
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'connectivity-instrumentation.yml.j2') | from_yaml }}"
  register: apps_instrumentation_apply
  when: apps_instrumentation_crd_present
  failed_when:
    - apps_instrumentation_apply is failed
    - (apps_instrumentation_existing.resources | default([]) | length) == 0

- name: Warn that the Instrumentation CR could not be reconciled
  ansible.builtin.debug:
    msg: >-
      Could not re-apply Instrumentation '{{ apps_namespace }}/{{ apps_namespace }}-java'
      — the OpenTelemetry operator webhook is not answering — but the CR
      already exists, so pods already running keep the Java agent that was
      injected into them and the play continues. Two caveats while the
      operator stays down: this CR is not reconciled against the role's
      template, and NEWLY created pods get no agent injected, because that
      injection is itself done by the operator's pod webhook.
  when:
    - apps_instrumentation_crd_present
    - apps_instrumentation_apply is failed
    - (apps_instrumentation_existing.resources | default([]) | length) > 0

- name: Warn when OTel auto-instrumentation requested but CRD missing
  ansible.builtin.debug:
    msg: >-
      APPS_OTEL_INSTRUMENTATION_ENABLED=true but the
      instrumentations.opentelemetry.io CRD is not installed. The Java
      agent will NOT be injected into banking-api pods — Tempo will show
      only the gateway span for each request. Install the OpenTelemetry
      Operator (run the observability role or
      `playbooks/observability-install.yml`) to enable end-to-end traces.
  when:
    - apps_otel_instrumentation_enabled
    - not apps_instrumentation_crd_present

- name: Apply application deployments and routes
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', item) | from_yaml }}"
  loop: >-
    {{
      ['backend-v1-deployment.yml.j2',
       'backend-v2-deployment.yml.j2',
       'frontend-deployment.yml.j2']
      + (apps_ipfilter_enabled | ternary(['ipfilter-deployment.yml.j2'], []))
      + (apps_pix_enabled | ternary(['pix-deployment.yml.j2'], []))
      + (apps_rhoai_enabled | ternary(['rhoai-backend-deployment.yml.j2', 'rhoai-frontend-deployment.yml.j2'], []))
      + (apps_ledger_enabled | ternary(['ledger-deployment.yml.j2'], []))
      + ['backend-v1-route.yml.j2',
         'backend-v2-route.yml.j2',
         'frontend-route.yml.j2']
      + (apps_rhoai_enabled | ternary(['rhoai-frontend-route.yml.j2'], []))
      + (apps_ledger_enabled | ternary(['ledger-route.yml.j2'], []))
    }}

- name: Apply banking-api ServiceMonitor (req018 — bank_ai_tokens_total scrape)
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'banking-api-servicemonitor.yml.j2') | from_yaml }}"
  when: apps_backend_servicemonitor_enabled | bool

# BackendTLSPolicy is an EXPERIMENTAL Gateway API resource (still alpha as of
# Gateway API 1.2; not shipped by the GA install path Kuadrant 1.3/1.4 uses).
# Probe whether the cluster has it before any task that would touch the kind;
# every consumer downstream gates itself on `apps_backendtlspolicy_crd_present`
# so a missing CRD doesn't fail the install or the remove flow.
- name: Probe BackendTLSPolicy CRD availability
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: backendtlspolicies.gateway.networking.k8s.io
  register: apps_backendtlspolicy_crd_query
  changed_when: false
  failed_when: false

- name: Compute BackendTLSPolicy availability fact
  ansible.builtin.set_fact:
    apps_backendtlspolicy_crd_present: "{{ (apps_backendtlspolicy_crd_query.resources | default([])) | length > 0 }}"

- name: Warn when BackendTLSPolicy is requested but the CRD is absent
  ansible.builtin.debug:
    msg: >-
      APPS_BACKEND_TLS_ROUTE_ENABLED=true but the BackendTLSPolicy CRD is not
      installed on this cluster. The backend-tls demo route and policy will
      be skipped (the rest of the install proceeds). Install the experimental
      Gateway API channel to enable it: 'oc apply -f
      https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/experimental-install.yaml'
  when:
    - apps_connectivity_link_enabled
    - apps_backend_tls_route_enabled
    - not apps_backendtlspolicy_crd_present

- name: Apply connectivity link resources
  tags: [connectivity_link]
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', item) | from_yaml }}"
  loop: >-
    {{
      ['connectivity-gateway.yml.j2', 'connectivity-httproute.yml.j2']
      + (apps_connectivity_frontend_route_enabled | ternary(['connectivity-frontend-httproute.yml.j2'], []))
      + (apps_ipfilter_enabled | ternary(['ipfilter-httproute.yml.j2'], []))
      + (apps_req054_enabled | ternary(['req054-httproute.yml.j2'], []))
      + (apps_req048_enabled | ternary(['req048-httproute.yml.j2'], []))
      + (apps_ledger_enabled | ternary(['ledger-httproute.yml.j2'], []))
      + (apps_pix_enabled | ternary(['pix-httproute.yml.j2'], []))
      + ((apps_backend_tls_route_enabled and apps_backendtlspolicy_crd_present) | ternary(['backend-tls-httproute.yml.j2', 'backend-tls-backendtlspolicy.yml.j2'], []))
    }}
  when: apps_connectivity_link_enabled

- name: Resolve OpenShift Route target Service name
  ansible.builtin.set_fact:
    apps_openshift_route_target_service_resolved: >-
      {{
        (apps_openshift_route_target_service | trim)
        if (apps_openshift_route_target_service | trim | length) > 0
        else (apps_connectivity_gateway_name ~ '-' ~ gateway_api_gatewayclass_name)
      }}
  when:
    - apps_connectivity_link_enabled
    - apps_openshift_route_enabled

- name: Apply OpenShift Route fronting the Gateway Service
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'connectivity-openshift-route.yml.j2') | from_yaml }}"
  vars:
    route_hostname: "{{ item }}"
  loop: >-
    {{
      [apps_connectivity_route_hostname_resolved]
      + (apps_connectivity_frontend_route_enabled
         | ternary([apps_connectivity_frontend_route_hostname_resolved], []))
      + (apps_ipfilter_enabled | ternary([apps_ipfilter_route_hostname_resolved], []))
      + (apps_backend_tls_route_enabled | ternary([apps_backend_tls_route_hostname_resolved], []))
      + (apps_req054_enabled | ternary([apps_req054_route_hostname_resolved], []))
      + (apps_req048_enabled | ternary([apps_req048_route_hostname_resolved], []))
      + (apps_ledger_enabled | ternary([apps_ledger_route_hostname_resolved], []))
    }}
  loop_control:
    label: "{{ item }}"
  when:
    - apps_connectivity_link_enabled
    - apps_openshift_route_enabled

- name: Ensure API key secret namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
