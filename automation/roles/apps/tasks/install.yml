- name: Start the RHOAI backend image build
  ansible.builtin.command:
    argv:
      - oc
      - start-build
      - "bc/{{ apps_rhoai_backend_image_name }}"
      - "--from-dir={{ apps_rhoai_backend_source_dir_resolved }}"
      - -n
