# req026 — gateway-enforced max request body for /api/files/upload.
# Paired with the per-rule `timeouts.request` block added to
# connectivity-httproute.yml.j2, gated on `apps_streaming_enabled`. The
# HTTPRoute change reconverges automatically on the existing apply task,
# so this block only needs to manage the EnvoyFilter lifecycle.
- name: Apply streaming body-size EnvoyFilter (req026)
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'connectivity-streaming-envoyfilter.yml.j2') | from_yaml }}"
  when:
