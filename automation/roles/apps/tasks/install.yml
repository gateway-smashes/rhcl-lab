      - "{{ apps_namespace }}"
      - --wait=true
      - --follow=true
  register: apps_backend_build
  changed_when: true
  when:
    - not apps_skip_build
    - apps_image_source != 'quay'

- name: Start the ledger-api image build (REQ 038 trace propagation downstream)
  ansible.builtin.command:
