---
- name: Validate cluster access
  ansible.builtin.include_role:
    name: common
    tasks_from: assert_cluster_access.yml

- name: Query the CoreDNS provider Secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ coredns_dns_namespace }}"
    name: "{{ coredns_dns_secret_name }}"
  register: coredns_dns_secret
  changed_when: false

- name: Assert that the CoreDNS provider Secret exists
  ansible.builtin.assert:
    that:
      - coredns_dns_secret.resources | length == 1
      - coredns_dns_secret.resources[0].type == "kuadrant.io/coredns"
      - "'ZONES' in coredns_dns_secret.resources[0].data"
    fail_msg: >-
      CoreDNS provider Secret {{ coredns_dns_namespace }}/{{ coredns_dns_secret_name }}
      is missing, has the wrong type, or lacks the ZONES key.

- name: Query the external kuadrant-coredns Service
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    namespace: "{{ coredns_dns_source_namespace }}"
    name: "{{ coredns_dns_external_service_name }}"
  register: coredns_dns_service_status
  changed_when: false

- name: Assert that the external kuadrant-coredns Service is exposed
  ansible.builtin.assert:
    that:
      - coredns_dns_service_status.resources | length == 1
      - coredns_dns_service_status.resources[0].spec.type == coredns_dns_service_type
      - (coredns_dns_service_type != "LoadBalancer") or
        ((coredns_dns_service_status.resources[0].status.loadBalancer.ingress | default([])) | length > 0)
    fail_msg: >-
      External Service {{ coredns_dns_source_namespace }}/{{ coredns_dns_external_service_name }}
      is missing, has the wrong type, or its LoadBalancer endpoint is not provisioned.

- name: Query the kuadrant-coredns ConfigMap
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: "{{ coredns_dns_source_namespace }}"
    name: "{{ coredns_dns_source_configmap }}"
  register: coredns_dns_configmap_status
  changed_when: false

- name: Assert the target zone is configured in the Corefile
  ansible.builtin.assert:
    that:
      - coredns_dns_configmap_status.resources | length == 1
      - coredns_dns_zone in coredns_dns_configmap_status.resources[0].data.Corefile
    fail_msg: >-
      Corefile in {{ coredns_dns_source_namespace }}/{{ coredns_dns_source_configmap }}
      does not contain the target zone '{{ coredns_dns_zone }}'.

- name: Query the CoreDNS DNSPolicy
  kubernetes.core.k8s_info:
    api_version: kuadrant.io/v1
    kind: DNSPolicy
    namespace: "{{ coredns_dns_policy_target_gateway_namespace }}"
    name: "{{ coredns_dns_policy_name }}"
  register: coredns_dns_policy
  changed_when: false
  when: coredns_dns_policy_enabled

- name: Assert that the CoreDNS DNSPolicy exists
  ansible.builtin.assert:
    that:
      - coredns_dns_policy.resources | length == 1
    fail_msg: >-
      DNSPolicy {{ coredns_dns_policy_target_gateway_namespace }}/{{ coredns_dns_policy_name }}
      is missing.
  when: coredns_dns_policy_enabled

- name: Assert that the CoreDNS DNSPolicy is Accepted
  ansible.builtin.assert:
    that:
      - coredns_dns_policy.resources[0].status.conditions | default([])
        | selectattr('type', 'equalto', 'Accepted')
        | selectattr('status', 'equalto', 'True')
        | list | length == 1
    fail_msg: >-
      DNSPolicy {{ coredns_dns_policy_target_gateway_namespace }}/{{ coredns_dns_policy_name }}
      is not Accepted. Check the target Gateway exists and the provider Secret is valid.
  when: coredns_dns_policy_enabled

- name: Assert that the CoreDNS DNSPolicy is Enforced
  ansible.builtin.assert:
    that:
      - coredns_dns_policy.resources[0].status.conditions | default([])
        | selectattr('type', 'equalto', 'Enforced')
        | selectattr('status', 'equalto', 'True')
        | list | length == 1
    fail_msg: >-
      DNSPolicy {{ coredns_dns_policy_target_gateway_namespace }}/{{ coredns_dns_policy_name }}
      is Accepted but not Enforced. The target Gateway is likely not yet Programmed,
      or no HTTPRoute hostname falls within '{{ coredns_dns_zone }}'.
  when: coredns_dns_policy_enabled
