---
# Auto-discovery das credenciais AWS quando o usuário NÃO passa RHCL_DNS_AWS_*.
# Lê o Secret kube-system/aws-creds (criado pelo instalador do OCP IPI em AWS) e
# preenche rhcl_dns_aws_access_key_id / _secret_access_key / _region. Resultado:
# o role funciona "self-healing" em qualquer sandbox AWS novo, sem precisar
# re-fornecer credenciais.
#
# Quando NÃO usar (passe RHCL_DNS_AWS_* explícito):
#   - cluster não-IPI / sem aws-creds em kube-system
#   - credenciais de DNS são distintas das do instalador (boa prática em prod)

- name: Look up kube-system/aws-creds (OCP installer AWS credentials)
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: kube-system
    name: aws-creds
  register: letsencrypt_aws_installer_creds
  changed_when: false
  no_log: true

- name: Look up cluster AWS region (Infrastructure config)
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Infrastructure
    name: cluster
  register: letsencrypt_aws_infra
  changed_when: false

- name: Use installer credentials when present (RHCL_DNS_AWS_* não foi fornecido)
  ansible.builtin.set_fact:
    rhcl_dns_aws_access_key_id: >-
      {{ letsencrypt_aws_installer_creds.resources[0].data.aws_access_key_id | b64decode }}
    rhcl_dns_aws_secret_access_key: >-
      {{ letsencrypt_aws_installer_creds.resources[0].data.aws_secret_access_key | b64decode }}
    rhcl_dns_aws_region: >-
      {{ rhcl_dns_aws_region
         if (rhcl_dns_aws_region | length > 0)
         else (letsencrypt_aws_infra.resources[0].status.platformStatus.aws.region | default('us-east-1')) }}
  no_log: true
  when:
    - letsencrypt_aws_installer_creds.resources | length == 1
    - "'aws_access_key_id' in letsencrypt_aws_installer_creds.resources[0].data"
    - "'aws_secret_access_key' in letsencrypt_aws_installer_creds.resources[0].data"

- name: Report AWS discovery source (sem expor segredos)
  ansible.builtin.debug:
    msg: >-
      AWS DNS-01: usando credenciais do kube-system/aws-creds (region={{
        letsencrypt_aws_infra.resources[0].status.platformStatus.aws.region | default('us-east-1')
      }}). A zona Route53 será descoberta a partir do domínio do cluster.
  when:
    - letsencrypt_aws_installer_creds.resources | length == 1
