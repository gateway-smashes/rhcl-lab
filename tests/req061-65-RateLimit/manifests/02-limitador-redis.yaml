# Item 62/65 — Rate Limit global apontando o Limitador pro Redis compartilhado.
#
# Troca o storage do Limitador de in-memory para Redis. O endpoint usado é
# o Redis no namespace `shared-store` deste mesmo cluster (ver
# 06-redis-shared-store.yaml). Os contadores passam a viver no Redis em vez
# da memória do pod do Limitador — é o que torna o rate limit verdadeiramente
# "global" e habilita o cenário multi-site: outro cluster com seu próprio
# Limitador apontando pro MESMO Redis compartilha os mesmos contadores.
#
# Topologia neste cluster (single-cluster, mas pronta pra multi):
#   Envoy(gateway) → Limitador(kuadrant-system) → Redis(shared-store)
#
# Multi-site: cada cluster aponta o Limitador pro mesmo Redis (precisa de
# rota de rede entre clusters — VPC peering, ClusterIP exposto, etc).
#
# Pré-requisitos:
#   oc apply -f tests/req061-65-RateLimit/manifests/06-redis-shared-store.yaml
#   oc -n shared-store rollout status deploy/redis
#
# Como aplicar:
#   oc apply -f tests/req061-65-RateLimit/manifests/02-limitador-redis.yaml
#   oc -n kuadrant-system rollout status deploy/limitador-limitador
#   oc apply -f tests/req061-65-RateLimit/manifests/01-global-same-site.yaml
#
# Validar (contadores agora vivem no Redis):
#   HOST=$(oc get httproute banking-api-connectivity -n rhcl-apps -o jsonpath='{.spec.hostnames[0]}')
#   { for i in $(seq 1 60); do curl -sk -o /dev/null -w "%{http_code}\n" "https://$HOST/api/echo" & done; wait; } | sort | uniq -c
#   # Esperado com 01 (20/10s): 20x 200 + 40x 429 — igual ao in-memory, mas
#   # agora o estado está no Redis. Prove inspecionando as chaves:
#   POD=$(oc -n shared-store get pod -l app=redis -o jsonpath='{.items[0].metadata.name}')
#   oc -n shared-store exec $POD -- sh -c 'redis-cli -a "$REDIS_PASSWORD" --scan' | head
#
# Rollback (volta pra in-memory):
#   oc -n kuadrant-system patch limitador limitador --type=merge -p '{"spec":{"storage":null}}'
#   oc -n kuadrant-system delete secret limitador-redis --ignore-not-found
apiVersion: limitador.kuadrant.io/v1alpha1
kind: Limitador
metadata:
  name: limitador
  namespace: kuadrant-system
spec:
  # Storage shared via Redis — counters are global across every Limitador
  # that points at this same endpoint.
  #
  # `redis-cached` (abaixo) mantém um cache LOCAL de contadores em cada site e
  # sincroniza com o Redis em lote (flush-period). Ótimo p/ latência, MAS é
  # eventualmente consistente: em multi-site, um site com cache frio over-admite
  # antes de enxergar o consumo dos outros. Pra limite global ESTRITO entre
  # clusters, troque o bloco abaixo por `redis` puro (toda checagem bate no
  # Redis) — ver README, seção "redis vs redis-cached":
  #   storage:
  #     redis:
  #       configSecretRef:
  #         name: limitador-redis
  storage:
    redis-cached:
      configSecretRef:
        name: limitador-redis
      options:
        # Tune for the demo — production values typically larger.
        batch-size: 100
        flush-period: 1000      # ms — frequência com que o cache local sincroniza com o Redis
        max-cached: 5000
        response-timeout: 350   # ms — timeout do call ao Redis antes de fallback ao cache local
---
# URL aponta pro Redis no namespace shared-store (06-redis-shared-store.yaml).
# Sem TLS (redis://) porque o tráfego é intra-cluster. Senha = redis-auth.
apiVersion: v1
kind: Secret
metadata:
  name: limitador-redis
  namespace: kuadrant-system
  labels:
    app.kubernetes.io/part-of: rhcl-req61-65-ratelimit
    rhcl.poc/item: "62"
type: Opaque
stringData:
  URL: "redis://default:rhcl-redis-demo@redis.shared-store.svc.cluster.local:6379/0"
