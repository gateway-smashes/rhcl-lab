# Item 61 — Rate Limit global, todas as instâncias do Gateway no mesmo site.
#
# Como funciona:
#   • RateLimitPolicy → traduzido pelo Kuadrant Operator em entradas no
#     Limitador CR e config de rate-limit no Envoy do Gateway.
#   • Envoy (em qualquer replica do Gateway) consulta o serviço Limitador
#     via gRPC. Como existe UM cluster ClusterIP único de Limitador, todas
#     as instâncias compartilham os mesmos contadores.
#
# Default do lab: Limitador com storage in-memory + 1 replica → o "global"
# desta policy abrange efetivamente o site inteiro.
#
# Como aplicar:
#   oc apply -f tests/req061-65-RateLimit/manifests/01-global-same-site.yaml
#
# Validar:
#   HOST=$(oc get httproute banking-api-connectivity -n rhcl-apps \
#          -o jsonpath='{.spec.hostnames[0]}')
#   for i in $(seq 1 25); do
#     curl -sk -o /dev/null -w "%{http_code}\n" "https://$HOST/api/echo"
#   done | sort | uniq -c
#   # Esperado: ~20x 200 + ~5x 429
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: req061-global-same-site
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req61-65-ratelimit
    rhcl.poc/item: "61"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: banking-api-connectivity
  limits:
    global-burst:
      rates:
        - limit: 20
          window: 10s
