# Item 64 — Rate Limit a nível de API e/ou de Gateway, simultaneamente.
#
# Cenário: o operador da plataforma quer um TETO ABSOLUTO no Gateway
# (anti-DDoS, proteção da infra) E o time da API quer limites finos por
# rota. As duas policies coexistem; a granularidade composta é:
#
#                      ┌──────────────┐
#                      │   Gateway    │  RLP (overrides) — teto
#                      │              │  Ex: 200/min global
#                      └──────┬───────┘
#                             │
#                  ┌──────────┼──────────┐
#                  │                     │
#            ┌─────▼────┐          ┌─────▼────┐
#            │ HTTPRoute│          │ HTTPRoute│
#            │  bank-api│          │  outra   │   RLP (defaults)
#            │ /api/v1  │          │ /api/x   │   Ex: 50/min por API
#            └──────────┘          └──────────┘
#
# Semântica do Gateway API para policies de mesma classe:
#   - `defaults`  no policy do Gateway: aplicado a routes que NÃO têm
#                  policy própria. API-level sobrescreve.
#   - `overrides` no policy do Gateway: NÃO pode ser sobrescrito por
#                  API-level. Implementa "teto absoluto".
#
# Quando ambas existem, o Kuadrant compõe: a request precisa passar
# em AMBOS os limites (o mais restritivo prevalece naturalmente).
#
# Como aplicar (apenas o gateway-level — o API-level já aplicado em
# 01-global-same-site.yaml):
#   oc apply -f tests/req061-65-RateLimit/manifests/04-api-vs-gateway.yaml
#   # Aplique também 01 ou 03 para ter o API-level coexistindo.
#
# Validar:
#   HOST=$(oc get httproute banking-api-connectivity -n rhcl-apps \
#          -o jsonpath='{.spec.hostnames[0]}')
#   for i in $(seq 1 60); do
#     curl -sk -o /dev/null -w "%{http_code}\n" "https://$HOST/api/echo"
#   done | sort | uniq -c
#   # Esperado: 50 → 200 (limite api-level se for 01-global=50/window),
#   # depois 429 até a janela do gateway resetar.
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: req064-gateway-ceiling
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: rhcl-req61-65-ratelimit
    rhcl.poc/item: "64"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: rhcl-apps-gateway
  # `defaults` — pode ser sobrescrito pela RLP do HTTPRoute. Útil pra
  # propor limite "padrão" que cada API pode ajustar pra cima ou pra baixo.
  defaults:
    limits:
      gateway-default:
        rates:
          - limit: 100
            window: 1m
  # Para um teto absoluto que NINGUÉM no nível de API consegue
  # sobrescrever, troque `defaults:` por `overrides:`:
  #
  # overrides:
  #   limits:
  #     gateway-ceiling:
  #       rates:
  #         - limit: 200
  #           window: 1m
