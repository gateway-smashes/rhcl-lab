apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: connectivity-link-api-developer
  labels:
    kuadrant.io/role: api-developer
    app.kubernetes.io/part-of: connectivity-link-rbac
rules:
# HTTPRoutes - Full CRUD for routing configuration
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes/status"]
  verbs: ["get"]
# Gateways - Read-only for parentRef in HTTPRoutes
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways/status"]
  verbs: ["get"]
