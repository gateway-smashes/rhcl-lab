apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: connectivity-link-api-product-admin
  labels:
    kuadrant.io/role: api-product-admin
    app.kubernetes.io/part-of: connectivity-link-rbac
rules:
# Kuadrant Application Policies - Auth and Rate Limiting
- apiGroups: ["kuadrant.io"]
  resources: ["authpolicies", "ratelimitpolicies", "tokenratelimitpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["kuadrant.io"]
  resources: ["authpolicies/status", "ratelimitpolicies/status", "tokenratelimitpolicies/status"]
  verbs: ["get"]
# Kuadrant Extensions - Plan-based rate limiting
- apiGroups: ["extensions.kuadrant.io"]
  resources: ["planpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["extensions.kuadrant.io"]
  resources: ["planpolicies/status"]
  verbs: ["get"]
# Developer Portal - API Products and Keys
- apiGroups: ["devportal.kuadrant.io"]
  resources: ["apiproducts", "apikeys"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["devportal.kuadrant.io"]
  resources: ["apiproducts/status", "apikeys/status"]
  verbs: ["get", "update"]
# Gateway API - Read-only for policy targeting (targetRef)
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes", "gateways"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes/status", "gateways/status"]
  verbs: ["get"]
