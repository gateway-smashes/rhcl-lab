# OPTIONAL — enables the console plugin's in-console MCP "try it" playground.
#
# The MCP gateway serves plain HTTP, but the OpenShift console dynamic-plugin
# proxy requires the target Service to serve HTTPS. This puts a tiny nginx TLS
# terminator ("mcp-broker-tls") in front of it, using an OpenShift serving
# certificate, and forwards — WITH the mcp listener Host header — to the Istio
# gateway (so the MCP Router forwards tools/call), streaming (SSE) unbuffered.
#
# Targets the Ansible-role install (the mcp_gateway role): the gateway compat
# Service is `rhcl-mcp-gateway-istio` in `mcp-gateway`, and the TLS front lives
# in `mcp-system` — the namespace/name the ConsolePlugin `mcp-broker` proxy
# alias points at (custom_console role). The mcp_gateway role now renders and
# applies this automatically (broker-tls-front.yml.j2); this manifest is the
# hand-apply equivalent.
#
# Set the Host header to your gateway's `mcp` listener hostname before applying:
#   export APPS_DOMAIN="$(oc get ingresses.config cluster -o jsonpath='{.spec.domain}')"
#   export MCP_PUBLIC_HOST="mcp-gateway.${APPS_DOMAIN}"
#   envsubst < 50-broker-tls-proxy.yaml | oc apply -f -
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-broker-tls-nginx
  namespace: mcp-system
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      client_body_temp_path /tmp/cb; proxy_temp_path /tmp/px;
      fastcgi_temp_path /tmp/fc; uwsgi_temp_path /tmp/uw; scgi_temp_path /tmp/sc;
      server {
        listen 8443 ssl;
        ssl_certificate     /etc/tls/tls.crt;
        ssl_certificate_key /etc/tls/tls.key;
        location / {
          # Route through the MCP GATEWAY (Istio gateway + MCP Router ext_proc),
          # NOT the broker Service directly. The router forwards tools/call to
          # the backend server; the broker alone only aggregates tools/list and
          # answers tools/call with "broker doesn't forward tool calls".
          proxy_pass http://rhcl-mcp-gateway-istio.mcp-gateway.svc.cluster.local:8080;
          # Must match the gateway's "mcp" listener hostname.
          proxy_set_header Host ${MCP_PUBLIC_HOST};
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_buffering off;
          proxy_read_timeout 3600s;
          chunked_transfer_encoding on;
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-broker-tls
  namespace: mcp-system
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: mcp-broker-tls-cert
  labels:
    app: mcp-broker-tls
spec:
  selector:
    app: mcp-broker-tls
  ports:
    - name: https
      port: 8443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-broker-tls
  namespace: mcp-system
  labels:
    app: mcp-broker-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-broker-tls
  template:
    metadata:
      labels:
        app: mcp-broker-tls
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:stable-alpine
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tls
              mountPath: /etc/tls
              readOnly: true
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
      volumes:
        - name: nginx-conf
          configMap:
            name: mcp-broker-tls-nginx
        - name: tls
          secret:
            secretName: mcp-broker-tls-cert
