# req018 — ServiceMonitor: raspa /q/metrics do banking-api pro UWM.
#
# Sem esse manifest, `bank_ai_tokens_total` fica preso no pod — o
# Prometheus do User Workload Monitoring não descobre targets no
# namespace `rhcl-apps` por padrão.
#
# Pré-requisito: UWM habilitado no cluster. Verifique com:
#   oc -n openshift-monitoring get cm cluster-monitoring-config -o yaml \
#     | grep enableUserWorkload
# Deve retornar `enableUserWorkload: true`. Se não, editar o ConfigMap
# `cluster-monitoring-config` no namespace `openshift-monitoring` e
# adicionar (é config cluster-wide — pode precisar de admin do cluster):
#
#   data:
#     config.yaml: |
#       enableUserWorkload: true
#
# Não patchamos isso automaticamente por segurança (é config do
# operador de monitoramento do OpenShift, não do RHCL).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: banking-api
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-banking-poc
    rhcl.poc/req: req018
spec:
  # Selector cobre v1 e v2 do backend — as duas Services expõem /q/metrics
  # no port `http`.
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - banking-api-v1
          - banking-api-v2
  endpoints:
    - port: http
      path: /q/metrics
      # 30s é o mínimo prático — abaixo disso o UWM começa a dropar
      # samples em bursts. Se precisar de resolução mais fina, ajustar
      # também o scrape_interval do Prometheus UWM.
      interval: 30s
