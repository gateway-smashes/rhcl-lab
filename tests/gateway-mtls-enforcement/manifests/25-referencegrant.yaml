# ReferenceGrant allowing HTTPRoutes in req051-gateway namespace to target
# Services in rhcl-apps (where banking-api-v1 lives).
#
# This resource must be created in the TARGET namespace (rhcl-apps).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: req051-mtls-to-backend
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req051-mtls
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: req051-gateway
  to:
    - group: ""
      kind: Service
