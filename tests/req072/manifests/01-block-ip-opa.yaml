# Item 72 — IP-based ACL — Block a single source IP (OPA/Rego).
#
# Deny-list mode. The AuthPolicy targets the `ipfilter` HTTPRoute (the
# ipfilter-php probe). Authorino evaluates the inline Rego on every request:
#   • Read the raw `x-forwarded-for` header (empty string if absent).
#   • `allow` is true ONLY when the blocked IP is NOT present in XFF.
#   • When the blocked IP appears, `allow` stays undefined -> Authorino denies
#     (HTTP 403). This is default-deny-on-undefined, so no `default allow`
#     declaration is needed.
#
# This is the exact engine validated in the lab (single literal IP match via
# `contains`). For CIDR ranges use 02-block-range-opa.yaml.
#
# Naming / coexistence:
#   metadata.name = ipfilter-block-xff. This is a SEPARATE policy from the
#   playbook default `ipfilter-ip-acl`. Only one AuthPolicy can be Enforced per
#   target, so delete (or disable) the playbook policy before applying this one
#   to avoid a two-policies-one-target conflict:
#     oc -n rhcl-apps delete authpolicy ipfilter-ip-acl --ignore-not-found
#   (or run apps-install with APPS_IPFILTER_AUTH_POLICY_ENABLED=false).
#
# Apply:
#   oc apply -f tests/req072/manifests/01-block-ip-opa.yaml
#   oc -n rhcl-apps wait authpolicy/ipfilter-block-xff \
#     --for=condition=Enforced=True --timeout=120s
#
# Validate (curl — the proven path):
#   # Blocked IP -> expect 403
#   curl -k -i -H "X-Forwarded-For: 203.0.113.10" \
#     https://ipfilter.azuredns.rhcl.com.br/
#   # Any other IP -> expect 200
#   curl -k -i -H "X-Forwarded-For: 8.8.8.8" \
#     https://ipfilter.azuredns.rhcl.com.br/
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: ipfilter-block-xff
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-ipfilter-poc
    rhcl.poc/item: "72"
    rhcl.poc/mode: deny-list
    rhcl.poc/engine: opa
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: ipfilter
  rules:
    authorization:
      block-xff:
        opa:
          rego: |
            xff := object.get(input.context.request.http.headers, "x-forwarded-for", "")

            allow {
              not contains(xff, "203.0.113.10")
            }
