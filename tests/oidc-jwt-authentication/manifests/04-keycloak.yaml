# Permanent bootstrap admin (admin/redhat) instead of the temp-admin + random
# operator-generated password. The Secret must exist BEFORE the CR (only applies on
# the initial creation of the instance).
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-bootstrap-admin
  namespace: keycloak
  labels: { app.kubernetes.io/part-of: rhcl-req71-oidc-jwt }
type: Opaque
stringData:
  username: admin
  password: redhat
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: rhcl
  namespace: keycloak
  labels: { app.kubernetes.io/part-of: rhcl-req71-oidc-jwt }
spec:
  instances: 1
  bootstrapAdmin:
    user:
      secret: keycloak-bootstrap-admin
  db:
    vendor: postgres
    host: postgres
    port: 5432
    database: keycloak
    usernameSecret: { name: keycloak-db-secret, key: username }
    passwordSecret: { name: keycloak-db-secret, key: password }
  hostname:
    # Full external URL — becomes the OIDC issuer base (https://.../realms/<realm>).
    hostname: https://keycloak.example.com
  http:
    # LE cert (cert-manager). Keycloak serves HTTPS with it; the operator's Route
    # is passthrough, so Authorino sees this trusted cert directly.
    tlsSecret: keycloak-tls
  ingress:
    enabled: true
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "1", memory: 1700Mi }
