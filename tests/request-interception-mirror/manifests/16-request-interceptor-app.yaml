# Request interceptor — pre-built image from Docker Hub.
# Source: https://github.com/dsferreira54/request-interceptor
---
apiVersion: v1
kind: Service
metadata:
  name: request-interceptor
  namespace: req030-apps
  labels:
    app: request-interceptor
    app.kubernetes.io/part-of: rhcl-req030-interceptor
    rhcl-lab/requirement: req030
spec:
  selector:
    app: request-interceptor
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-interceptor
  namespace: req030-apps
  labels:
    app: request-interceptor
    app.kubernetes.io/part-of: rhcl-req030-interceptor
    rhcl-lab/requirement: req030
spec:
  replicas: 1
  selector:
    matchLabels:
      app: request-interceptor
  template:
    metadata:
      labels:
        app: request-interceptor
    spec:
      containers:
        - name: request-interceptor
          image: docker.io/dsferreira54/request-interceptor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LOG_SENSITIVE_HEADERS
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
