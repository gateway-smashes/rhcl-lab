# Gateway with TWO HTTPS listeners for OCSP/CRL revocation testing.
#
# Uses GatewayClass "openshift-default" (backed by Istio in OSSM 3.x).
# Client-cert enforcement AND revocation controls are handled by EnvoyFilter
# (deploy-envoyfilter.sh), NOT by frontendValidation — the native Gateway API
# field only validates against a CA bundle and exposes neither `crl` nor
# `ocsp_staple`. See README "Technical notes".
#
#   1. https-crl (CRL): mTLS + client-cert revocation check via CRL.
#      A revoked client cert is rejected during the handshake.
#
#   2. https-ocsp (OCSP stapling): mTLS + the gateway staples the OCSP
#      response of its OWN server certificate into the handshake.
#
# Prerequisites:
#   - Secret/req050-server-tls (kubernetes.io/tls) with the server cert + key
#
# Usage:
#   export RHCL_ZONE_ROOT_DOMAIN=example.com
#   envsubst < tests/mtls-ocsp-crl-revocation/manifests/10-gateway.yaml | oc apply -f -
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: req050-revocation-gateway
  namespace: req050-gateway
  labels:
    app.kubernetes.io/part-of: rhcl-req050-revocation
    rhcl-lab/requirement: req050-ocsp-crl
    istio.io/rev: openshift-gateway
  annotations:
    networking.istio.io/service-type: LoadBalancer
spec:
  gatewayClassName: openshift-default
  listeners:
    # ---------------------------------------------------------------
    # Listener 1: CRL revocation (mTLS + validation_context.crl)
    # Enforcement applied by EnvoyFilter (deploy-envoyfilter.sh)
    # ---------------------------------------------------------------
    - name: https-crl
      port: 443
      protocol: HTTPS
      hostname: "req050-crl.${RHCL_ZONE_ROOT_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: req050-server-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All

    # ---------------------------------------------------------------
    # Listener 2: OCSP stapling (mTLS + tls_certificate.ocsp_staple)
    # Enforcement applied by EnvoyFilter (deploy-envoyfilter.sh)
    # ---------------------------------------------------------------
    - name: https-ocsp
      port: 443
      protocol: HTTPS
      hostname: "req050-ocsp.${RHCL_ZONE_ROOT_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: req050-server-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
