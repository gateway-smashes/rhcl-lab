# MCPServer CRs for the MCP Lifecycle Operator (OpenShift AI catalog deploy flow).
# Requires CRD mcp.x-k8s.io/v1alpha1 MCPServer on the cluster.
#
#   export MCP_QUAY_REPO=quay.io/rh_ee_tavelino/mcp
#   export MCP_IMAGE_TAG=latest
#   envsubst < 40-mcpservers.yaml | oc apply -f -
apiVersion: mcp.x-k8s.io/v1alpha1
kind: MCPServer
metadata:
  name: rhcl-lab-info
  namespace: rhcl-mcp-lab
  labels:
    rhcl-lab/requirement: req017-mcp-catalog
spec:
  source:
    type: ContainerImage
    containerImage:
      ref: ${MCP_QUAY_REPO}:rhcl-lab-info-mcp-${MCP_IMAGE_TAG}
  config:
    port: 8080
    path: /mcp
  runtime:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    security:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
---
