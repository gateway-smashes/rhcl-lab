# Custom policy expressions (CEL).
#
# INTEGRATED APPROACH: this AuthPolicy REPLACES (in-place update) the
# existing API Key policy (`banking-api-connectivity-apikey`), adding
# AUTHORIZATION rules with CEL expressions without changing the authentication rules.
#
# Pipeline Authorino:
#   Request → Authentication (API Key / anonymous) → Authorization (CEL) → Response
#
# What this policy demonstrates:
#
#   AUTHENTICATION (unchanged — compatible with PlanPolicy and other tests):
#     • cors-preflight    — OPTIONS free
#     • public-echo       — /api/echo and /api/lb-test free
#     • public-ws         — /ws free (WebSocket)
#     • ai-mock           — /api/v1/chat/completions and /api/v1/models free
#     • api-key-header    — other paths require API Key via header
#     • api-key-query     — other paths require API Key via query string
#
#   AUTHORIZATION (NEW — demonstrates CEL):
#     • cel-transfer-idempotency — POST /api/v1/transfers requires
#                                  x-idempotency-key (only when
#                                  the x-cel-strict: true header is present,
#                                  so existing tests are not affected)
#     • cel-bot-blocking         — Blocks any request whose
#                                  user-agent contains 'bot' on paths
#                                  protected by API Key
#
#   RESPONSE (unchanged + diagnostic headers):
#     • Keeps userid and plan-id for PlanPolicy
#     • Adds an x-rhcl-policy-item header on deny responses
#
# Funcionalidades CEL exercitadas:
#     • Logical operators: && , || , !
#     • String functions: startsWith(), contains()
#     • Direct header comparison: request.headers['x'] == 'value'
#     • Combining method + path + headers
#
# IMPACT ON OTHER TESTS:
#   • None — authentication unchanged, PlanPolicy keeps working.
#   • cel-transfer-idempotency ONLY applies when x-cel-strict: true is present.
#   • cel-bot-blocking ONLY blocks if user-agent contains 'bot' (no
#     existing test uses 'bot' as its user-agent).
#
# How to apply (in-place update of the existing policy):
#   oc apply --server-side --force-conflicts -f tests/custom-policy-expressions-cel/manifests/01-cel-custom-expressions.yaml
#
# How to revert to the original state:
#   cd automation
#   ansible-playbook playbooks/apps-install.yml --tags connectivity
#
# Validate CEL — see README.md for the full walkthrough.
#
#   HOST=$(oc get httproute banking-api-connectivity -n rhcl-apps \
#          -o jsonpath='{.spec.hostnames[0]}')
#
#   # Test CEL bot-blocking: user-agent with 'bot' → 403
#   curl -sk -o /dev/null -w "%{http_code}\n" \
#     -H "api-key: <KEY>" -H "user-agent: scraperbot/1.0" \
#     "https://$HOST/api/v1/accounts/summary"
#   # Esperado: 403
#
#   # Test CEL idempotency (strict mode): no header → 403
#   curl -sk -o /dev/null -w "%{http_code}\n" \
#     -X POST "https://$HOST/api/v1/transfers" \
#     -H "api-key: <KEY>" -H "x-cel-strict: true" \
#     -H "content-type: application/json" \
#     -d '{"fromBank":"BB","toBank":"EXT","amount":100}'
#   # Esperado: 403
#
#   # Test CEL idempotency (strict mode): with header → 200
#   curl -sk -o /dev/null -w "%{http_code}\n" \
#     -X POST "https://$HOST/api/v1/transfers" \
#     -H "api-key: <KEY>" -H "x-cel-strict: true" \
#     -H "x-idempotency-key: txn-123" \
#     -H "content-type: application/json" \
#     -d '{"fromBank":"BB","toBank":"EXT","amount":100}'
#   # Esperado: 200
#
#   # Test without x-cel-strict (normal behavior preserved): → 200
#   curl -sk -o /dev/null -w "%{http_code}\n" \
#     -X POST "https://$HOST/api/v1/transfers" \
#     -H "api-key: <KEY>" \
#     -H "content-type: application/json" \
#     -d '{"fromBank":"BB","toBank":"EXT","amount":100}'
#   # Expected: 200 (idempotency check NOT triggered)
#
# IMPORTANT LIMITATIONS — Authorino:
#
#   1) CEL has() — does NOT support map-index access:
#      has(request.headers['x-foo'])  → ERRO: invalid argument to has() macro
#      Use direct header access (empty value = absent):
#        request.headers['x-foo'] == 'value'  → false if the header is absent
#        request.headers['x-foo'].contains('x') → false if the header is absent
#
#   2) Rego default allow — Authorino injects it automatically:
#      Do NOT declare `default allow := false`, nor `package`/`import`, in the Rego.
#      Use only the rule: `allow { conditions }`
#      Syntax: classic Rego v0 (no `if`; `allow if {}` requires an import).
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: banking-api-connectivity-apikey
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-banking-poc
    rhcl.poc/item: "19"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: banking-api-connectivity

  rules:
    # ─── AUTHENTICATION (inalterado) ─────────────────────────────────────
    authentication:
      cors-preflight:
        when:
          - predicate: "request.method == 'OPTIONS'"
        anonymous: {}
      public-echo:
        when:
          - predicate: "request.path.startsWith('/api/echo') || request.path.startsWith('/api/lb-test')"
        anonymous: {}
      public-ws:
        when:
          - predicate: "request.path.startsWith('/ws')"
        anonymous: {}
      ai-mock:
        when:
          - predicate: "request.path.startsWith('/api/v1/models') || request.path.startsWith('/api/v1/chat/completions') || request.path.startsWith('/api/v1/completions') || request.path.startsWith('/api/v1/embeddings') || request.path.startsWith('/api/v1/responses')"
        anonymous: {}
      api-key-header:
        when:
          - predicate: "request.method != 'OPTIONS'"
          - predicate: "!request.path.startsWith('/api/echo') && !request.path.startsWith('/api/lb-test') && !request.path.startsWith('/ws') && !request.path.startsWith('/api/v1/models') && !request.path.startsWith('/api/v1/chat/completions') && !request.path.startsWith('/api/v1/completions') && !request.path.startsWith('/api/v1/embeddings') && !request.path.startsWith('/api/v1/responses')"
        apiKey:
          allNamespaces: true
          selector:
            matchLabels:
              authorino.kuadrant.io/managed-by: authorino
              app: banking-api-apikey
        credentials:
          customHeader:
            name: api-key
      api-key-query:
        when:
          - predicate: "request.method != 'OPTIONS'"
          - predicate: "!request.path.startsWith('/api/echo') && !request.path.startsWith('/api/lb-test') && !request.path.startsWith('/ws') && !request.path.startsWith('/api/v1/models') && !request.path.startsWith('/api/v1/chat/completions') && !request.path.startsWith('/api/v1/completions') && !request.path.startsWith('/api/v1/embeddings') && !request.path.startsWith('/api/v1/responses')"
        apiKey:
          allNamespaces: true
          selector:
            matchLabels:
              authorino.kuadrant.io/managed-by: authorino
              app: banking-api-apikey
        credentials:
          queryString:
            name: api-key

    # ─── AUTHORIZATION (NOVO — demonstra CEL) ────────────────────────────
    authorization:
      # CEL rule 1: transfers require an idempotency header.
      # ACTIVATED ONLY when x-cel-strict: true is present, so as not to
      # impactar fluxos existentes.
      #
      # CEL expressions demonstrated:
      #   • request.method == 'POST'
      #   • request.path.startsWith('/api/v1/transfers')
      #   • request.headers['x-cel-strict'] == 'true' (implicit presence)
      #
      # NOTE: has() does not support map-index access in Authorino.
      #   Use direct header access: empty value = header absent.
      cel-transfer-idempotency:
        when:
          - predicate: "request.method == 'POST' && request.path.startsWith('/api/v1/transfers')"
          - predicate: "request.headers['x-cel-strict'] == 'true'"
        opa:
          rego: |
            allow {
              key := input.context.request.http.headers["x-idempotency-key"]
              key != ""
            }

      # CEL rule 2: Block requests with a user-agent containing 'bot'.
      # Applies only to protected paths (that passed API Key auth).
      #
      # CEL expressions demonstrated:
      #   • request.headers['user-agent'].contains('bot')
      #   • ! (negation)
      #   • Logical combination with &&
      #
      # NOTE: has() does not support map-index access in Authorino.
      #   If user-agent is absent, it returns "" and contains('bot') = false
      #   (rule not active = safe).
      cel-bot-blocking:
        when:
          - predicate: "request.headers['user-agent'].contains('bot')"
          - predicate: "request.method != 'OPTIONS'"
          - predicate: "!request.path.startsWith('/api/echo') && !request.path.startsWith('/api/lb-test')"
        opa:
          rego: |
            allow = false

    # ─── RESPONSE (inalterado + deny headers) ────────────────────────────
    response:
      success:
        filters:
          identity:
            json:
              properties:
                userid:
                  selector: auth.identity.metadata.annotations.secret\.kuadrant\.io/user-id
                plan-id:
                  selector: auth.identity.metadata.annotations.secret\.kuadrant\.io/plan-id
      unauthorized:
        code: 403
        message:
          value: "Forbidden: CEL expression policy denied this request (item 19)"
        headers:
          "x-rhcl-policy":
            value: "cel-custom-expressions"
          "x-rhcl-policy-item":
            value: "19"
