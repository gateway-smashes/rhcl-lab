# REQ 027 — Expose the external A2A agent through the RHCL gateway.
#
# Publishes the external agent under a cluster-owned hostname
# (a2a.${RHCL_ZONE_ROOT_DOMAIN}) and forwards A2A JSON-RPC / SSE calls to the
# external host registered by the ServiceEntry (00-) with TLS origination from
# the DestinationRule (10-).
#
# NOTE (see README "Does the plan work?"): routing a Gateway API HTTPRoute
# backendRef to an external hostname depends on the Istio/RHCL version's support
# for ServiceEntry-backed backendRefs. If your version does not resolve the
# external host as a backendRef, use the VirtualService alternative in
# 21-virtualservice-a2a-alternative.yaml instead.
#
# Apply:
#   export RHCL_ZONE_ROOT_DOMAIN=apps.example.com
#   export A2A_AGENT_HOST=my-agent.example.azurewebsites.net
#   envsubst < tests/agent2agent-a2a-routing/manifests/20-httproute-a2a.yaml | oc apply -f -
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: a2a-external-agent
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-a2a-poc
    rhcl.poc/item: "27"
spec:
  parentRefs:
    - name: rhcl-apps-gateway
      namespace: openshift-ingress
  hostnames:
    - "a2a.${RHCL_ZONE_ROOT_DOMAIN}"
  rules:
    # Agent Card discovery + JSON-RPC + SSE all share the same upstream host.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: "${A2A_AGENT_HOST}"
          port: 443
