# REQ 027 — Register the external A2A agent endpoint as a mesh-external service.
#
# A2A is JSON-RPC 2.0 over HTTPS. This ServiceEntry lets the Istio data plane
# (RHCL) reach the external agent host (e.g. a Microsoft Copilot Studio /
# Azure AI Foundry agent) for egress, without the mesh interpreting A2A.
#
# Apply:
#   export A2A_AGENT_HOST=my-agent.example.azurewebsites.net   # external A2A host
#   envsubst < tests/agent2agent-a2a-routing/manifests/00-serviceentry-a2a-agent.yaml | oc apply -f -
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: a2a-external-agent
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-a2a-poc
    rhcl.poc/item: "27"
spec:
  hosts:
    - "${A2A_AGENT_HOST}"
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - number: 443
      name: https
      protocol: HTTPS
    # The mesh terminates client TLS at the gateway and originates a fresh
    # TLS 1.2/1.3 connection upstream (see DestinationRule). Internally the
    # route targets port 443 on the external host.
