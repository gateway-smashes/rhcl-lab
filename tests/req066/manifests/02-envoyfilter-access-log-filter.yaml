# EnvoyFilter — access log JSON com filtro de health checks
#
# OPCIONAL: Aplique este EnvoyFilter NO LUGAR do 01-envoyfilter-access-log-json.yaml
# se quiser reduzir o volume de logs excluindo health checks.
#
# Usa not_health_check_filter para excluir requests marcadas como health
# check pelo Envoy, que não são relevantes para auditoria de chamadas de API.
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: access-log-filter
  namespace: openshift-ingress
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: rhcl-apps-gateway
  configPatches:
    - applyTo: NETWORK_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            access_log:
              - name: envoy.access_loggers.stdout
                filter:
                  not_health_check_filter: {}
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                  log_format:
                    json_format:
                      timestamp: "%START_TIME%"
                      method: "%REQ(:METHOD)%"
                      path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                      protocol: "%PROTOCOL%"
                      response_code: "%RESPONSE_CODE%"
                      response_flags: "%RESPONSE_FLAGS%"
                      bytes_received: "%BYTES_RECEIVED%"
                      bytes_sent: "%BYTES_SENT%"
                      duration_ms: "%DURATION%"
                      client_ip: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                      request_id: "%REQ(X-REQUEST-ID)%"
                      authority: "%REQ(:AUTHORITY)%"
                      upstream_host: "%UPSTREAM_HOST%"
                      upstream_cluster: "%UPSTREAM_CLUSTER%"
                      route_name: "%ROUTE_NAME%"
                      traceparent: "%REQ(TRACEPARENT)%"
                      downstream_tls_version: "%DOWNSTREAM_TLS_VERSION%"
                      downstream_tls_cipher: "%DOWNSTREAM_TLS_CIPHER%"
                      consumer_id: "%REQ(X-CONSUMER-ID)%"
                      auth_reason: "%RESP(X-EXT-AUTH-REASON)%"
                      flow_trace_id: "%REQ(X-FLOW-TRACE-ID)%"
