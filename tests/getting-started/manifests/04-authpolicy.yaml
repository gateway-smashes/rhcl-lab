# Getting started — Step 4/6: AuthPolicy
#
# Applies API-key authentication to the banking-lite HTTPRoute. Without this
# policy, the API is OPEN — any request on the path reaches the
# backend. Once applied, Authorino intercepts each request and
# requires the `api-key: <value>` header; without the header (or with an
# unknown value) → 401.
#
# selector.matchLabels: Authorino discovers the valid keys
# by looking for Secrets with this pair of labels in any namespace
# (`allNamespaces: true` further below). This decouples "who creates the
# key" (product owner, dev portal) from "where the policy is
# declared".
#
# response.success.filters.plan-id: propagates the consumer's tier to the
# request as the `x-consumer-plan` header. It is how the PlanPolicy in
# step 3 knows which limit to apply (matches the CEL predicate).
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: banking-lite-apikey
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-getting-started
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: banking-lite
  rules:
    authentication:
      # OPTIONS (CORS preflight) must pass anonymously — otherwise the
      # mobile-bank browser cannot even send the real request.
      cors-preflight:
        when:
          - predicate: "request.method == 'OPTIONS'"
        anonymous: {}
      # The main rule: accepts the key via the `api-key` header.
      api-key-header:
        when:
          - predicate: "request.method != 'OPTIONS'"
        apiKey:
          allNamespaces: true
          selector:
            matchLabels:
              authorino.kuadrant.io/managed-by: authorino
              app: banking-lite-apikey
        credentials:
          customHeader:
            name: api-key
    # Propagates metadata to the request flow — the consumer-id becomes a
    # header for Prometheus to label metrics per consumer, and the plan-id
    # becomes the "trigger" the PlanPolicy uses to pick the rate limit.
    response:
      success:
        filters:
          consumer-id:
            plain:
              value:
                selector: auth.identity.metadata.name
          plan-id:
            plain:
              value:
                selector: auth.identity.metadata.annotations.secret\.kuadrant\.io/plan-id
