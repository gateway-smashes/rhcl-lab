# Getting started — Passo 4/6: AuthPolicy
#
# Applies API-key authentication to the banking-lite HTTPRoute. Without this
# policy, a API fica ABERTA — qualquer request no path chega no
# backend. Depois de aplicar, o Authorino intercepta cada request e
# exige o header `api-key: <valor>`; sem o header (ou com valor
# desconhecido) → 401.
#
# selector.matchLabels: Authorino discovers the valid keys
# procurando Secrets com esse par de labels em qualquer namespace
# (`allNamespaces: true` mais abaixo). Isso desacopla "quem cria a
# key" (product owner, dev portal) from "where the policy is
# declarada".
#
# response.success.filters.plan-id: propaga o tier do consumer pro
# request como o header `x-consumer-plan`. É como a PlanPolicy do
# step 3 knows which limit to apply (matches the CEL predicate).
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: banking-lite-apikey
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-getting-started
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: banking-lite
  rules:
    authentication:
      # OPTIONS (CORS preflight) must pass anonymously — otherwise the
      # browser da mobile-bank nem consegue mandar a request real.
      cors-preflight:
        when:
          - predicate: "request.method == 'OPTIONS'"
        anonymous: {}
      # A regra principal: aceita chave via header `api-key`.
      api-key-header:
        when:
          - predicate: "request.method != 'OPTIONS'"
        apiKey:
          allNamespaces: true
          selector:
            matchLabels:
              authorino.kuadrant.io/managed-by: authorino
              app: banking-lite-apikey
        credentials:
          customHeader:
            name: api-key
    # Propaga metadados pra fluxo do request — o consumer-id vira
    # header for Prometheus to label metrics per consumer, and the plan-id
    # vira o "gatilho" que a PlanPolicy usa pra escolher rate limit.
    response:
      success:
        filters:
          consumer-id:
            plain:
              value:
                selector: auth.identity.metadata.name
          plan-id:
            plain:
              value:
                selector: auth.identity.metadata.annotations.secret\.kuadrant\.io/plan-id
