# Getting started — Passo 3/6: PlanPolicy
#
# Define os "tiers" (planos) que a API oferece — a estrutura comercial
# que o dev portal apresenta na hora de subscribe. Cada tier tem seu
# own rate limit, and Kuadrant picks which to apply by looking at the
# `secret.kuadrant.io/plan-id` annotation on the request's key.
#
# For getting-started we declare ONE tier only (`demo`) at 60 req/min.
# In production you usually have gold/silver/bronze with different
# escalonados.
#
# targetRef → mesma HTTPRoute do passo 1. É por isso que precisou vir
# later: Kuadrant only validates the policy if the HTTPRoute exists.
apiVersion: extensions.kuadrant.io/v1alpha1
kind: PlanPolicy
metadata:
  name: banking-lite-plans
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-getting-started
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: banking-lite
  plans:
    - tier: demo
      predicate: |
        has(auth.identity) && auth.identity.metadata.annotations["secret.kuadrant.io/plan-id"] == "demo"
      limits:
        custom:
          - limit: 60
            window: "1m"
