# Getting started — Passo 2/6: APIProduct
#
# Declares "banking-lite" as a product in the RHCL/DevPortal catalog.
# Points at the step-1 HTTPRoute via targetRef — this is how the portal
# + o plugin do console descobrem quais rotas pertencem a este produto.
#
# Without an APIProduct: the HTTPRoute works, but the dev portal does not show
# it, and the console plugin cannot group metrics by product.
#
# spec.approvalMode:
#   - auto     — the user clicks "subscribe" and the key is generated immediately
#   - manual   — pedido de subscription entra numa fila e requer
#                owner/admin approval in the portal
# We use `auto` for getting-started because the goal is to feel
# o fluxo completo sem depender de outra pessoa.
apiVersion: devportal.kuadrant.io/v1alpha1
kind: APIProduct
metadata:
  name: banking-lite
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-getting-started
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: banking-lite
  displayName: "Banking Lite (Getting Started)"
  description: >-
    API de onboarding criada pelo tutorial getting-started. Reaproveita
    the banking-api-v1 backend in its own RHCL perimeter (new HTTPRoute
    + AuthPolicy + RateLimitPolicy + PlanPolicy) pra demonstrar o fluxo
    full flow of declaring an API.
  version: "1.0.0"
  approvalMode: auto
  publishStatus: published
  tags:
    - getting-started
    - banking
  contact:
    team: "Platform PoC"
    email: "poc@example.com"
