# Getting started — Step 6b/6: APIKey CR (request/approval in the dev portal)
#
# ISTO NÃO É a chave que autentica o request. A chave real vive no
# Secret do arquivo anterior (06-apikey-secret.yaml).
#
# The APIKey CR is the "access request" object that appears in the dev
# portal. Ele:
#   1. Appears in the user's "My API keys" list in the portal
#   2. Aparece no card de subscribers do APIProduct pro owner
#   3. Vincula o consumer (via requestedBy.userId) ao APIProduct
#   4. In production it has status={pending, approved, rejected} controlled
#      pelo owner ou auto-approved (approvalMode do APIProduct)
#
# Runtime authentication ignores this CR — Authorino only looks at the
# Secrets matching the AuthPolicy selector. The CR is UI + governance.
apiVersion: devportal.kuadrant.io/v1alpha1
kind: APIKey
metadata:
  name: banking-lite-onboarding
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-getting-started
spec:
  apiProductRef:
    name: banking-lite
  secretRef:
    name: banking-lite-onboarding-key
  planTier: demo
  requestedBy:
    email: onboarding-user@example.com
    userId: onboarding-user
