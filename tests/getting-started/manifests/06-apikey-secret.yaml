# Getting started — Step 6a/6: API key (raw Secret)
#
# This is the Secret Authorino actually reads to validate each
# request at runtime. Two pairs of labels matter:
#
#   authorino.kuadrant.io/managed-by: authorino
#     → Authorino watches Secrets with this label
#   app: banking-lite-apikey
#     → it is the matchLabels of the step-4 AuthPolicy selector;
#       ties this Secret specifically to that AuthPolicy
#
# Annotations become metadata on `auth.identity`:
#   user-id   → the consumer's name (appears in the plugin ranking)
#   plan-id   → tier the PlanPolicy uses to pick the rate limit
#
# ATTENTION — DEMO VALUE ONLY:
#   `data.api_key` below is a hardcoded demo key. In production
#   NEVER commit the key value to git. Use the dev portal (step 7
#   of the guide) to generate random per-consumer keys.
apiVersion: v1
kind: Secret
metadata:
  name: banking-lite-onboarding-key
  namespace: rhcl-apps
  labels:
    authorino.kuadrant.io/managed-by: authorino
    app: banking-lite-apikey
    app.kubernetes.io/part-of: rhcl-getting-started
  annotations:
    secret.kuadrant.io/user-id: "onboarding-user"
    secret.kuadrant.io/plan-id: "demo"
type: Opaque
stringData:
  api_key: "banking-lite-demo-key-CHANGE-ME"
