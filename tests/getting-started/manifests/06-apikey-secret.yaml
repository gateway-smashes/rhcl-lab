# Getting started — Passo 6a/6: API key (Secret bruto)
#
# Este é o Secret que o Authorino realmente lê pra validar cada
# request no runtime. Dois pares de labels contam:
#
#   authorino.kuadrant.io/managed-by: authorino
#     → o Authorino faz watch em Secrets com esse label
#   app: banking-lite-apikey
#     → é o matchLabels do selector da AuthPolicy do passo 4;
#       amarra este Secret especificamente àquela AuthPolicy
#
# Annotations viram metadados no `auth.identity`:
#   user-id   → nome do consumer (aparece no ranking do plugin)
#   plan-id   → tier que a PlanPolicy usa pra escolher rate limit
#
# ATENÇÃO — VALOR DE DEMO ONLY:
#   `data.api_key` abaixo é uma chave de demo hardcoded. Em produção
#   NUNCA cheque o valor da chave no git. Use o dev portal (passo 7
#   do guide) pra gerar chaves aleatórias por consumer.
apiVersion: v1
kind: Secret
metadata:
  name: banking-lite-onboarding-key
  namespace: rhcl-apps
  labels:
    authorino.kuadrant.io/managed-by: authorino
    app: banking-lite-apikey
    app.kubernetes.io/part-of: rhcl-getting-started
  annotations:
    secret.kuadrant.io/user-id: "onboarding-user"
    secret.kuadrant.io/plan-id: "demo"
type: Opaque
stringData:
  api_key: "banking-lite-demo-key-CHANGE-ME"
