# Getting started — Passo 1/6: HTTPRoute
#
# Declares ONE public path (/api) on the new hostname, pointing at the
# Service banking-api-v1 que JÁ existe no cluster. É a mesma app do
# "official" banking-api serving on another hostname — what changes is the
# RHCL perimeter (auth + rate limit + APIProduct) that will attach
# neste HTTPRoute via targetRef.
#
# parentRefs: aponta pro gateway RHCL existente (rhcl-apps-gateway em
# openshift-ingress). Como o gateway tem listener wildcard, qualquer
# subdomain of the zone (banking-lite.<zone>) resolves with no new DNS.
#
# Placeholder ${HOSTNAME}: deploy.sh substitui pela hostname que vc
# to choose. By convention use the same parent domain as the existing
# banking-api — banking-lite.<your-domain>.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: banking-lite
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-getting-started
spec:
  parentRefs:
    - name: rhcl-apps-gateway
      namespace: openshift-ingress
  hostnames:
    - ${HOSTNAME}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: banking-api-v1
          port: 8080
