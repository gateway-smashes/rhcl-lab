# Getting started — Step 5/6: RateLimitPolicy (global)
#
# GLOBAL rate limit for the API — sum of ALL requests, regardless
# of the consumer. Acts as an "umbrella" above the PlanPolicy:
# even if 10 consumers on the `demo` tier are within their 60/min
# individual ones, if the API TOTAL exceeds 500/min nobody
# gets through. Protects the backend from aggregate spikes.
#
# Difference from the step-3 PlanPolicy:
#   - PlanPolicy: 60/min PER consumer with plan-id=demo
#   - RateLimitPolicy: 500/min TOTAL for the API
#
# If you don't want this aggregate ceiling, you can skip this step — the
# PlanPolicy alone already protects the backend per consumer.
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: banking-lite-global-ratelimit
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-getting-started
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: banking-lite
  limits:
    global:
      rates:
        - limit: 500
          window: "1m"
