# Getting started — Passo 5/6: RateLimitPolicy (global)
#
# Rate limit GLOBAL da API — soma de TODAS as requests, independente
# do consumer. Funciona como um "guarda-chuva" acima da PlanPolicy:
# mesmo que 10 consumers do tier `demo` estejam dentro dos 60/min
# individual ones, if the API TOTAL exceeds 500/min nobody
# passa. Protege o backend de picos agregados.
#
# Difference from the step-3 PlanPolicy:
#   - PlanPolicy: 60/min POR consumer com plan-id=demo
#   - RateLimitPolicy: 500/min TOTAL na API
#
# If you don't want this aggregate ceiling, you can skip this step — the
# PlanPolicy alone already protects the backend per consumer.
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: banking-lite-global-ratelimit
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-getting-started
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: banking-lite
  limits:
    global:
      rates:
        - limit: 500
          window: "1m"
