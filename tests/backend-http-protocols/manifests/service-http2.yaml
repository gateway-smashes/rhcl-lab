# Service to demonstrate HTTP/2 (h2c) upstream.
# Points at the same existing banking-api-v1 pods in the namespace.
# The appProtocol: kubernetes.io/h2c field instructs Istio/Envoy to connect
# to the backend using HTTP/2 cleartext (no TLS).
#
# Reference: https://kubernetes.io/docs/concepts/services-networking/service/#application-protocol
# Reference: https://istio.io/latest/docs/ops/configuration/traffic-management/protocol-selection/
apiVersion: v1
kind: Service
metadata:
  name: req054-backend-h2c
  namespace: {{ apps_namespace }}
  labels:
    app.kubernetes.io/part-of: req054-http-versions
    rhcl.poc/item: "54"
spec:
  selector:
    app: banking-api-v1
  ports:
  - name: http2
    port: 8080
    targetPort: 8080
    protocol: TCP
    appProtocol: kubernetes.io/h2c
