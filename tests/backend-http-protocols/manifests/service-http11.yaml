# Service to demonstrate HTTP/1.1 upstream (Envoy's default behavior).
# Points at the same existing banking-api-v1 pods in the namespace.
# No appProtocol set → Envoy uses HTTP/1.1 as the upstream protocol.
apiVersion: v1
kind: Service
metadata:
  name: req054-backend-http11
  namespace: {{ apps_namespace }}
  labels:
    app.kubernetes.io/part-of: req054-http-versions
    rhcl.poc/item: "54"
spec:
  selector:
    app: banking-api-v1
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
