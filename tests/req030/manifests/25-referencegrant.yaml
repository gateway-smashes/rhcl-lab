# ReferenceGrant allowing HTTPRoutes in req030-gateway to target Services in
# req030-apps (hello-world and request-interceptor).
#
# This resource must be created in the TARGET namespace (req030-apps).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: req030-gateway-to-apps
  namespace: req030-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req030-interceptor
    rhcl-lab/requirement: req030
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: req030-gateway
  to:
    - group: ""
      kind: Service
