# HTTPRoute for external authorization — traffic goes to hello-world after
# Envoy calls request-interceptor via AuthorizationPolicy CUSTOM (ext_authz).
#
# Usage:
#   export RHCL_ZONE_ROOT_DOMAIN=sandbox2314.opentlc.com
#   envsubst < tests/req030/manifests/20-httproute-extauthz.yaml | oc apply -f -
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: req030-extauthz-route
  namespace: req030-gateway
  labels:
    app.kubernetes.io/part-of: rhcl-req030-interceptor
    rhcl-lab/requirement: req030
spec:
  parentRefs:
    - name: req030-interceptor-gateway
      namespace: req030-gateway
      sectionName: http-extauthz
  hostnames:
    - "req030-extauthz.${RHCL_ZONE_ROOT_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hello-world
          namespace: req030-apps
          port: 8080
