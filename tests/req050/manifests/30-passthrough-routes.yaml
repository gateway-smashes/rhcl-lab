# OpenShift Routes with TLS passthrough.
#
# The *.* wildcard DNS resolves to the default OpenShift router.
# These Routes tell the router to forward the encrypted connection
# (unchanged) to our mTLS gateway service, preserving the full TLS/mTLS
# handshake for our Envoy to handle (SNI selects the filter chain).
#
# Usage:
#   export RHCL_ZONE_ROOT_DOMAIN=mycluster.sandbox546.opentlc.com
#   envsubst < tests/req050/manifests/30-passthrough-routes.yaml | oc apply -f -
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: req050-crl-passthrough
  namespace: req050-gateway
  labels:
    app.kubernetes.io/part-of: rhcl-req050-revocation
    rhcl-lab/requirement: req050-ocsp-crl
    kubernetes.io/ingress.class: nginx
spec:
  host: "req050-crl.${RHCL_ZONE_ROOT_DOMAIN}"
  port:
    targetPort: https-crl
  to:
    kind: Service
    name: req050-revocation-gateway-openshift-default
    weight: 100
  tls:
    termination: passthrough
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: req050-ocsp-passthrough
  namespace: req050-gateway
  labels:
    app.kubernetes.io/part-of: rhcl-req050-revocation
    rhcl-lab/requirement: req050-ocsp-crl
    kubernetes.io/ingress.class: nginx
spec:
  host: "req050-ocsp.${RHCL_ZONE_ROOT_DOMAIN}"
  port:
    targetPort: https-crl
  to:
    kind: Service
    name: req050-revocation-gateway-openshift-default
    weight: 100
  tls:
    termination: passthrough
