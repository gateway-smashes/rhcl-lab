# HTTPRoute para demonstrar timeout por endpoint/recurso (REQ 13).
#
# Como aplicar (substitui ${RHCL_ZONE_ROOT_DOMAIN} pelo valor exportado):
#   export RHCL_ZONE_ROOT_DOMAIN=apps.cluster1.poc.rhcl.com.br   # ajuste para seu lab
#   envsubst < tests/req013/manifests/httproute-timeout.yaml | oc apply -f -
#
# A rota fica anexada ao Gateway wildcard `*.${RHCL_ZONE_ROOT_DOMAIN}` criado
# pelo playbook (rhcl-apps-gateway em openshift-ingress) e expõe três regras
# que apontam para o MESMO endpoint do backend (/api/v1/timeout, que dorme
# 3 s) com timeouts diferentes — provando que o limite é por rota:
#
#   /api/v1/timeout         timeouts.request: 2s   -> 504 (corta antes do backend)
#   /api/v1/timeoutmaior    timeouts.request: 30s  -> 200 (rewrite p/ /api/v1/timeout)
#   /api/v1                 timeouts.request: 30s  -> 200 (catch-all v1)
#
# Aponte a página tests/req013/index.html para
# https://timeout.${RHCL_ZONE_ROOT_DOMAIN} para ver os dois comportamentos
# lado a lado contra o mesmo endpoint final.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: banking-api-timeout
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req13-timeout
spec:
  parentRefs:
    - name: rhcl-apps-gateway
      namespace: openshift-ingress
  hostnames:
    - timeout.${RHCL_ZONE_ROOT_DOMAIN}
  rules:
    # Endpoint específico com timeout curto: o gateway corta em 2 s
    # mesmo que o backend leve 3 s para responder.
    - matches:
        - path:
            type: Exact
            value: /api/v1/timeout
      timeouts:
        request: 2s
      backendRefs:
        - name: banking-api-v1
          port: 8080

    # Mesmo endpoint final no backend, mas com path externo diferente e
    # timeout longo. URLRewrite troca o path para /api/v1/timeout antes
    # de enviar ao backend — prova que o timeout é amarrado à rota, não
    # ao endpoint do upstream.
    - matches:
        - path:
            type: Exact
            value: /api/v1/timeoutmaior
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /api/v1/timeout
      timeouts:
        request: 30s
      backendRefs:
        - name: banking-api-v1
          port: 8080

    # Catch-all v1 com timeout longo, para que outras chamadas sigam
    # funcionando normalmente.
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      timeouts:
        request: 30s
      backendRefs:
        - name: banking-api-v1
          port: 8080
