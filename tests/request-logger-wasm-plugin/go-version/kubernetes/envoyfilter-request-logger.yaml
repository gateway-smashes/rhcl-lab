apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: request-logger-wasm
spec:
  workloadSelector:
    labels:
      gateway.istio.io/managed: istio.io-gateway-controller
      #gateway.networking.k8s.io/gateway-name: rhcl-apps-gateway
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: "envoy.filters.network.http_connection_manager"
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.wasm
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
          config:
            name: request-logger
            root_id: request_logger_root
            configuration:
              "@type": type.googleapis.com/google.protobuf.StringValue
              value: '{"sensitive_headers":["authorization","cookie","set-cookie","x-api-key"]}'
            vm_config:
              vm_id: request_logger_vm
              runtime: envoy.wasm.runtime.v8
              code:
                local:
                  filename: /var/lib/wasm-plugins/request-logger.wasm
