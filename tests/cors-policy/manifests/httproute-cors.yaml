# HTTPRoute to demonstrate CORS at the gateway (REQ 14).
#
# How to apply (substitutes ${RHCL_ZONE_ROOT_DOMAIN} with the exported value):
#   export RHCL_ZONE_ROOT_DOMAIN=apps.example.com   # adjust for your lab
#   envsubst < tests/cors-policy/manifests/httproute-cors.yaml | oc apply -f -
#
# The route attaches to the wildcard `*.${RHCL_ZONE_ROOT_DOMAIN}` Gateway created
# by the playbook (rhcl-apps-gateway in openshift-ingress) and exposes
# /api/v1/cors with Access-Control-Allow-* injected via ResponseHeaderModifier.
#
# The backend rejects Origins outside *.${RHCL_ZONE_ROOT_DOMAIN} (the Quarkus
# CORS filter returns 403). When the test calls the backend directly from
# another origin, the browser sees the block. When the same endpoint is
# called via cors.${RHCL_ZONE_ROOT_DOMAIN}, this HTTPRoute strips the `Origin`
# header before proxying (so the backend treats it as same-origin and
# returns 200) and the gateway is what injects the Access-Control-Allow-* in the response.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: banking-api-cors
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req14-cors
spec:
  parentRefs:
    - name: rhcl-apps-gateway
      namespace: openshift-ingress
  hostnames:
    - cors.${RHCL_ZONE_ROOT_DOMAIN}
  rules:
    # /api/v1/cors -> the backend responds without CORS; the gateway adds the
    # Access-Control-Allow-* headers to the response to unblock the browser.
    - matches:
        - path:
            type: Exact
            value: /api/v1/cors
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Origin
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Access-Control-Allow-Origin
                value: "*"
              - name: Access-Control-Allow-Methods
                value: "GET, POST, OPTIONS"
              - name: Access-Control-Allow-Headers
                value: "Authorization, Content-Type, Accept, X-Requested-With"
              - name: Access-Control-Expose-Headers
                value: "x-instance, x-flow-trace-id"
              - name: Access-Control-Max-Age
                value: "600"
              - name: Vary
                value: "Origin"
      backendRefs:
        - name: banking-api-v1
          port: 8080
