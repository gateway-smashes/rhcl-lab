# HTTPRoute para demonstrar CORS no gateway (REQ 14).
#
# Como aplicar (substitui ${RHCL_ZONE_ROOT_DOMAIN} pelo valor exportado):
#   export RHCL_ZONE_ROOT_DOMAIN=apps.example.com   # ajuste para seu lab
#   envsubst < tests/cors-policy/manifests/httproute-cors.yaml | oc apply -f -
#
# A rota fica anexada ao Gateway wildcard `*.${RHCL_ZONE_ROOT_DOMAIN}` criado
# by the playbook (rhcl-apps-gateway in openshift-ingress) and exposes
# /api/v1/cors com Access-Control-Allow-* injetados via ResponseHeaderModifier.
#
# O backend rejeita Origins fora de *.${RHCL_ZONE_ROOT_DOMAIN} (CORS filter do
# Quarkus retorna 403). Quando o teste chama o backend diretamente a partir de
# another origin, the browser sees the block. When the same endpoint is
# called via cors.${RHCL_ZONE_ROOT_DOMAIN}, this HTTPRoute sets the headers
# `Origin` antes de fazer o proxy (assim o backend trata como same-origin e
# (returns 200) and the gateway is what injects the Access-Control-Allow-* in the response.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: banking-api-cors
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req14-cors
spec:
  parentRefs:
    - name: rhcl-apps-gateway
      namespace: openshift-ingress
  hostnames:
    - cors.${RHCL_ZONE_ROOT_DOMAIN}
  rules:
    # /api/v1/cors -> backend retorna sem CORS; o gateway adiciona os
    # Access-Control-Allow-* na resposta para liberar o navegador.
    - matches:
        - path:
            type: Exact
            value: /api/v1/cors
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Origin
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Access-Control-Allow-Origin
                value: "*"
              - name: Access-Control-Allow-Methods
                value: "GET, POST, OPTIONS"
              - name: Access-Control-Allow-Headers
                value: "Authorization, Content-Type, Accept, X-Requested-With"
              - name: Access-Control-Expose-Headers
                value: "x-instance, x-flow-trace-id"
              - name: Access-Control-Max-Age
                value: "600"
              - name: Vary
                value: "Origin"
      backendRefs:
        - name: banking-api-v1
          port: 8080
