# Allow the backend MCP server HTTPRoute (mcp-gateway) to reference Service banking-api-v1 in rhcl-apps.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: banking-api-mcp-server-to-backend
  namespace: rhcl-apps
  labels:
    rhcl-lab/requirement: req059-mcp-operator
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: mcp-gateway
  to:
    - group: ""
      kind: Service
      name: banking-api-v1
