# Item 47 — Backend TLS 1.2 / 1.3 — HTTPRoute to banking-api HTTPS (:8443).
#
# Hostname tls.${RHCL_ZONE_ROOT_DOMAIN} routes GET /api/tls/info to
# banking-api-v1:8443. Pair with 01-backendtlspolicy.yaml.
#
# Apply:
#   export RHCL_ZONE_ROOT_DOMAIN=apps.example.com
#   envsubst < tests/backend-tls-versions/manifests/00-httproute-backend-tls.yaml | oc apply -f -
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-tls
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-backend-tls-poc
    rhcl.poc/item: "47"
spec:
  parentRefs:
    - name: rhcl-apps-gateway
      namespace: openshift-ingress
  hostnames:
    - "tls.${RHCL_ZONE_ROOT_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/tls/info
          method: GET
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              - name: Access-Control-Allow-Origin
                value: "*"
              - name: Access-Control-Allow-Methods
                value: "GET,OPTIONS"
              - name: Access-Control-Allow-Headers
                value: "accept,content-type,x-requested-with"
              - name: Access-Control-Max-Age
                value: "86400"
              - name: Vary
                value: "Origin"
      backendRefs:
        - name: banking-api-v1
          port: 8443
