# Lightweight Loki (filesystem storage) for gateway access-log retention.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: rhcl-logging
  labels:
    app.kubernetes.io/part-of: rhcl-poc
    rhcl.redhat.com/requirement: req040
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      # PoC: Alloy tails the full pod log history on first connect; allow older
      # lines so the initial backfill is not rejected while Loki is starting.
      reject_old_samples: false
      reject_old_samples_max_age: 168h
      retention_period: 168h

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: rhcl-logging
  labels:
    app: loki
    app.kubernetes.io/part-of: rhcl-poc
    rhcl.redhat.com/requirement: req040
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: rhcl-logging
  labels:
    app: loki
    app.kubernetes.io/part-of: rhcl-poc
    rhcl.redhat.com/requirement: req040
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
        app.kubernetes.io/part-of: rhcl-poc
        rhcl.redhat.com/requirement: req040
    spec:
      containers:
        - name: loki
          image: docker.io/grafana/loki:2.9.4
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}
