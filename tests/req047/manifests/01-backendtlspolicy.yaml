# Item 47 — BackendTLSPolicy: Envoy originates TLS 1.2/1.3 to banking-api-v1:8443.
#
# Apply after 00 and 02:
#   envsubst < tests/req047/manifests/01-backendtlspolicy.yaml | oc apply -f -
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: backend-tls-backend-tls
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-backend-tls-poc
    rhcl.poc/item: "47"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: backend-tls
  validation:
    hostname: banking-api-v1.rhcl-apps.svc
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: backend-tls-service-ca
