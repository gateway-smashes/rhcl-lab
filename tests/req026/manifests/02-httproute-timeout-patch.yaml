# req026 — adds a per-rule request timeout on /api/files/upload to the
# banking-api HTTPRoute. JSON-merge patch so it slots in without
# rewriting the whole HTTPRoute.
#
# Apply with:
#   oc -n rhcl-apps patch httproute banking-api-connectivity --type=json \
#     --patch-file tests/req026/manifests/02-httproute-timeout-patch.yaml
#
# The new rule MUST come before the catch-all /api rule so
# `/api/files/upload` matches it first (Gateway-API GEP-1742: longer
# prefix wins). Index 7 sits between /ws (#7) and the catch-all (#8) in
# the rendered HTTPRoute.
- op: add
  path: /spec/rules/7
  value:
    matches:
      - path:
          type: PathPrefix
          value: /api/files/upload
        method: POST
    timeouts:
      request: 60s
    filters:
      - type: ResponseHeaderModifier
        responseHeaderModifier:
          set:
            - name: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
    backendRefs:
      - name: banking-api-v1
        port: 8080
