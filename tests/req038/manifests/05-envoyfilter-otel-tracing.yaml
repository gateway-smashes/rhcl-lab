# EnvoyFilter — configura OpenTelemetry tracing no gateway Envoy
#
# Este EnvoyFilter é necessário porque o Istio CR (openshift-gateway) é
# gerenciado pelo controller da GatewayClass e não aceita patches
# persistentes em extensionProviders/meshConfig.
#
# O EnvoyFilter injeta o tracer OpenTelemetry diretamente na config do
# Envoy proxy do gateway, enviando spans para o OpenTelemetryCollector.
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: otel-tracing
  namespace: openshift-ingress
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: rhcl-apps-gateway
  configPatches:
    - applyTo: NETWORK_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            tracing:
              provider:
                name: envoy.tracers.opentelemetry
                typed_config:
                  "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                  grpc_service:
                    envoy_grpc:
                      cluster_name: outbound|4317||otel-rhcl-collector.observability.svc.cluster.local
                    timeout: 0.250s
                  service_name: rhcl-gateway
              random_sampling:
                value: 100
