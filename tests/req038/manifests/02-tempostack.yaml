apiVersion: tempo.grafana.com/v1alpha1
kind: TempoStack
metadata:
  name: tempo-rhcl
  namespace: tempo
spec:
  storage:
    secret:
      name: tempo-storage
      type: s3
  storageSize: 1Gi
  # `total` é dividido pelo operator entre TODOS os componentes (compactor,
  # distributor, gateway, ingester, querier, query-frontend × vários containers).
  # 2Gi era pequeno demais: o container `tempo` do query-frontend ficava com
  # ~41Mi → exit 137 / readiness timeout → o gateway respondia 502 em
  # Observe → Traces. 10Gi dá ~205Mi por container do query-frontend (folgado
  # para POC). Nós do cluster têm dezenas de GiB livres.
  resources:
    total:
      limits:
        memory: 10Gi
        cpu: "4"
  tenants:
    mode: openshift
    authentication:
      - tenantName: dev
        tenantId: "1610b0c3-c509-4592-a256-a1871353dbfa"
  template:
    gateway:
      enabled: true
    queryFrontend:
      jaegerQuery:
        enabled: true