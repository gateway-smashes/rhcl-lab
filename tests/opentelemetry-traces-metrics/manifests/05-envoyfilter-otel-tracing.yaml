# EnvoyFilter — configura OpenTelemetry tracing no gateway Envoy
#
# This EnvoyFilter is needed because the Istio CR (openshift-gateway) is
# managed by the GatewayClass controller and does not accept patches
# persistentes em extensionProviders/meshConfig.
#
# The EnvoyFilter injects the OpenTelemetry tracer directly into the config of
# the gateway's Envoy proxy, sending spans to the OpenTelemetryCollector.
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: otel-tracing
  namespace: openshift-ingress
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: rhcl-apps-gateway
  configPatches:
    - applyTo: NETWORK_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            tracing:
              provider:
                name: envoy.tracers.opentelemetry
                typed_config:
                  "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                  grpc_service:
                    envoy_grpc:
                      cluster_name: outbound|4317||otel-rhcl-collector.observability.svc.cluster.local
                    timeout: 0.250s
                  service_name: rhcl-gateway
              random_sampling:
                value: 100
