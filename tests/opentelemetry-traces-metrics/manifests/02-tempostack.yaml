apiVersion: tempo.grafana.com/v1alpha1
kind: TempoStack
metadata:
  name: tempo-rhcl
  namespace: tempo
spec:
  storage:
    secret:
      name: tempo-storage
      type: s3
  storageSize: 1Gi
  # `total` is split by the operator across ALL components (compactor,
  # distributor, gateway, ingester, querier, query-frontend × several containers).
  # 2Gi was too small: the query-frontend's `tempo` container kept getting
  # ~41Mi → exit 137 / readiness timeout → the gateway returned 502 on
  # Observe → Traces. 10Gi gives ~205Mi per query-frontend container (roomy
  # for the lab). Cluster nodes have tens of GiB free.
  resources:
    total:
      limits:
        memory: 10Gi
        cpu: "4"
  tenants:
    mode: openshift
    authentication:
      - tenantName: dev
        tenantId: "1610b0c3-c509-4592-a256-a1871353dbfa"
  template:
    gateway:
      enabled: true
    queryFrontend:
      jaegerQuery:
        enabled: true