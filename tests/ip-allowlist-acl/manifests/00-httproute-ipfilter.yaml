# IP-based ACL — dedicated HTTPRoute for the ipfilter-php probe.
#
# This route publishes the PHP app `ipfilter-php` (service on port 8080) under
# the hostname `ipfilter.${RHCL_ZONE_ROOT_DOMAIN}`, isolating the IP-ACL demo
# from banking-api. The app exposes:
#   • GET /            → HTML page that spoofs x-forwarded-for and shows the seen IP
#   • GET /api/ip      → snapshot JSON (REMOTE_ADDR, x-forwarded-for chain, etc.)
#   • GET /healthz     → health check
#
# Why a dedicated route?
#   • No API key/JWT in the path — all traffic is anonymous, so the only
#     variable in the demo is the source IP.
#   • Applying an IP-ACL AuthPolicy here does not disable any production auth
#     policy (unlike targeting banking-api-connectivity).
#   • The dedicated hostname becomes the `vhost.name` consumed by Engine 3
#     (EnvoyFilter / RBAC) — ver 05/06.
#
# Idempotency with the automation:
#   The `apps-install` playbook (APPS_IPFILTER_ENABLED=true) already creates the
#   same name (`ipfilter`) via roles/apps/templates/ipfilter-httproute.yml.j2.
#   This manifest re-asserts the same object — useful to run the demo standalone
#   without depending on the playbook. Keep the hostname aligned: the playbook
#   default (apps_ipfilter_route_hostname) resolves to
#   `ipfilter.${RHCL_ZONE_ROOT_DOMAIN}` when RHCL_ZONE_ROOT_DOMAIN is set.
#
# How to apply:
#   export RHCL_ZONE_ROOT_DOMAIN=apps.example.com  # adjust
#   envsubst < tests/ip-allowlist-acl/manifests/00-httproute-ipfilter.yaml | oc apply -f -
#
# Validate:
#   HOST=$(oc get httproute ipfilter -n rhcl-apps -o jsonpath='{.spec.hostnames[0]}')
#   curl -sk -o /dev/null -w "%{http_code}\n" "https://$HOST/api/ip"   # 200
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ipfilter
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-ipfilter-poc
    rhcl.poc/item: "72"
spec:
  parentRefs:
    - name: rhcl-apps-gateway
      namespace: openshift-ingress
  hostnames:
    - "ipfilter.${RHCL_ZONE_ROOT_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              # CORS — includes x-forwarded-for so the cross-origin console
              # (tests/ip-allowlist-acl/index.html served from another origin) can
              # forge the header in the preflight.
              - name: Access-Control-Allow-Origin
                value: "*"
              - name: Access-Control-Allow-Methods
                value: "GET,POST,OPTIONS"
              - name: Access-Control-Allow-Headers
                value: "accept,content-type,x-requested-with,x-forwarded-for"
              - name: Access-Control-Expose-Headers
                value: "x-rhcl-policy,x-rhcl-policy-mode,x-rhcl-policy-engine"
              - name: Access-Control-Max-Age
                value: "86400"
              - name: Vary
                value: "Origin"
      backendRefs:
        - name: ipfilter-php
          port: 8080
