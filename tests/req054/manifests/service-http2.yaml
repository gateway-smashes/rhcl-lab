# Service para demonstrar upstream HTTP/2 (h2c).
# Aponta para os mesmos pods banking-api-v1 existentes no namespace.
# O campo appProtocol: kubernetes.io/h2c instrui o Istio/Envoy a conectar
# ao backend usando HTTP/2 cleartext (sem TLS).
#
# Referência: https://kubernetes.io/docs/concepts/services-networking/service/#application-protocol
# Referência: https://istio.io/latest/docs/ops/configuration/traffic-management/protocol-selection/
apiVersion: v1
kind: Service
metadata:
  name: req054-backend-h2c
  namespace: {{ apps_namespace }}
  labels:
    app.kubernetes.io/part-of: req054-http-versions
    rhcl.poc/item: "54"
spec:
  selector:
    app: banking-api-v1
  ports:
  - name: http2
    port: 8080
    targetPort: 8080
    protocol: TCP
    appProtocol: kubernetes.io/h2c
