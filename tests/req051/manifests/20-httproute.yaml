# HTTPRoutes for the mTLS gateway — one per listener/hostname.
#
# Each route has two path rules:
#   /api/echo  -> echo-server (same namespace) — returns the full request incl.
#                 the x-forwarded-client-cert (XFCC) header, for inspection.
#   /api       -> banking-api-v1 (rhcl-apps)   — the normal PoC backend used by
#                 every other test (/api/tls/info etc.).
# Gateway API picks the longest-matching path prefix, so /api/echo wins over /api.
#
# Usage:
#   export RHCL_ZONE_ROOT_DOMAIN=sandbox2314.opentlc.com
#   envsubst < tests/req051/manifests/20-httproute.yaml | oc apply -f -
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: req056-mtls-route
  namespace: req051-gateway
  labels:
    app.kubernetes.io/part-of: rhcl-req051-mtls
spec:
  parentRefs:
    - name: req051-mtls-gateway
      namespace: req051-gateway
      sectionName: https-single-ca
  hostnames:
    - "req056-mtls.${RHCL_ZONE_ROOT_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/echo
      backendRefs:
        - name: echo-server
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: banking-api-v1
          namespace: rhcl-apps
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: req051-mtls-route
  namespace: req051-gateway
  labels:
    app.kubernetes.io/part-of: rhcl-req051-mtls
spec:
  parentRefs:
    - name: req051-mtls-gateway
      namespace: req051-gateway
      sectionName: https-chain-ca
  hostnames:
    - "req051-mtls.${RHCL_ZONE_ROOT_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/echo
      backendRefs:
        - name: echo-server
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: banking-api-v1
          namespace: rhcl-apps
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: req051-untrusted-route
  namespace: req051-gateway
  labels:
    app.kubernetes.io/part-of: rhcl-req051-mtls
spec:
  parentRefs:
    - name: req051-mtls-gateway
      namespace: req051-gateway
      sectionName: https-accept-untrusted
  hostnames:
    - "req051-untrusted.${RHCL_ZONE_ROOT_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/echo
      backendRefs:
        - name: echo-server
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: banking-api-v1
          namespace: rhcl-apps
          port: 8080
