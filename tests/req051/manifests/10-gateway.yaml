# Gateway with TWO HTTPS listeners for mTLS testing.
#
# Uses GatewayClass "openshift-default" (backed by Istio in OSSM 3.x).
# Client certificate enforcement is handled by EnvoyFilter (deployed via
# deploy-envoyfilter.sh), NOT by frontendValidation — OpenShift ships
# standard-channel Gateway API CRDs that don't include that experimental field.
#
#   1. https-single-ca (REQ 056): trusts only the Intermediate CA directly.
#      Client cert MUST be signed by the Intermediate CA.
#
#   2. https-chain-ca (REQ 051): trusts only the Root CA.
#      Client cert signed by Intermediate CA is accepted through chain
#      traversal (client sends [leaf + intermediate] in the TLS handshake).
#
# Prerequisites:
#   - Secret/req051-server-tls (kubernetes.io/tls) with the server cert + key
#
# Usage:
#   export RHCL_ZONE_ROOT_DOMAIN=mycluster.sandbox546.opentlc.com
#   envsubst < tests/req051/manifests/10-gateway.yaml | oc apply -f -
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: req051-mtls-gateway
  namespace: req051-gateway
  labels:
    app.kubernetes.io/part-of: rhcl-req051-mtls
    rhcl-lab/requirement: req051-056-mtls
    istio.io/rev: openshift-gateway
  annotations:
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: openshift-default
  listeners:
    # ---------------------------------------------------------------
    # Listener 1: Single CA validation (REQ 056 — expose APIs via mTLS)
    # mTLS enforcement applied by EnvoyFilter (deploy-envoyfilter.sh)
    # ---------------------------------------------------------------
    - name: https-single-ca
      port: 443
      protocol: HTTPS
      hostname: "req056-mtls.${RHCL_ZONE_ROOT_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: req051-server-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All

    # ---------------------------------------------------------------
    # Listener 2: Certificate chain validation (REQ 051 — mTLS by chain)
    # mTLS enforcement applied by EnvoyFilter (deploy-envoyfilter.sh)
    # ---------------------------------------------------------------
    - name: https-chain-ca
      port: 443
      protocol: HTTPS
      hostname: "req051-mtls.${RHCL_ZONE_ROOT_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: req051-server-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All

    # ---------------------------------------------------------------
    # Listener 3: ACCEPT_UNTRUSTED — does NOT verify the client cert
    # chain; gates by SAN instead (trust_chain_verification +
    # match_typed_subject_alt_names, applied by EnvoyFilter).
    # ---------------------------------------------------------------
    - name: https-accept-untrusted
      port: 443
      protocol: HTTPS
      hostname: "req051-untrusted.${RHCL_ZONE_ROOT_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: req051-server-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
