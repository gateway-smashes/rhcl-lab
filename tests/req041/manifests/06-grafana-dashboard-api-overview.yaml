apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: rhcl-api-overview
  namespace: rhcl-grafana
  labels:
    app.kubernetes.io/part-of: rhcl-poc
    rhcl.redhat.com/requirement: req041
spec:
  resyncPeriod: 5m
  instanceSelector:
    matchLabels:
      dashboards: rhcl
  json: >
    {
      "id": null,
      "uid": "rhcl-api-overview",
      "title": "RHCL API Overview",
      "description": "Req 41 — API throughput, latency percentiles, status code distribution, per-endpoint and per-HTTPRoute breakdown.",
      "tags": ["rhcl", "kuadrant", "api", "req041"],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "schemaVersion": 38,
      "version": 1,
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "current": {},
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "definition": "label_values(istio_requests_total, source_workload)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "gateway",
            "label": "Gateway",
            "query": { "query": "label_values(istio_requests_total, source_workload)", "refId": "gateway" },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          },
          {
            "current": {},
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "definition": "label_values(istio_requests_total{source_workload=~\"$gateway\"}, route_name)",
            "hide": 0,
            "includeAll": true,
            "allValue": ".*",
            "multi": false,
            "name": "httproute",
            "label": "HTTPRoute",
            "query": { "query": "label_values(istio_requests_total{source_workload=~\"$gateway\"}, route_name)", "refId": "httproute" },
            "refresh": 2,
            "regex": "/(.+)\\.[0-9]+/",
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Summary",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 1 },
          "id": 1,
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Total Requests",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(increase(istio_requests_total{source_workload=~\"$gateway\", route_name=~\"$httproute..+\"}[$__range]))",
              "legendFormat": "Total",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 }] },
              "unit": "percent", "max": 100, "min": 0
            }
          },
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 1 },
          "id": 2,
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Error Rate (5xx)",
          "type": "stat",
          "targets": [
            {
              "expr": "100 * sum(rate(istio_requests_total{source_workload=~\"$gateway\", route_name=~\"$httproute..+\", response_code=~\"5..\"}[5m])) / sum(rate(istio_requests_total{source_workload=~\"$gateway\", route_name=~\"$httproute..+\"}[5m]))",
              "legendFormat": "5xx %",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 500 }, { "color": "red", "value": 2000 }] },
              "unit": "ms"
            }
          },
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 1 },
          "id": 3,
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Avg Latency",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(rate(istio_request_duration_milliseconds_sum{source_workload=~\"$gateway\", route_name=~\"$httproute..+\"}[5m])) / sum(rate(istio_request_duration_milliseconds_count{source_workload=~\"$gateway\", route_name=~\"$httproute..+\"}[5m]))",
              "legendFormat": "avg",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 101,
          "title": "Throughput",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 2, "fillOpacity": 15, "showPoints": "never" }, "unit": "reqps" }
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 6 },
          "id": 4,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "title": "Request Rate",
          "type": "timeseries",
          "targets": [
            { "expr": "sum(rate(istio_requests_total{source_workload=~\"$gateway\", route_name=~\"$httproute..+\"}[5m]))", "legendFormat": "Total req/s", "refId": "A" },
            { "expr": "sum(rate(istio_requests_total{source_workload=~\"$gateway\", route_name=~\"$httproute..+\", response_code=~\"2..\"}[5m]))", "legendFormat": "2xx", "refId": "B" },
            { "expr": "sum(rate(istio_requests_total{source_workload=~\"$gateway\", route_name=~\"$httproute..+\", response_code=~\"4..\"}[5m]))", "legendFormat": "4xx", "refId": "C" },
            { "expr": "sum(rate(istio_requests_total{source_workload=~\"$gateway\", route_name=~\"$httproute..+\", response_code=~\"5..\"}[5m]))", "legendFormat": "5xx", "refId": "D" }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "id": 102,
          "title": "Latency",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }, "unit": "ms" }
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 15 },
          "id": 5,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "title": "Latency Percentiles",
          "type": "timeseries",
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(istio_request_duration_milliseconds_bucket{source_workload=~\"$gateway\", route_name=~\"$httproute..+\"}[5m])) by (le))", "legendFormat": "P50", "refId": "A" },
            { "expr": "histogram_quantile(0.90, sum(rate(istio_request_duration_milliseconds_bucket{source_workload=~\"$gateway\", route_name=~\"$httproute..+\"}[5m])) by (le))", "legendFormat": "P90", "refId": "B" },
            { "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{source_workload=~\"$gateway\", route_name=~\"$httproute..+\"}[5m])) by (le))", "legendFormat": "P95", "refId": "C" },
            { "expr": "histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{source_workload=~\"$gateway\", route_name=~\"$httproute..+\"}[5m])) by (le))", "legendFormat": "P99", "refId": "D" }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 },
          "id": 103,
          "title": "Status Codes",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 2, "fillOpacity": 30, "stacking": { "mode": "normal" }, "showPoints": "never" }, "unit": "reqps" }
          },
          "gridPos": { "h": 8, "w": 14, "x": 0, "y": 24 },
          "id": 6,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "title": "Status Code Distribution (rate)",
          "type": "timeseries",
          "targets": [
            { "expr": "sum by (response_code)(rate(istio_requests_total{source_workload=~\"$gateway\", route_name=~\"$httproute..+\"}[5m]))", "legendFormat": "{{response_code}}", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" } } },
          "gridPos": { "h": 8, "w": 10, "x": 14, "y": 24 },
          "id": 7,
          "options": { "legend": { "displayMode": "list", "placement": "right" }, "tooltip": { "mode": "single" }, "pieType": "donut", "reduceOptions": { "calcs": ["sum"] } },
          "title": "Status Code Breakdown",
          "type": "piechart",
          "targets": [
            { "expr": "sum by (response_code)(increase(istio_requests_total{source_workload=~\"$gateway\", route_name=~\"$httproute..+\"}[$__range]))", "legendFormat": "{{response_code}}", "refId": "A", "instant": true }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 32 },
          "id": 104,
          "title": "Per-Endpoint Breakdown",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }, "unit": "reqps" }
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 33 },
          "id": 8,
          "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max", "lastNotNull"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "title": "Request Rate by Endpoint",
          "type": "timeseries",
          "targets": [
            { "expr": "sum by (request_url_path)(rate(istio_requests_total{source_workload=~\"$gateway\", route_name=~\"$httproute..+\", request_url_path!=\"\"}[5m]))", "legendFormat": "{{request_url_path}}", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              { "matcher": { "id": "byName", "options": "Endpoint" }, "properties": [{ "id": "custom.width", "value": 350 }] },
              { "matcher": { "id": "byName", "options": "Req/s" }, "properties": [{ "id": "unit", "value": "reqps" }, { "id": "decimals", "value": 2 }] },
              { "matcher": { "id": "byName", "options": "P95 Latency (ms)" }, "properties": [{ "id": "unit", "value": "ms" }, { "id": "decimals", "value": 1 }] },
              { "matcher": { "id": "byName", "options": "Error %" }, "properties": [{ "id": "unit", "value": "percent" }, { "id": "decimals", "value": 2 }] }
            ]
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 41 },
          "id": 9,
          "options": { "showHeader": true, "sortBy": [{ "displayName": "Req/s", "desc": true }] },
          "title": "Endpoint Summary Table",
          "type": "table",
          "transformations": [
            { "id": "merge" },
            { "id": "organize", "options": { "renameByName": { "request_url_path": "Endpoint", "Value #A": "Req/s", "Value #B": "P95 Latency (ms)", "Value #C": "Error %" } } }
          ],
          "targets": [
            { "expr": "sum by (request_url_path)(rate(istio_requests_total{source_workload=~\"$gateway\", route_name=~\"$httproute..+\", request_url_path!=\"\"}[5m]))", "refId": "A", "instant": true, "format": "table" },
            { "expr": "histogram_quantile(0.95, sum by (le, request_url_path)(rate(istio_request_duration_milliseconds_bucket{source_workload=~\"$gateway\", route_name=~\"$httproute..+\", request_url_path!=\"\"}[5m])))", "refId": "B", "instant": true, "format": "table" },
            { "expr": "100 * sum by (request_url_path)(rate(istio_requests_total{source_workload=~\"$gateway\", route_name=~\"$httproute..+\", request_url_path!=\"\", response_code=~\"5..\"}[5m])) / sum by (request_url_path)(rate(istio_requests_total{source_workload=~\"$gateway\", route_name=~\"$httproute..+\", request_url_path!=\"\"}[5m]))", "refId": "C", "instant": true, "format": "table" }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 49 },
          "id": 105,
          "title": "Per-HTTPRoute Breakdown",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }, "unit": "reqps" }
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 50 },
          "id": 10,
          "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max", "lastNotNull"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "title": "Request Rate by HTTPRoute",
          "type": "timeseries",
          "targets": [
            { "expr": "sum by (httproute)(label_replace(rate(istio_requests_total{source_workload=~\"$gateway\", route_name=~\"$httproute..+\", route_name!=\"\"}[5m]), \"httproute\", \"$1\", \"route_name\", \"(.+).[0-9]+\"))", "legendFormat": "{{httproute}}", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              { "matcher": { "id": "byName", "options": "HTTPRoute" }, "properties": [{ "id": "custom.width", "value": 400 }] },
              { "matcher": { "id": "byName", "options": "Req/s" }, "properties": [{ "id": "unit", "value": "reqps" }, { "id": "decimals", "value": 2 }] },
              { "matcher": { "id": "byName", "options": "P95 Latency (ms)" }, "properties": [{ "id": "unit", "value": "ms" }, { "id": "decimals", "value": 1 }] },
              { "matcher": { "id": "byName", "options": "Error %" }, "properties": [{ "id": "unit", "value": "percent" }, { "id": "decimals", "value": 2 }] }
            ]
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 58 },
          "id": 11,
          "options": { "showHeader": true, "sortBy": [{ "displayName": "Req/s", "desc": true }] },
          "title": "HTTPRoute Summary Table",
          "type": "table",
          "transformations": [
            { "id": "merge" },
            { "id": "organize", "options": { "renameByName": { "httproute": "HTTPRoute", "Value #A": "Req/s", "Value #B": "P95 Latency (ms)", "Value #C": "Error %" } } }
          ],
          "targets": [
            { "expr": "sum by (httproute)(label_replace(rate(istio_requests_total{source_workload=~\"$gateway\", route_name=~\"$httproute..+\", route_name!=\"\"}[5m]), \"httproute\", \"$1\", \"route_name\", \"(.+).[0-9]+\"))", "refId": "A", "instant": true, "format": "table" },
            { "expr": "histogram_quantile(0.95, sum by (le, httproute)(label_replace(rate(istio_request_duration_milliseconds_bucket{source_workload=~\"$gateway\", route_name=~\"$httproute..+\", route_name!=\"\"}[5m]), \"httproute\", \"$1\", \"route_name\", \"(.+).[0-9]+\")))", "refId": "B", "instant": true, "format": "table" },
            { "expr": "100 * sum by (httproute)(label_replace(rate(istio_requests_total{source_workload=~\"$gateway\", route_name=~\"$httproute..+\", route_name!=\"\", response_code=~\"5..\"}[5m]), \"httproute\", \"$1\", \"route_name\", \"(.+).[0-9]+\")) / sum by (httproute)(label_replace(rate(istio_requests_total{source_workload=~\"$gateway\", route_name=~\"$httproute..+\", route_name!=\"\"}[5m]), \"httproute\", \"$1\", \"route_name\", \"(.+).[0-9]+\"))", "refId": "C", "instant": true, "format": "table" }
          ]
        }
      ]
    }
