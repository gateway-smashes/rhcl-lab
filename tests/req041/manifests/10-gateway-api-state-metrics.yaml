            - name: "created"
              help: "created timestamp"
              each:
                type: Gauge
                gauge:
                  path: [metadata, creationTimestamp]
            - name: "deleted"
              help: "deletion timestamp"
              each:
                type: Gauge
                gauge:
                  path: [metadata, deletionTimestamp]
                  nilIsZero: true
            - name: "parent_info"
              help: "Parent references that the tcproute wants to be attached to"
              each:
