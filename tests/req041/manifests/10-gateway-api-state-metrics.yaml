---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api-state-metrics
  namespace: rhcl-grafana
  labels:
    app.kubernetes.io/name: gateway-api-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-api-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-api-state-metrics
    spec:
      serviceAccountName: gateway-api-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.18.0
          args:
            - --custom-resource-state-config-file=/config/custom-resource-state.yaml
            - --custom-resource-state-only=true
          ports:
            - name: http-metrics
              containerPort: 8080
              protocol: TCP
            - name: telemetry
              containerPort: 8081
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gateway-api-state-metrics
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-api-state-metrics
  namespace: rhcl-grafana
  labels:
    app.kubernetes.io/name: gateway-api-state-metrics
spec:
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
      protocol: TCP
    - name: telemetry
      port: 8081
      targetPort: telemetry
      protocol: TCP
  selector:
    app.kubernetes.io/name: gateway-api-state-metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gateway-api-state-metrics
  namespace: rhcl-grafana
  labels:
    app.kubernetes.io/name: gateway-api-state-metrics
spec:
  endpoints:
    - port: http-metrics
      interval: 30s
      metricRelabelings:
        - sourceLabels: [exported_service]
          targetLabel: service
        - sourceLabels: [exported_namespace]
          targetLabel: namespace
        - action: labeldrop
          regex: exported_(service|namespace)
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-api-state-metrics
