# Global rate limit, all Gateway instances on the same site.
#
# How it works:
#   • RateLimitPolicy → translated by the Kuadrant Operator into entries on the
#     Limitador CR and rate-limit config on the Gateway's Envoy.
#   • Envoy (on any Gateway replica) consults the Limitador service
#     via gRPC. Since there is ONE single Limitador ClusterIP cluster, all
#     instances share the same counters.
#
# Lab default: Limitador with in-memory storage + 1 replica → this policy's "global"
# effectively spans the entire site.
#
# How to apply:
#   oc apply -f tests/rate-limiting/manifests/01-global-same-site.yaml
#
# Validate:
#   HOST=$(oc get httproute banking-api-connectivity -n rhcl-apps \
#          -o jsonpath='{.spec.hostnames[0]}')
#   for i in $(seq 1 25); do
#     curl -sk -o /dev/null -w "%{http_code}\n" "https://$HOST/api/echo"
#   done | sort | uniq -c
#   # Expected: ~20x 200 + ~5x 429
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: req061-global-same-site
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req61-65-ratelimit
    rhcl.poc/item: "61"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: banking-api-connectivity
  limits:
    global-burst:
      rates:
        - limit: 20
          window: 10s
