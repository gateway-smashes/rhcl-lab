# Rate-limit customization from custom fields.
#
# Demonstrates two kinds of custom counter coexisting in a single RLP:
#
#   1. per-customer-id   — key = header `x-customer-id`
#   2. per-source-ip     — key = source IP
#
# Important NOTE (discovered in the PoC):
#   Having 3+ entries in `limits` in a single RLP, especially mixing
#   counters that depend on `auth.identity` with counters that depend on
#   only `request.*`, triggers a bug where the wasm-shim cannot
#   evaluate all the actions correctly and nothing is limited. The fix
#   is to keep at most 2 entries in `limits` per RLP, or split into
#   multiple RLPs (each can only target the same resource once,
#   so use separate `RateLimitPolicy` objects with distinct targetRefs —
#   e.g. one on the route and another on the Gateway).
#
# For the `per-user` counter (auth.identity.userid), use the `RateLimitPolicy`
# generated by `PlanPolicy banking-api-plans` or create a dedicated RLP with a
# different targetRef (e.g. with sectionName).
#
# In CEL, any request or identity attribute becomes a counter
# key. Important: use SINGLE quotes inside the CEL — Kuadrant
# serializes the expression source as the descriptor key in Limitador,
# and nested double quotes break Limitador's CEL parser.
#
#   request.headers['x-customer-id']   # ✓ works
#   request.headers["x-customer-id"]   # ✗ breaks Limitador (parse error)
#   request.method
#   request.path
#   request.remote_address
#   auth.identity.userid               # see note above
#
# How to apply:
#   oc apply -f tests/rate-limiting/manifests/03-custom-counters.yaml
#
# Validate (in PARALLEL — sequential does not exceed a short window):
#   HOST=$(oc get httproute banking-api-connectivity -n rhcl-apps \
#          -o jsonpath='{.spec.hostnames[0]}')
#   { for i in $(seq 1 10); do
#       curl -sk -o /dev/null -w "%{http_code}\n" \
#         -H "x-customer-id: alpha" "https://$HOST/api/echo" &
#     done; wait; } | sort | uniq -c
#   # Expected: 5 OK + 5 limited (5/min limit on alpha)
#
#   { for i in $(seq 1 10); do
#       curl -sk -o /dev/null -w "%{http_code}\n" \
#         -H "x-customer-id: beta" "https://$HOST/api/echo" &
#     done; wait; } | sort | uniq -c
#   # Expected: 5 OK + 5 limited (beta counter INDEPENDENT of alpha)
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: req063-custom-counters
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req61-65-ratelimit
    rhcl.poc/item: "63"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: banking-api-connectivity
  limits:
    # Counter by custom header (multi-tenant ID injected by the client).
    per-customer-id:
      rates:
        - limit: 5
          window: 1m
      counters:
        - expression: "request.headers['x-customer-id']"
      when:
        - predicate: "request.headers['x-customer-id'] != ''"

    # Counter by source IP (anti-abuse, does not depend on auth)
    per-source-ip:
      rates:
        - limit: 30
          window: 1m
      counters:
        - expression: request.remote_address
