# Shared Redis in the same cluster (namespace shared-store).
#
# Em vez de um Redis gerenciado externo (Aiven/Upstash/ElastiCache), este
# manifest sobe um Redis dentro do cluster, num namespace dedicado
# `shared-store`. O Limitador (em kuadrant-system) aponta pra ele via
# Service DNS. Serves as the single counter backend — this is what makes the
# rate limit "global" and enables the multi-site scenario (each cluster points
# pro mesmo endpoint Redis).
#
# Imagem: quay.io/sclorg/redis-7-c9s — build SCL da Red Hat, roda como UID
# arbitrary UID (compatible with OpenShift's `restricted-v2` SCC), public
# (no pull secret). Reads the password from REDIS_PASSWORD.
#
# Como aplicar:
#   oc apply -f tests/rate-limiting/manifests/06-redis-shared-store.yaml
#   oc -n shared-store rollout status deploy/redis
#
# Depois aponte o Limitador (ver 02-limitador-redis.yaml).
#
# NOTE: emptyDir = volatile data (gone on pod restart). Enough for the
# rate-limit demo. In production: PVC + replication/Sentinel.
apiVersion: v1
kind: Namespace
metadata:
  name: shared-store
  labels:
    app.kubernetes.io/part-of: rhcl-req61-65-ratelimit
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: shared-store
  labels:
    app.kubernetes.io/part-of: rhcl-req61-65-ratelimit
type: Opaque
stringData:
  # Demo password — troque em qualquer uso fora de PoC.
  password: "rhcl-redis-demo"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: shared-store
  labels:
    app: redis
    app.kubernetes.io/part-of: rhcl-req61-65-ratelimit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: quay.io/sclorg/redis-7-c9s:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          ports:
            - containerPort: 6379
              protocol: TCP
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/redis/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: shared-store
  labels:
    app: redis
    app.kubernetes.io/part-of: rhcl-req61-65-ratelimit
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
