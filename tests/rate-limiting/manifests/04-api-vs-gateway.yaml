# Rate limit at the API and/or Gateway level, simultaneously.
#
# Scenario: the platform operator wants an ABSOLUTE CEILING at the Gateway
# (anti-DDoS, infra protection) AND the API team wants fine per-route
# limits. Both policies coexist; the composed granularity is:
#
#                      ┌──────────────┐
#                      │   Gateway    │  RLP (overrides) — ceiling
#                      │              │  E.g.: 200/min global
#                      └──────┬───────┘
#                             │
#                  ┌──────────┼──────────┐
#                  │                     │
#            ┌─────▼────┐          ┌─────▼────┐
#            │ HTTPRoute│          │ HTTPRoute│
#            │  bank-api│          │  other   │   RLP (defaults)
#            │ /api/v1  │          │ /api/x   │   E.g.: 50/min per API
#            └──────────┘          └──────────┘
#
# Gateway API semantics for same-class policies:
#   - `defaults`  on the Gateway policy: applied to routes that do NOT have
#                  their own policy. API-level overrides it.
#   - `overrides` on the Gateway policy: can NOT be overridden by
#                  API-level. Implements an "absolute ceiling".
#
# When both exist, Kuadrant composes them: the request must pass
# BOTH limits (the more restrictive one naturally prevails).
#
# How to apply (gateway-level only — the API-level already applied in
# 01-global-same-site.yaml):
#   oc apply -f tests/rate-limiting/manifests/04-api-vs-gateway.yaml
#   # Also apply 01 or 03 to have the API-level coexisting.
#
# Validate:
#   HOST=$(oc get httproute banking-api-connectivity -n rhcl-apps \
#          -o jsonpath='{.spec.hostnames[0]}')
#   for i in $(seq 1 60); do
#     curl -sk -o /dev/null -w "%{http_code}\n" "https://$HOST/api/echo"
#   done | sort | uniq -c
#   # Expected: 50 → 200 (api-level limit if 01-global=50/window),
#   # then 429 until the gateway window resets.
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: req064-gateway-ceiling
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: rhcl-req61-65-ratelimit
    rhcl.poc/item: "64"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: rhcl-apps-gateway
  # `defaults` — can be overridden by the HTTPRoute's RLP. Useful to
  # propose a "default" limit each API can adjust up or down.
  defaults:
    limits:
      gateway-default:
        rates:
          - limit: 100
            window: 1m
  # For an absolute ceiling that NOBODY at the API level can
  # override, swap `defaults:` for `overrides:`:
  #
  # overrides:
  #   limits:
  #     gateway-ceiling:
  #       rates:
  #         - limit: 200
  #           window: 1m
