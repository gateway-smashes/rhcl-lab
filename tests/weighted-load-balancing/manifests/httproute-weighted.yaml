# HTTPRoute to demonstrate weighted load balancing between the two
# versions of banking-api.
#
# How to apply (substitutes ${RHCL_ZONE_ROOT_DOMAIN} with the exported value):
#   export RHCL_ZONE_ROOT_DOMAIN=apps.example.com   # adjust for your lab
#   envsubst < tests/weighted-load-balancing/manifests/httproute-weighted.yaml | oc apply -f -
#
# The route attaches to the wildcard `*.${RHCL_ZONE_ROOT_DOMAIN}` Gateway created
# by the playbook (rhcl-apps-gateway in openshift-ingress) and exposes a neutral
# path (/api/whoami) that the gateway splits between the Services
# `banking-api-v1` and `banking-api-v2` according to the `weight` declared on each
# backendRef.
#
# Why /api/whoami as the neutral path
# -----------------------------------
# The banking-api-v1 and banking-api-v2 Deployments run the SAME image
# (apps_backend_image_name:latest); what differs between them is the env
# APP_INSTANCE_NAME, which Quarkus exposes in the `instance` field of responses.
# /api/whoami exists on both pods, is light, and returns `instance` (banking-
# api-v1 or banking-api-v2) — the source of truth for which Service the gateway
# chose for each call.
#
# Why NOT use URLRewrite per backendRef here
# ------------------------------------------
# The OpenShift Gateway API controller (openshift.io/gateway-controller/v1,
# Istio-based) declares `URLRewrite` only in `HTTPRouteRule.filters`,
# not in `HTTPBackendRef.filters`. Applying URLRewrite per backendRef makes the
# resource go `ResolvedRefs=False, reason=InvalidFilter,
# message="unsupported filter type URLRewrite"`. To identify the chosen
# version we use `RequestHeaderModifier` per backendRef (core support in
# Istio): the gateway injects `x-route-version: v1|v2` before forwarding and the
# backend echoes that header in the `allHeaders` field of the /api/whoami response.
#
# Default weights: 90 / 10 (canary). Edit the `weight` fields to vary the
# proportion (e.g. 50/50, 0/100). The gateway recalculates the split without restarting.
#
# Auxiliary paths (sanity check, unweighted):
#   /api/v1/accounts/summary -> 100% banking-api-v1
#   /api/v2/accounts/summary -> 100% banking-api-v2
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: banking-api-weighted
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req5-weighted
spec:
  parentRefs:
    - name: rhcl-apps-gateway
      namespace: openshift-ingress
  hostnames:
    - weighted.${RHCL_ZONE_ROOT_DOMAIN}
  rules:
    # Neutral path with weighted load balancing between v1 and v2.
    # The RequestHeaderModifier filter on each backendRef tags the call with
    # x-route-version=v1|v2 — reflected in allHeaders in the whoami response.
    - matches:
        - path:
            type: Exact
            value: /api/whoami
      backendRefs:
        - name: banking-api-v1
          port: 8080
          weight: 90
          filters:
            - type: RequestHeaderModifier
              requestHeaderModifier:
                set:
                  - name: x-route-version
                    value: v1
        - name: banking-api-v2
          port: 8080
          weight: 10
          filters:
            - type: RequestHeaderModifier
              requestHeaderModifier:
                set:
                  - name: x-route-version
                    value: v2

    # Comparison shortcut: forces 100% to banking-api-v1.
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: banking-api-v1
          port: 8080

    # Comparison shortcut: forces 100% to banking-api-v2.
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2
      backendRefs:
        - name: banking-api-v2
          port: 8080
