# HTTPRoute para demonstrar balanceamento de carga por peso entre as duas
# versions of banking-api.
#
# Como aplicar (substitui ${RHCL_ZONE_ROOT_DOMAIN} pelo valor exportado):
#   export RHCL_ZONE_ROOT_DOMAIN=apps.example.com   # ajuste para seu lab
#   envsubst < tests/weighted-load-balancing/manifests/httproute-weighted.yaml | oc apply -f -
#
# A rota fica anexada ao Gateway wildcard `*.${RHCL_ZONE_ROOT_DOMAIN}` criado
# by the playbook (rhcl-apps-gateway in openshift-ingress) and exposes a path
# neutro (/api/whoami) que o gateway distribui entre os Services
# `banking-api-v1` e `banking-api-v2` segundo o `weight` declarado em cada
# backendRef.
#
# Por que /api/whoami como path neutro
# ------------------------------------
# Os Deployments banking-api-v1 e banking-api-v2 rodam a MESMA imagem
# (apps_backend_image_name:latest); what differs between them is the env
# APP_INSTANCE_NAME, which Quarkus exposes in the `instance` field of responses.
# /api/whoami exists on both pods, is light, and returns `instance` (banking-
# api-v1 ou banking-api-v2) — fonte da verdade sobre qual Service o gateway
# escolheu para cada chamada.
#
# Por que NÃO usar URLRewrite por backendRef aqui
# -----------------------------------------------
# O controller do OpenShift Gateway API (openshift.io/gateway-controller/v1,
# baseado em Istio) declara `URLRewrite` apenas em `HTTPRouteRule.filters`,
# not in `HTTPBackendRef.filters`. Applying URLRewrite per backendRef makes the
# recurso virar com `ResolvedRefs=False, reason=InvalidFilter,
# message="unsupported filter type URLRewrite"`. To identify the version
# escolhida usamos `RequestHeaderModifier` por backendRef (suporte core no
# Istio): o gateway injeta `x-route-version: v1|v2` antes de encaminhar e o
# backend ecoa esse header no campo `allHeaders` da resposta de /api/whoami.
#
# Pesos default: 90 / 10 (canary). Edite os campos `weight` para variar a
# proportion (e.g. 50/50, 0/100). The gateway recalculates the split without restarting.
#
# Caminhos auxiliares (sanity check, sem peso):
#   /api/v1/accounts/summary -> 100% banking-api-v1
#   /api/v2/accounts/summary -> 100% banking-api-v2
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: banking-api-weighted
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req5-weighted
spec:
  parentRefs:
    - name: rhcl-apps-gateway
      namespace: openshift-ingress
  hostnames:
    - weighted.${RHCL_ZONE_ROOT_DOMAIN}
  rules:
    # Path neutro com weighted load balancing entre v1 e v2.
    # O filtro RequestHeaderModifier em cada backendRef marca a chamada com
    # x-route-version=v1|v2 — refletido em allHeaders na resposta do whoami.
    - matches:
        - path:
            type: Exact
            value: /api/whoami
      backendRefs:
        - name: banking-api-v1
          port: 8080
          weight: 90
          filters:
            - type: RequestHeaderModifier
              requestHeaderModifier:
                set:
                  - name: x-route-version
                    value: v1
        - name: banking-api-v2
          port: 8080
          weight: 10
          filters:
            - type: RequestHeaderModifier
              requestHeaderModifier:
                set:
                  - name: x-route-version
                    value: v2

    # Comparison shortcut: forces 100% to banking-api-v1.
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: banking-api-v1
          port: 8080

    # Comparison shortcut: forces 100% to banking-api-v2.
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2
      backendRefs:
        - name: banking-api-v2
          port: 8080
