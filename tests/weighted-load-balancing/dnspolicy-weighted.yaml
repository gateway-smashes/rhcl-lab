# Standalone demo manifest — DNSPolicy with weighted load balancing.
# Apply this manifest to EACH cluster that shares the same hostname,
# varying only the weight to reflect the share that cluster should
# receive via DNS.
#
# Cluster A → weight: 80
# Cluster B → weight: 20
apiVersion: kuadrant.io/v1
kind: DNSPolicy
metadata:
  name: rhcl-apps-gateway-dns
  namespace: openshift-ingress
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: rhcl-apps-gateway
  providerRefs:
    - name: rhcl-dns-credentials
  loadBalancing:
    defaultGeo: true
    weight: 80
