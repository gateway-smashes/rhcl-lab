apiVersion: kuadrant.io/v1alpha1
kind: TokenRateLimitPolicy
metadata:
  name: banking-api-chat-completions-token-limit
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req060-tokenratelimit
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: banking-api-connectivity
  limits:
    chat-completions:
      rates:
        - limit: 300
          window: 1m
      when:
        - predicate: request.path.startsWith("/api/v1/chat/completions")
      # Note (RHCL-native token counting):
      # The Limitador 2.3.1 on this cluster already exposes a global Prometheus counter
      # `authorized_hits{limitador_namespace="rhcl-apps/banking-api-connectivity"}`
      # incrementado pelo CEL de `add_n_to_counter` desta policy (≈ tokens autorizados
      # accumulated for this route). This is the RHCL-native "token counter" that
      # alimenta o dashboard do item 40 — sem precisar de Micrometer no
      # banking-api. Per-consumer breakdown requer `spec.counters` aqui, o que
      # would make the limit per-consumer (instead of global), and also depends on
      # labels Prometheus estendidos do Limitador (`spec.telemetry: exhaustive`
      # + `--metric-labels-default`) that in v2.3.1 do not cover `authorized_hits`.
      # Roadmap: see tests/per-route-token-counting/README.md → "Known limitations".
