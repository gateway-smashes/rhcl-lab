# PIX API — Secret de api-key DE DEMO. Labels acionam o selector da AuthPolicy
# (authorino.kuadrant.io/managed-by + app=pix-api-keys). Annotations user-id/plan-id
# ligam à PlanPolicy (predicate CEL casa em plan-id == "pix-bronze").
apiVersion: v1
kind: Secret
metadata:
  name: pix-api-key-tester
  namespace: rhcl-apps
  labels:
    authorino.kuadrant.io/managed-by: authorino
    app: pix-api-keys
    app.kubernetes.io/part-of: rhcl-req31-admin-api
  annotations:
    secret.kuadrant.io/user-id: "tester"
    secret.kuadrant.io/plan-id: "pix-bronze"
type: Opaque
stringData:
  api_key: "pix-tester-secret"
