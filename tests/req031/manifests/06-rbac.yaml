# PIX API — RBAC pra demonstração do caminho REST cru.
# Cria uma ServiceAccount com permissões pra CRUD em TODOS os CRs que compõem um
# produto de API neste ns. Token dessa SA é usado no create-via-k8s-api.sh pra
# bater direto no API server (prova "API administrativa" sem mediação de oc).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: req031-product-admin
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req31-admin-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: req031-product-admin
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req31-admin-api
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["devportal.kuadrant.io"]
    resources: ["apiproducts", "apikeys"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["extensions.kuadrant.io"]
    resources: ["planpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kuadrant.io"]
    resources: ["authpolicies", "ratelimitpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: req031-product-admin
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req31-admin-api
subjects:
  - kind: ServiceAccount
    name: req031-product-admin
    namespace: rhcl-apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: req031-product-admin
