# HorizontalPodAutoscaler for the Gateway API data plane (REQ 03).
#
# Target: the Deployment provisioned by the Istio Gateway API controller
# when the `Gateway rhcl-apps-gateway` is reconciled. In this lab the
# controller is the OpenShift ingress-managed istiod (controllerName
# `openshift.io/gateway-controller`), and the data plane workload lives in
# the `openshift-ingress` namespace under the name
# `rhcl-apps-gateway-istio`.
#
# Why CPU as AverageValue (not Utilization):
#   The Istio proxy container in the gateway data plane does not always
#   ship with `resources.requests.cpu` set — it depends on how the cluster
#   was bootstrapped. Without `requests.cpu`, an HPA targeting
#   Utilization stays at `<unknown>/...` forever. AverageValue lets the
#   HPA read the absolute CPU from `metrics.k8s.io` and trigger on a
#   per-pod budget (200m here), which works regardless of whether the
#   gateway pod has requests defined.
#
# How to apply:
#   oc apply -f tests/req003/manifests/hpa-gateway.yaml
#
# How to observe:
#   oc -n openshift-ingress get hpa rhcl-apps-gateway -w
#   oc -n openshift-ingress get pods \
#     -l gateway.networking.k8s.io/gateway-name=rhcl-apps-gateway -w
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rhcl-apps-gateway
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: rhcl-req03-hpa
    app.kubernetes.io/component: gateway-data-plane
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rhcl-apps-gateway-istio
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: AverageValue
          averageValue: 200m
    - type: Resource
      resource:
        name: memory
        target:
          type: AverageValue
          averageValue: 384Mi
  behavior:
    # Scale up fast: double the pod count (or +2) every 30s, short
    # stabilization to react to traffic spikes hitting the gateway.
    scaleUp:
      stabilizationWindowSeconds: 15
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
    # Scale down conservatively: at most 1 pod per minute, only after 5
    # minutes without pressure. The gateway data plane is on the request
    # path for every API call — flapping is more disruptive here than on
    # an application backend.
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
