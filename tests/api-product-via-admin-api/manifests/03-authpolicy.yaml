# PIX API — AuthPolicy: api-key required (header `api-key`), except OPTIONS preflight.
# Selector picks secrets labeled app=pix-api-keys (isolated from the banking-api keys).
# response.success.filters exports userid/plan-id to correlate with the PlanPolicy.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: pix-api-apikey
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req31-admin-api
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: pix-api-connectivity
  rules:
    authentication:
      cors-preflight:
        when:
          - predicate: "request.method == 'OPTIONS'"
        anonymous: {}
      api-key-header:
        when:
          - predicate: "request.method != 'OPTIONS'"
        apiKey:
          # true: Authorino looks for Secrets in ANY ns (Authorino lives in its own
          # ns — kuadrant-system; the api-key Secret lives in rhcl-apps). Without
          # this, Authorino does not see the Secret and returns 401 "missing api-key header".
          allNamespaces: true
          selector:
            matchLabels:
              authorino.kuadrant.io/managed-by: authorino
              app: pix-api-keys
        credentials:
          customHeader:
            name: api-key
    response:
      success:
        filters:
          identity:
            json:
              properties:
                userid:
                  selector: auth.identity.metadata.annotations.secret\.kuadrant\.io/user-id
                plan-id:
                  selector: auth.identity.metadata.annotations.secret\.kuadrant\.io/plan-id
        headers:
          # x-consumer-id: name of the api-key Secret (e.g., pix-api-key-tester).
          # Captured by the req041 Telemetry CR as label `request_headers_x_consumer_id`
          # on `istio_requests_total` → feeds the "Top consumers" card in the
          # custom-rhcl-console plugin (API Product detail).
          x-consumer-id:
            plain:
              selector: auth.identity.metadata.name
      unauthenticated:
        code: 401
        message:
          value: "Unauthorized: missing api-key header"
      unauthorized:
        code: 403
        message:
          value: "Forbidden: invalid api-key or no matching plan"
