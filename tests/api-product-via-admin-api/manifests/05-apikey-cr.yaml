# PIX API — APIKey CR do dev portal (objeto de request/approval que aparece na
# console). Cria em estado Pending; quando o admin aprova (status.phase=Approved),
# o developer-portal-controller materializa um Secret. Pra esta demo, a auth real
# already uses the fixed-value Secret (04-apikey-secret.yaml); this CR shows the
# "via API" governance flow — an admin can list, approve, revoke through the K8s API.
apiVersion: devportal.kuadrant.io/v1alpha1
kind: APIKey
metadata:
  name: pix-api-key-tester
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req31-admin-api
spec:
  apiProductRef:
    name: pix-api
  planTier: pix-bronze
  requestedBy:
    email: "tester@example.com"
    userId: "tester"
  useCase: "Demo do Item 31 — testar PIX API no plano bronze"
