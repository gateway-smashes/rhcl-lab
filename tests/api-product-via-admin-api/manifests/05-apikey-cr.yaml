# PIX API — dev portal APIKey CR (a request/approval object that appears in the
# console). Created in Pending state; when the admin approves (status.phase=Approved),
# the developer-portal-controller materializes a Secret. For this demo, real auth
# already uses the fixed-value Secret (04-apikey-secret.yaml); this CR shows the
# "via API" governance flow — an admin can list, approve, revoke through the K8s API.
apiVersion: devportal.kuadrant.io/v1alpha1
kind: APIKey
metadata:
  name: pix-api-key-tester
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req31-admin-api
spec:
  apiProductRef:
    name: pix-api
  planTier: pix-bronze
  requestedBy:
    email: "tester@example.com"
    userId: "tester"
  useCase: "Item 31 demo — test the PIX API on the bronze plan"
