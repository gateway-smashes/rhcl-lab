# PIX API — RBAC for the raw-REST path demo.
# Creates a ServiceAccount with permissions to CRUD ALL the CRs that make up an
# API product in this ns. That SA's token is used in create-via-k8s-api.sh to
# hit the API server directly (proves the "admin API" without oc mediation).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: req031-product-admin
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req31-admin-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: req031-product-admin
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req31-admin-api
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["devportal.kuadrant.io"]
    resources: ["apiproducts", "apikeys"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["extensions.kuadrant.io"]
    resources: ["planpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kuadrant.io"]
    resources: ["authpolicies", "ratelimitpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: req031-product-admin
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req31-admin-api
subjects:
  - kind: ServiceAccount
    name: req031-product-admin
    namespace: rhcl-apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: req031-product-admin
