# PIX API — PlanPolicy: tiers pix-gold (unlimited) and pix-bronze (5/min).
# CEL predicate matches the api-key's secret.kuadrant.io/plan-id annotation.
# Covers rate-limiting (does not use a separate RateLimitPolicy — avoids conflict).
apiVersion: extensions.kuadrant.io/v1alpha1
kind: PlanPolicy
metadata:
  name: pix-api-plans
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req31-admin-api
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: pix-api-connectivity
  plans:
    - tier: pix-gold
      predicate: |
        has(auth.identity) && auth.identity.metadata.annotations["secret.kuadrant.io/plan-id"] == "pix-gold"
    - tier: pix-bronze
      predicate: |
        has(auth.identity) && auth.identity.metadata.annotations["secret.kuadrant.io/plan-id"] == "pix-bronze"
      limits:
        custom:
          - limit: 5
            window: "1m"
