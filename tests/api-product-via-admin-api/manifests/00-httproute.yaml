# PIX API — HTTPRoute do produto novo. Path-based: /pix/v1/* (rewrite p/ /api/echo)
# on the SAME host as banking-api (banking-api-connectivity.<zone>), to avoid a Gateway
# change. The backend is banking-api-v1 (reuses the existing one — the new product is
# control-plane puro).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pix-api-connectivity
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req31-admin-api
spec:
  parentRefs:
    - name: rhcl-apps-gateway
      namespace: openshift-ingress
      sectionName: https
  hostnames:
    - "${HOST}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /pix/v1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/echo
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: x-product
                value: pix-api
              - name: x-rewrite-target
                value: /api/echo
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              - name: Access-Control-Allow-Origin
                value: "*"
              - name: Access-Control-Allow-Methods
                value: "GET,POST,OPTIONS"
              - name: Access-Control-Allow-Headers
                value: "content-type,api-key"
      backendRefs:
        - name: banking-api-v1
          port: 8080
