# PIX API — APIProduct (developer portal CR). Product metadata + targetRef
# for the HTTPRoute. publishStatus=Published makes it appear in the console/portal. The
# custom console + dev portal list it filtered by spec.targetRef.
apiVersion: devportal.kuadrant.io/v1alpha1
kind: APIProduct
metadata:
  name: pix-api
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: rhcl-req31-admin-api
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: pix-api-connectivity
  displayName: "PIX API"
  description: >-
    Item 31 demo — an API product created entirely via the administrative API
    (Kubernetes API). Path /pix/v1/* rewritten to /api/echo on the banking-api-v1 backend.
  version: "v1"
  approvalMode: manual
  publishStatus: Published
  tags:
    - demo
    - req031
    - pix
  contact:
    team: "RHCL PoC"
    email: "rhcl-poc@example.com"
