apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  namespace: keycloak
  labels: { app.kubernetes.io/part-of: rhcl-req71-oidc-jwt }
spec:
  secretName: keycloak-tls
  dnsNames:
    - keycloak.poc.rhcl.com.br
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
