# RoleBinding que permite ao ServiceAccount "default" do namespace req048-grpc
# puxar imagens do ImageStream "banking-api" no namespace rhcl-apps.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: req048-image-puller
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: req048-grpc-backend
    rhcl.poc/item: "48"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
- kind: ServiceAccount
  name: default
  namespace: req048-grpc
