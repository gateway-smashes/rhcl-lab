# RoleBinding that lets the "default" ServiceAccount of the req048-grpc namespace
# pull images from the "banking-api" ImageStream in the rhcl-apps namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: req048-image-puller
  namespace: rhcl-apps
  labels:
    app.kubernetes.io/part-of: req048-grpc-backend
    rhcl.poc/item: "48"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
- kind: ServiceAccount
  name: default
  namespace: req048-grpc
