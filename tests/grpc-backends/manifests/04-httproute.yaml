# HTTPRoute for req048 — routes gRPC traffic via the RHCL gateway.
#
# O gRPC usa paths no formato /package.Service/Method (ex:
# /io.gatewaysmashes.rhcl.grpc.BankingService/GetSummary). O HTTPRoute roteia
# all traffic (PathPrefix /) to the gRPC backend, with no URLRewrite,
# para que os paths gRPC cheguem intactos ao servidor.
#
# Placeholders substituted by the apply.sh script via sed:
#   {{ namespace }}         → req048-grpc
#   {{ gateway_name }}      → nome do gateway detectado
#   {{ gateway_namespace }} → openshift-ingress
#   {{ hostname }}          → req048-grpc.<CLUSTER_DOMAIN>
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: req048-grpc-route
  namespace: {{ namespace }}
  labels:
    app.kubernetes.io/part-of: req048-grpc-backend
    rhcl.poc/item: "48"
spec:
  parentRefs:
  - name: {{ gateway_name }}
    namespace: {{ gateway_namespace }}
    sectionName: req048-grpc
  hostnames:
  - "{{ hostname }}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: req048-grpc-backend
      port: 8080
