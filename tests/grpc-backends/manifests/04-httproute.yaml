# HTTPRoute for req048 — routes gRPC traffic via the RHCL gateway.
#
# gRPC uses paths in the format /package.Service/Method (e.g.
# /io.gatewaysmashes.rhcl.grpc.BankingService/GetSummary). The HTTPRoute routes
# all traffic (PathPrefix /) to the gRPC backend, with no URLRewrite,
# so that the gRPC paths reach the server intact.
#
# Placeholders substituted by the apply.sh script via sed:
#   {{ namespace }}         → req048-grpc
#   {{ gateway_name }}      → detected gateway name
#   {{ gateway_namespace }} → openshift-ingress
#   {{ hostname }}          → req048-grpc.<CLUSTER_DOMAIN>
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: req048-grpc-route
  namespace: {{ namespace }}
  labels:
    app.kubernetes.io/part-of: req048-grpc-backend
    rhcl.poc/item: "48"
spec:
  parentRefs:
  - name: {{ gateway_name }}
    namespace: {{ gateway_namespace }}
    sectionName: req048-grpc
  hostnames:
  - "{{ hostname }}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: req048-grpc-backend
      port: 8080
