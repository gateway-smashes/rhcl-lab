apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: rhcl-authorino
  namespace: rhcl-grafana
  labels:
    app.kubernetes.io/part-of: rhcl-poc
    rhcl.redhat.com/requirement: req041
spec:
  resyncPeriod: 5m
  instanceSelector:
    matchLabels:
      dashboards: rhcl
  json: >
    {
      "id": null,
      "uid": "rhcl-authorino",
      "title": "RHCL Authorino — Auth Decisions",
      "description": "Req 41 — Authorino auth evaluation rates, decision status, latency percentiles and per-instance breakdown.",
      "tags": ["rhcl", "kuadrant", "authorino", "req041"],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "schemaVersion": 38,
      "version": 1,
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "current": {},
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "definition": "label_values(auth_server_authconfig_total, namespace)",
            "hide": 0,
            "includeAll": true,
            "allValue": ".*",
            "multi": false,
            "name": "namespace",
            "label": "Namespace",
            "query": { "query": "label_values(auth_server_authconfig_total, namespace)", "refId": "namespace" },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          },
          {
            "current": {},
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "definition": "label_values(auth_server_authconfig_total{namespace=~\"$namespace\"}, pod)",
            "hide": 0,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "name": "pod",
            "label": "Pod",
            "query": { "query": "label_values(auth_server_authconfig_total{namespace=~\"$namespace\"}, pod)", "refId": "pod" },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Auth Decision Overview",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "id": 1,
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Total Evaluations",
          "type": "stat",
          "targets": [
            { "expr": "sum(increase(auth_server_authconfig_total{namespace=~\"$namespace\", pod=~\"$pod\"}[$__range]))", "legendFormat": "Total", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "id": 2,
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Auth Eval Rate",
          "type": "stat",
          "targets": [
            { "expr": "sum(rate(auth_server_authconfig_total{namespace=~\"$namespace\", pod=~\"$pod\"}[5m]))", "legendFormat": "evals/s", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "id": 3,
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "OK Rate",
          "type": "stat",
          "targets": [
            { "expr": "sum(rate(auth_server_authconfig_response_status{namespace=~\"$namespace\", pod=~\"$pod\", status=\"OK\"}[5m]))", "legendFormat": "OK/s", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.01 }] },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "id": 4,
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Denied Rate",
          "type": "stat",
          "targets": [
            { "expr": "sum(rate(auth_server_authconfig_response_status{namespace=~\"$namespace\", pod=~\"$pod\", status!=\"OK\"}[5m]))", "legendFormat": "denied/s", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 2, "fillOpacity": 20, "stacking": { "mode": "normal" }, "showPoints": "never" }, "unit": "reqps" }
          },
          "gridPos": { "h": 8, "w": 14, "x": 0, "y": 5 },
          "id": 5,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "title": "Auth Decisions / sec by Status",
          "type": "timeseries",
          "targets": [
            { "expr": "sum by (status)(rate(auth_server_authconfig_response_status{namespace=~\"$namespace\", pod=~\"$pod\"}[5m]))", "legendFormat": "{{status}}", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" } } },
          "gridPos": { "h": 8, "w": 10, "x": 14, "y": 5 },
          "id": 6,
          "options": { "legend": { "displayMode": "list", "placement": "right" }, "tooltip": { "mode": "single" }, "pieType": "donut", "reduceOptions": { "calcs": ["sum"] } },
          "title": "Auth Decision Distribution",
          "type": "piechart",
          "targets": [
            { "expr": "sum by (status)(increase(auth_server_authconfig_response_status{namespace=~\"$namespace\", pod=~\"$pod\"}[$__range]))", "legendFormat": "{{status}}", "refId": "A", "instant": true }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 13 },
          "id": 101,
          "title": "Auth Latency",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.1 }, { "color": "red", "value": 0.5 }] },
              "unit": "s"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 14 },
          "id": 7,
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Mean Auth Latency",
          "type": "stat",
          "targets": [
            { "expr": "sum(rate(auth_server_authconfig_duration_seconds_sum{namespace=~\"$namespace\", pod=~\"$pod\"}[5m])) / sum(rate(auth_server_authconfig_duration_seconds_count{namespace=~\"$namespace\", pod=~\"$pod\"}[5m]))", "legendFormat": "mean", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }, "unit": "s" }
          },
          "gridPos": { "h": 8, "w": 18, "x": 6, "y": 14 },
          "id": 8,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "title": "Auth Latency Percentiles",
          "type": "timeseries",
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(auth_server_authconfig_duration_seconds_bucket{namespace=~\"$namespace\", pod=~\"$pod\"}[5m])) by (le))", "legendFormat": "P50", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum(rate(auth_server_authconfig_duration_seconds_bucket{namespace=~\"$namespace\", pod=~\"$pod\"}[5m])) by (le))", "legendFormat": "P95", "refId": "B" },
            { "expr": "histogram_quantile(0.99, sum(rate(auth_server_authconfig_duration_seconds_bucket{namespace=~\"$namespace\", pod=~\"$pod\"}[5m])) by (le))", "legendFormat": "P99", "refId": "C" }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 22 },
          "id": 102,
          "title": "Per-Instance Breakdown",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }, "unit": "reqps" }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 23 },
          "id": 9,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max", "lastNotNull"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "title": "Evaluations / sec per Pod",
          "type": "timeseries",
          "targets": [
            { "expr": "sum by (pod)(rate(auth_server_authconfig_total{namespace=~\"$namespace\", pod=~\"$pod\"}[5m]))", "legendFormat": "{{pod}}", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }, "unit": "s" }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 23 },
          "id": 10,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max", "lastNotNull"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "title": "P95 Latency per Pod",
          "type": "timeseries",
          "targets": [
            { "expr": "histogram_quantile(0.95, sum by (le, pod)(rate(auth_server_authconfig_duration_seconds_bucket{namespace=~\"$namespace\", pod=~\"$pod\"}[5m])))", "legendFormat": "{{pod}}", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              { "matcher": { "id": "byName", "options": "Pod" }, "properties": [{ "id": "custom.width", "value": 400 }] },
              { "matcher": { "id": "byName", "options": "Instance" }, "properties": [{ "id": "custom.width", "value": 180 }] },
              { "matcher": { "id": "byName", "options": "Evals/s" }, "properties": [{ "id": "unit", "value": "reqps" }, { "id": "decimals", "value": 2 }] },
              { "matcher": { "id": "byName", "options": "OK/s" }, "properties": [{ "id": "unit", "value": "reqps" }, { "id": "decimals", "value": 2 }] },
              { "matcher": { "id": "byName", "options": "P50 (s)" }, "properties": [{ "id": "unit", "value": "s" }, { "id": "decimals", "value": 4 }] },
              { "matcher": { "id": "byName", "options": "P95 (s)" }, "properties": [{ "id": "unit", "value": "s" }, { "id": "decimals", "value": 4 }] },
              { "matcher": { "id": "byName", "options": "P99 (s)" }, "properties": [{ "id": "unit", "value": "s" }, { "id": "decimals", "value": 4 }] }
            ]
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 31 },
          "id": 11,
          "options": { "showHeader": true, "sortBy": [{ "displayName": "Evals/s", "desc": true }] },
          "title": "Instance Summary Table",
          "type": "table",
          "transformations": [
            { "id": "merge" },
            { "id": "organize", "options": { "renameByName": { "pod": "Pod", "instance": "Instance", "Value #A": "Evals/s", "Value #B": "OK/s", "Value #C": "P50 (s)", "Value #D": "P95 (s)", "Value #E": "P99 (s)" } } }
          ],
          "targets": [
            { "expr": "sum by (pod, instance)(rate(auth_server_authconfig_total{namespace=~\"$namespace\", pod=~\"$pod\"}[5m]))", "refId": "A", "instant": true, "format": "table" },
            { "expr": "sum by (pod, instance)(rate(auth_server_authconfig_response_status{namespace=~\"$namespace\", pod=~\"$pod\", status=\"OK\"}[5m]))", "refId": "B", "instant": true, "format": "table" },
            { "expr": "histogram_quantile(0.50, sum by (le, pod, instance)(rate(auth_server_authconfig_duration_seconds_bucket{namespace=~\"$namespace\", pod=~\"$pod\"}[5m])))", "refId": "C", "instant": true, "format": "table" },
            { "expr": "histogram_quantile(0.95, sum by (le, pod, instance)(rate(auth_server_authconfig_duration_seconds_bucket{namespace=~\"$namespace\", pod=~\"$pod\"}[5m])))", "refId": "D", "instant": true, "format": "table" },
            { "expr": "histogram_quantile(0.99, sum by (le, pod, instance)(rate(auth_server_authconfig_duration_seconds_bucket{namespace=~\"$namespace\", pod=~\"$pod\"}[5m])))", "refId": "E", "instant": true, "format": "table" }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 39 },
          "id": 103,
          "title": "Kuadrant Policy Status",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 40 },
          "id": 12,
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Authorino Ready",
          "type": "stat",
          "targets": [
            { "expr": "kuadrant_component_ready{component=\"authorino\"}", "legendFormat": "Ready", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 40 },
          "id": 13,
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Total AuthPolicies",
          "type": "stat",
          "targets": [
            { "expr": "kuadrant_policies_total{kind=\"AuthPolicy\"}", "legendFormat": "Total", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 40 },
          "id": 14,
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "AuthPolicies Enforced",
          "type": "stat",
          "targets": [
            { "expr": "kuadrant_policies_enforced{kind=\"AuthPolicy\", status=\"true\"}", "legendFormat": "Enforced", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 40 },
          "id": 15,
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "AuthPolicies Not Enforced",
          "type": "stat",
          "targets": [
            { "expr": "kuadrant_policies_enforced{kind=\"AuthPolicy\", status=\"false\"}", "legendFormat": "Not Enforced", "refId": "A" }
          ]
        }
      ]
    }
